<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Social Media for Businesses | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const SOCIAL_ICON = `<svg viewBox="0 0 64 64"><circle cx="18" cy="32" r="9" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/><circle cx="46" cy="16" r="9" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/><circle cx="46" cy="48" r="9" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/><line x1="25" y1="28" x2="39" y2="19" stroke="#15803d" stroke-width="3"/><line x1="25" y1="36" x2="39" y2="45" stroke="#15803d" stroke-width="3"/></svg>`;

runLesson({
  lessonId: "marketing-branding-2-1",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "Social Media for Businesses",
  subtitle: "Learn how brands use posts and videos to reach real customers.",
  steps: [
    {
      type: "vocab",
      word: "Engagement",
      pronounce: "say it: en-GAYJ-ment",
      definition: "<b>Engagement</b> means people liking, commenting, sharing, or reacting to your posts, it shows people are actually paying attention.",
      example: "A post with 200 likes and 40 comments has way more engagement than one with just 2 likes.",
      icon: SOCIAL_ICON
    },
    {
      type: "teach",
      title: "Picking the Right Platform",
      body: "Different platforms fit different businesses. Short fun videos do great on TikTok/Reels. Behind-the-scenes photos do great on Instagram. Community groups do great on Facebook. Pick where YOUR customers already hang out.",
      examples: ["Short videos → TikTok/Reels", "Photos → Instagram", "Community → Facebook groups"]
    },
    {
      type: "teach",
      title: "Post With a Purpose",
      body: "The best posts do ONE of three things: teach something useful, show behind-the-scenes, or make people smile. Random posts with no purpose get ignored, purposeful posts get engagement.",
      examples: ["Teach something", "Show behind-the-scenes", "Make people smile"]
    },
    {
      type: "mc",
      question: "What does \"engagement\" mean on social media?",
      hint: "Think likes, comments, shares.",
      options: [
        { text: "People liking, commenting, and reacting to your posts", correct: true },
        { text: "How many followers you started with", correct: false },
        { text: "The price of your product", correct: false },
        { text: "How long a video is", correct: false }
      ],
      correctMsg: "Right! Engagement shows people are actually paying attention.",
      wrongMsg: "Engagement is likes, comments, and shares, it shows real attention, not just followers."
    },
    {
      type: "mc",
      question: "A kid-run cookie business wants to show fun behind-the-scenes baking clips. Best platform choice?",
      hint: "Think short video format.",
      options: [
        { text: "A short-video app like TikTok or Reels", correct: true },
        { text: "A printed newspaper ad only", correct: false },
        { text: "A fax machine", correct: false },
        { text: "A billboard with no photos", correct: false }
      ],
      correctMsg: "Yes! Short fun videos fit platforms built for short fun videos.",
      wrongMsg: "For behind-the-scenes video clips, a short-video platform is the natural fit."
    },
    {
      type: "mc",
      question: "FINAL: Which post is MOST likely to get real engagement?",
      hint: "Purpose beats random.",
      options: [
        { text: "A random post with no message and a blurry photo", correct: false },
        { text: "A quick, fun video teaching 1 tip customers actually want to know", correct: true },
        { text: "Posting the exact same thing every single hour", correct: false },
        { text: "Never posting at all", correct: false }
      ],
      correctMsg: "PERFECT! Purposeful, useful, or fun content earns real engagement.",
      wrongMsg: "Posts with a clear purpose, teaching, entertaining, or showing behind-the-scenes, earn engagement."
    }
  ],
  badges: [
    { icon: "starter", name: "Social Starter", earned: true },
    { icon: "star", name: "Platform Picker", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Content Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Social Media Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
