<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asking the Right Questions | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const QUESTION_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2.5"/><text x="32" y="42" font-size="32" fill="#5b21b6" text-anchor="middle" font-weight="900">?</text></svg>`;

runLesson({
  lessonId: "market-research-1-3",
  courseUrl: "course-market-research.html",
  tag: "UNIT 1 · LESSON 1.3",
  title: "Asking the Right Questions",
  subtitle: "How the way you ask a question changes the honesty of the answer",
  steps: [
    {
      type: "vocab",
      word: "Leading Question",
      pronounce: "say it: LEE-ding KWES-chun",
      definition: "A <b>leading question</b> is one that pushes the person toward a specific answer, instead of letting them answer honestly.",
      example: "\"Don't you think this app is amazing?\" is a leading question, it pressures people to say yes.",
      icon: QUESTION_ICON
    },
    {
      type: "teach",
      title: "Neutral Questions Get Honest Answers",
      body: "Good research questions are neutral and open-ended, letting people answer in their own words. Avoid leading questions that hint at the \"right\" answer. Compare: \"Don't you love this feature?\" (leading) vs. \"What do you think of this feature?\" (neutral). The second gets you the TRUTH, even if it's not what you hoped to hear.",
      examples: ["Leading: \"Don't you think X is great?\"", "Neutral: \"What do you think about X?\"", "Neutral questions reveal the real truth"]
    },
    {
      type: "mc",
      question: "What is a \"leading question\"?",
      hint: "Think about pushing toward an answer.",
      options: [
        { text: "A question that pushes someone toward a specific answer", correct: true },
        { text: "A question with no possible answer at all", correct: false },
        { text: "The very first question in any survey", correct: false },
        { text: "A question only asked by professional researchers", correct: false }
      ],
      correctMsg: "Right! A leading question nudges people toward a specific response.",
      wrongMsg: "A leading question pushes someone toward a specific answer, rather than letting them answer honestly."
    },
    {
      type: "mc",
      question: "Which question is more NEUTRAL and likely to get an honest answer?",
      hint: "Look for one that doesn't hint at the answer.",
      options: [
        { text: "\"What do you think about this pricing?\"", correct: true },
        { text: "\"Don't you agree this price is totally fair?\"", correct: false },
        { text: "\"You'd pay for this, right?\"", correct: false },
        { text: "\"Isn't this the best price you've ever seen?\"", correct: false }
      ],
      correctMsg: "Yes! That's a neutral, open question with no hint toward a \"right\" answer.",
      wrongMsg: "A neutral question like \"What do you think about this pricing?\" doesn't hint at a desired answer."
    },
    {
      type: "mc",
      question: "Why is it risky to only ask leading questions during research?",
      hint: "Think about false confidence.",
      options: [
        { text: "You might get falsely positive answers that don't reflect people's real opinions", correct: true },
        { text: "Leading questions are illegal to ask anyone", correct: false },
        { text: "People always refuse to answer leading questions", correct: false },
        { text: "It has zero effect on the honesty of the answers", correct: false }
      ],
      correctMsg: "Correct! Leading questions risk misleadingly positive results that hide real opinions.",
      wrongMsg: "Leading questions risk getting falsely positive answers that don't reflect people's true opinions."
    }
  ],
  badges: [
    { icon: "bulb", name: "Questions Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Interview Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Questioning Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
