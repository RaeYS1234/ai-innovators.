<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI for Surveys & Analysis — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const SENTIMENT_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><circle cx="22" cy="26" r="3" fill="#78350f"/><circle cx="42" cy="26" r="3" fill="#78350f"/><path d="M20 40 Q32 50 44 40" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

runLesson({
  lessonId: "market-research-2-1",
  courseUrl: "course-market-research.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "AI for Surveys & Analysis",
  subtitle: "Letting AI read hundreds of responses so you don't have to do it by hand",
  steps: [
    {
      type: "vocab",
      word: "Sentiment Analysis",
      pronounce: "say it: SEN-tih-ment uh-NAL-ih-sis",
      definition: "<b>Sentiment analysis</b> is using AI to automatically detect whether text expresses positive, negative, or neutral feelings.",
      example: "Feeding 200 customer reviews into an AI tool that sorts them into \"happy,\" \"neutral,\" and \"frustrated\" categories is sentiment analysis.",
      icon: SENTIMENT_ICON
    },
    {
      type: "teach",
      title: "AI Reads Faster Than You Ever Could",
      body: "Reading 300 open-ended survey responses by hand could take hours. AI can summarize themes, group similar answers, and flag sentiment in minutes. This doesn't replace human judgment — you still decide what matters — but it massively speeds up the first pass through large amounts of feedback.",
      examples: ["AI can summarize hundreds of responses fast", "Sentiment analysis flags positive vs negative feelings", "You still make the final judgment calls"]
    },
    {
      type: "mc",
      question: "What is \"sentiment analysis\"?",
      hint: "Think about detecting feelings in text.",
      options: [
        { text: "Using AI to detect whether text expresses positive, negative, or neutral feelings", correct: true },
        { text: "Counting the exact number of words in a survey", correct: false },
        { text: "A method for designing survey questions", correct: false },
        { text: "A type of customer discount", correct: false }
      ],
      correctMsg: "Right! Sentiment analysis detects the emotional tone of text.",
      wrongMsg: "Sentiment analysis uses AI to detect whether text expresses positive, negative, or neutral feelings."
    },
    {
      type: "mc",
      question: "What's a MAIN benefit of using AI to help analyze survey responses?",
      hint: "Think about speed at scale.",
      options: [
        { text: "It can summarize and group hundreds of responses far faster than doing it by hand", correct: true },
        { text: "It guarantees every customer will be 100% happy", correct: false },
        { text: "It eliminates the need to ever collect data at all", correct: false },
        { text: "It replaces the need to make any decisions", correct: false }
      ],
      correctMsg: "Correct! Speed at scale is the biggest benefit of AI-assisted analysis.",
      wrongMsg: "AI can summarize and group large amounts of feedback far faster than manual review."
    },
    {
      type: "mc",
      question: "Does AI-assisted analysis REPLACE the need for human judgment?",
      hint: "Think about who makes the final call.",
      options: [
        { text: "No — AI speeds up the first pass, but humans still decide what matters most", correct: true },
        { text: "Yes, humans should never review AI's summaries", correct: false },
        { text: "AI analysis is always 100% perfect with zero mistakes", correct: false },
        { text: "AI can only be used for surveys under 5 responses", correct: false }
      ],
      correctMsg: "Exactly! AI speeds things up, but humans still make the final judgment calls.",
      wrongMsg: "AI speeds up the initial analysis, but humans still need to interpret and decide what matters."
    }
  ],
  badges: [
    { icon: "bulb", name: "AI Analyst Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Data Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Survey AI Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
