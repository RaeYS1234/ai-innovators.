<script src="lesson-engine.js"></script>
<script>
const MARKETING_ICON = `<svg viewBox="0 0 64 64"><path d="M6 26 L22 20 L22 44 L6 38 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 17 L54 6 L54 58 L22 47 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/><rect x="10" y="38" width="7" height="15" rx="2" fill="#78350f"/><circle cx="44" cy="32" r="5" fill="white" opacity="0.55"/></svg>`;

runLesson({
  lessonId: "marketing-branding-1-1",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "What is Marketing?",
  subtitle: "Learn how businesses get the word out!",
  steps: [
    {
      type: "vocab",
      word: "Marketing",
      pronounce: "say it: MAR-ket-ing",
      definition: "<b>Marketing</b> means <b>telling people about your business</b> so they want to buy from you! It's how customers find out you exist.",
      example: "If you make cookies and put up a sign that says 'Yummy Cookies Here!' — that's marketing!",
      icon: MARKETING_ICON
    },
    {
      type: "teach",
      title: "Marketing = Telling People!",
      body: "Every business needs marketing — even if it makes the BEST product ever! If nobody knows about it, nobody can buy it. Marketing is how you shout (nicely!) about your business to the whole world.",
      examples: ["Signs", "Social media posts", "Word of mouth", "Ads"]
    },
    {
      type: "mc",
      question: "What does \"marketing\" mean?",
      hint: "Think about what it does for a business.",
      options: [
        { text: "Telling people about your business", correct: true },
        { text: "Making the product", correct: false },
        { text: "Counting your money", correct: false },
        { text: "Cleaning your room", correct: false }
      ],
      correctMsg: "Boom! Marketing = telling people about what you sell.",
      wrongMsg: "Marketing isn't about making the product — it's about telling people it exists!"
    },
    {
      type: "mc",
      question: "Why does even the BEST product need marketing?",
      hint: "What happens if nobody knows about it?",
      options: [
        { text: "So people know it exists and can buy it", correct: true },
        { text: "So it tastes better", correct: false },
        { text: "So it's cheaper to make", correct: false },
        { text: "It doesn't need marketing", correct: false }
      ],
      correctMsg: "You got it! No marketing means nobody knows to buy it.",
      wrongMsg: "Even a perfect product needs marketing — otherwise nobody knows it exists!"
    },
    {
      type: "mc",
      question: "Which of these is an example of marketing?",
      hint: "Which one is about telling people?",
      options: [
        { text: "Posting a video about your lemonade stand", correct: true },
        { text: "Squeezing lemons", correct: false },
        { text: "Counting your coins", correct: false },
        { text: "Washing cups", correct: false }
      ],
      correctMsg: "Yes! Posting about it tells people to come buy.",
      wrongMsg: "Squeezing lemons is making the product — posting about it is the marketing part!"
    },
    {
      type: "mc",
      question: "What's the GOAL of marketing?",
      hint: "It's all about how customers feel.",
      options: [
        { text: "Get people excited to buy from you", correct: true },
        { text: "Make the product taste better", correct: false },
        { text: "Hide your business", correct: false },
        { text: "Spend all your money", correct: false }
      ],
      correctMsg: "Exactly! Marketing gets people excited and ready to buy.",
      wrongMsg: "Marketing's job is to get people excited about buying from you."
    }
  ],
  badges: [
    { icon: "bulb", name: "Marketing Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Marketing Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Future Marketer", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
