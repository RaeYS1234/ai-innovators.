<script>
runLesson({
  lessonId: "prompt-engineering-3-1",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 3 · PRACTICE",
  title: "Prompts for Writing",
  subtitle: "Practice crafting prompts for emails, essays, and creative writing",
  steps: [
    {
      type: "teach",
      title: "Writing Prompts Need Voice & Audience",
      body: "Good writing prompts specify: the TYPE of writing (email, essay, story), the AUDIENCE (who's reading it), the TONE (formal, playful, persuasive), and the LENGTH. Skipping any of these leaves the AI guessing, and guesses rarely match your exact voice.",
      examples: []
    },
    {
      type: "mc",
      question: "Which prompt is best for getting a well-targeted piece of writing?",
      hint: "Look for audience + tone + length.",
      options: [
        { text: "\"Write a 150-word blog intro for teenage entrepreneurs, in an upbeat, motivating tone.\"", correct: true },
        { text: "\"Write a blog.\"", correct: false },
        { text: "\"Words please.\"", correct: false },
        { text: "\"Blog thing, whatever.\"", correct: false }
      ],
      correctMsg: "Yes! It specifies length, audience, and tone.",
      wrongMsg: "The strongest prompt specifies length, audience, and tone, all key writing details."
    },
    {
      type: "mc",
      question: "A founder wants a formal investor email but keeps getting overly casual results. What's likely missing from their prompt?",
      hint: "Think about tone instructions.",
      options: [
        { text: "A clear tone instruction, like \"formal and professional\"", correct: true },
        { text: "The word \"email\" was never used", correct: false },
        { text: "The prompt was far too long", correct: false },
        { text: "Nothing, tone can't be controlled by prompting", correct: false }
      ],
      correctMsg: "Correct! Without a tone instruction, the AI guesses, often defaulting to casual.",
      wrongMsg: "Without an explicit tone instruction like \"formal,\" the AI may default to a casual style."
    },
    {
      type: "mc",
      question: "Why is specifying the AUDIENCE important in a writing prompt?",
      hint: "Think about vocabulary and complexity.",
      options: [
        { text: "It shapes vocabulary, complexity, and examples to match who's actually reading", correct: true },
        { text: "It has no effect on the writing at all", correct: false },
        { text: "It only matters for scientific papers", correct: false },
        { text: "Audience can only be specified using numbers", correct: false }
      ],
      correctMsg: "Exactly! Audience shapes vocabulary and complexity to fit the reader.",
      wrongMsg: "Specifying the audience helps the AI choose the right vocabulary, complexity, and examples."
    },
    {
      type: "mc",
      question: "A student wants a short poem about persistence for a school project. Which detail would sharpen the prompt MOST?",
      hint: "Think about length and style specifics.",
      options: [
        { text: "\"8 lines, rhyming, upbeat tone, appropriate for a middle school assembly\"", correct: true },
        { text: "\"Poem please, thanks\"", correct: false },
        { text: "\"Make it about anything\"", correct: false },
        { text: "\"I don't know what I want\"", correct: false }
      ],
      correctMsg: "Right! Specific length, style, tone, and context sharpen the request a lot.",
      wrongMsg: "Adding specific length, rhyme style, tone, and context creates a much sharper, more useful prompt."
    }
  ],
  badges: [
    { icon: "bulb", name: "Writing Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Voice Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Writing Prompts Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
