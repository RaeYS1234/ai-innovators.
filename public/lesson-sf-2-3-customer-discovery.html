<script>
runLesson({
  lessonId: "startup-fundamentals-2-3",
  courseUrl: "course-startup-fundamentals.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Customer Discovery",
  subtitle: "Practice asking the RIGHT questions to learn what customers really need",
  steps: [
    {
      type: "teach",
      title: "Ask About the Past, Not the Future",
      body: "The #1 rule of customer discovery: ask about what people HAVE done, not what they THINK they'd do. People are bad at predicting their own future behavior but great at describing real past problems. \"Have you ever struggled with X?\" beats \"Would you use a product that does X?\" every time.",
      examples: []
    },
    {
      type: "mc",
      question: "Which question is a BETTER customer discovery question?",
      hint: "Past behavior beats future guesses.",
      options: [
        { text: "\"Tell me about the last time you tried to solve this problem.\"", correct: true },
        { text: "\"Would you maybe use an app like this someday?\"", correct: false },
        { text: "\"Do you like cool new apps?\"", correct: false },
        { text: "\"Isn't this a great idea?\"", correct: false }
      ],
      correctMsg: "Yes! Asking about a real past experience gets honest, useful answers.",
      wrongMsg: "Questions about real past experiences give much more honest, useful answers than hypotheticals."
    },
    {
      type: "mc",
      question: "Why is \"Would you use this?\" a WEAK discovery question?",
      hint: "Think about how people answer politely.",
      options: [
        { text: "People often say yes to be nice, even if they'd never actually use it", correct: true },
        { text: "It's too hard for people to understand", correct: false },
        { text: "It's illegal to ask that question", correct: false },
        { text: "Nobody has ever answered that question before", correct: false }
      ],
      correctMsg: "Exactly! People are often overly polite, so hypothetical questions get unreliable answers.",
      wrongMsg: "People tend to give overly polite \"yes\" answers to hypothetical questions, even if untrue."
    },
    {
      type: "mc",
      question: "A founder interviews 10 people and 9 say \"I've never really had this problem.\" What should they do?",
      hint: "Listen to the data, even if it's disappointing.",
      options: [
        { text: "Seriously reconsider whether this problem is worth building a solution for", correct: true },
        { text: "Ignore the feedback and build it anyway", correct: false },
        { text: "Only interview people who will agree with them", correct: false },
        { text: "Assume the 10 people are all lying", correct: false }
      ],
      correctMsg: "Correct! Real feedback, even disappointing feedback, should shape your next move.",
      wrongMsg: "If most people say the problem isn't real for them, that's important signal to listen to."
    },
    {
      type: "mc",
      question: "What's a good customer discovery follow-up after someone describes a problem?",
      hint: "Dig deeper into the pain.",
      options: [
        { text: "\"How are you dealing with that problem right now?\"", correct: true },
        { text: "\"So you'll definitely buy my product, right?\"", correct: false },
        { text: "\"Do you want to invest in my company?\"", correct: false },
        { text: "Nothing, end the conversation immediately", correct: false }
      ],
      correctMsg: "Yes! Learning their CURRENT workaround reveals how painful the problem really is.",
      wrongMsg: "Asking how they currently handle the problem reveals how painful (or not) it really is."
    }
  ],
  badges: [
    { icon: "bulb", name: "Discovery Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Interview Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Discovery Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
