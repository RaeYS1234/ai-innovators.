<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>No-Code Tools With AI | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const NOCODE_ICON = `<svg viewBox="0 0 64 64"><rect x="8" y="12" width="20" height="16" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="36" y="12" width="20" height="16" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="22" y="38" width="20" height="16" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/><line x1="18" y1="28" x2="28" y2="38" stroke="#2563eb" stroke-width="2"/><line x1="46" y1="28" x2="36" y2="38" stroke="#2563eb" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "build-mvps-2-1",
  courseUrl: "course-build-mvps.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "No-Code Tools With AI",
  subtitle: "Building working products without writing traditional code",
  steps: [
    {
      type: "vocab",
      word: "No-Code Tool",
      pronounce: "say it: NOH-KOHD TOOL",
      definition: "A <b>no-code tool</b> lets you build websites, apps, or automations using visual building blocks instead of writing programming code.",
      example: "Building a working website by dragging and dropping sections, instead of writing HTML by hand, uses a no-code tool.",
      icon: NOCODE_ICON
    },
    {
      type: "teach",
      title: "Build Fast Without Learning to Code First",
      body: "No-code tools let founders build a real, working MVP without needing years of coding experience. Many now include AI features, describe what you want in plain English, and the tool generates the layout, workflow, or automation for you. This is huge for testing ideas quickly, especially for founders who aren't (yet) programmers.",
      examples: ["Build real products with visual blocks, not code", "AI features can generate layouts from plain English", "Great for testing ideas fast, without coding first"]
    },
    {
      type: "mc",
      question: "What is a \"no-code tool\"?",
      hint: "Think about visual building blocks.",
      options: [
        { text: "A tool that lets you build products using visual blocks instead of writing code", correct: true },
        { text: "A tool that only professional programmers are allowed to use", correct: false },
        { text: "A legal requirement for launching any business", correct: false },
        { text: "A tool that deletes all code from a project", correct: false }
      ],
      correctMsg: "Right! No-code tools use visual building blocks instead of programming code.",
      wrongMsg: "A no-code tool lets you build products using visual blocks instead of writing traditional code."
    },
    {
      type: "mc",
      question: "How do AI features in modern no-code tools help founders build even faster?",
      hint: "Think about plain English instructions.",
      options: [
        { text: "You can describe what you want in plain English, and AI generates the layout or workflow", correct: true },
        { text: "AI features remove the need to have any idea at all", correct: false },
        { text: "They only work for professional software engineers", correct: false },
        { text: "AI features make no-code tools slower to use", correct: false }
      ],
      correctMsg: "Correct! Describing your goal in plain English and letting AI generate the structure speeds things up a lot.",
      wrongMsg: "AI features let you describe your goal in plain English, and the tool generates the layout or workflow for you."
    },
    {
      type: "mc",
      question: "Why are no-code tools especially valuable for founders who aren't experienced programmers?",
      hint: "Think about accessibility.",
      options: [
        { text: "They allow building a real, working MVP without years of coding experience first", correct: true },
        { text: "They require MORE coding knowledge than traditional programming", correct: false },
        { text: "They can only be used by people who already know how to code", correct: false },
        { text: "They have no benefit for non-programmers at all", correct: false }
      ],
      correctMsg: "Exactly! No-code tools let non-programmers build a working MVP quickly.",
      wrongMsg: "No-code tools let founders build a real, working MVP without needing years of coding experience first."
    }
  ],
  badges: [
    { icon: "bulb", name: "No-Code Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Builder Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "No-Code Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
