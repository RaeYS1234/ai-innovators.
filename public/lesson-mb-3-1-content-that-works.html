<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>What Makes Content Work — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const SPARK_ICON = `<svg viewBox="0 0 64 64"><polygon points="32,4 38,26 60,32 38,38 32,60 26,38 4,32 26,26" fill="#a855f7" stroke="#7e22ce" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "marketing-branding-3-1",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 3 · LESSON 3.1",
  title: "What Makes Content Work",
  subtitle: "Not all posts are equal — learn the secrets behind content people actually stop for.",
  steps: [
    {
      type: "vocab",
      word: "Hook",
      pronounce: "say it: hook",
      definition: "A <b>hook</b> is the first few seconds or words of your content — its whole job is to stop someone from scrolling past.",
      example: "\"I made $50 in one day with THIS simple idea...\" is a hook. \"Hi, today I want to talk about business\" is not.",
      icon: SPARK_ICON
    },
    {
      type: "teach",
      title: "The 3 E's of Great Content",
      body: "Content that works usually does one of the 3 E's: <b>Educates</b> (teaches something useful), <b>Entertains</b> (makes people laugh or smile), or <b>Emotionally connects</b> (feels real and relatable). Boring content skips all three.",
      examples: ["Educates", "Entertains", "Emotionally connects"]
    },
    {
      type: "mc",
      question: "What is a \"hook\" in content?",
      hint: "Think about the very first moment.",
      options: [
        { text: "The opening that grabs attention and stops the scroll", correct: true },
        { text: "The last sentence of a post", correct: false },
        { text: "The price of the product", correct: false },
        { text: "A type of fishing tool only", correct: false }
      ],
      correctMsg: "Right! A hook grabs attention in the first few seconds.",
      wrongMsg: "A hook is the attention-grabbing opening — it has to stop the scroll fast."
    },
    {
      type: "mc",
      question: "Which of these is a strong hook for a video about a lemonade business?",
      hint: "Curiosity + a promise.",
      options: [
        { text: "\"Hi, so today I'll talk about lemonade for a while\"", correct: false },
        { text: "\"I turned $5 into $200 in ONE weekend — here's how\"", correct: true },
        { text: "\"Lemonade.\"", correct: false },
        { text: "\"This might be boring but here goes\"", correct: false }
      ],
      correctMsg: "Yes! That's exciting, specific, and makes you want to keep watching.",
      wrongMsg: "A strong hook is exciting and specific — it makes people curious right away."
    },
    {
      type: "mc",
      question: "Which type of post uses the \"Educates\" E?",
      hint: "Think about teaching something.",
      options: [
        { text: "\"3 quick tips to keep lemonade cold all day\"", correct: true },
        { text: "A random blurry photo with no caption", correct: false },
        { text: "Just a logo with no words", correct: false },
        { text: "A blank page", correct: false }
      ],
      correctMsg: "Exactly! Teaching a useful tip is a classic \"educate\" post.",
      wrongMsg: "The tips post teaches something useful — that's the \"Educate\" E in action."
    },
    {
      type: "mc",
      question: "FINAL: A post gets tons of comments and shares because it made people laugh out loud. Which E is that?",
      hint: "Think about the feeling it gave people.",
      options: [
        { text: "Entertains", correct: true },
        { text: "Educates", correct: false },
        { text: "None of the E's", correct: false },
        { text: "It's just luck, no E applies", correct: false }
      ],
      correctMsg: "PERFECT! Making people laugh is the \"Entertain\" E working perfectly.",
      wrongMsg: "Content that makes people laugh is using the \"Entertain\" E."
    }
  ],
  badges: [
    { icon: "starter", name: "Content Creator", earned: true },
    { icon: "star", name: "Hook Master", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Content Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Content Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
