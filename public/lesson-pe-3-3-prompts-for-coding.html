  </div>
  <div class="screen active" id="screen-welcome">

      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>

<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "prompt-engineering-3-3",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 3 · PRACTICE",
  title: "Prompts for Coding",
  subtitle: "Practice writing prompts that get working, useful code",
  steps: [
    {
      type: "teach",
      title: "Code Needs Precision",
      body: "Coding prompts benefit hugely from precision: state the programming LANGUAGE, what the code should DO (inputs and outputs), any LIBRARIES or constraints, and ask for comments explaining tricky parts. Vague coding requests often produce code that runs but doesn't do quite what you needed.",
      examples: []
    },
    {
      type: "mc",
      question: "Which prompt is most likely to get correct, useful code?",
      hint: "Look for language + exact behavior.",
      options: [
        { text: "\"Write a Python function that takes a list of prices and returns the average, rounded to 2 decimal places.\"", correct: true },
        { text: "\"Write code.\"", correct: false },
        { text: "\"Make a program.\"", correct: false },
        { text: "\"Fix my thing.\"", correct: false }
      ],
      correctMsg: "Yes! It specifies the language, the exact task, and the output format.",
      wrongMsg: "The best coding prompt names the language, exact task, and expected output format."
    },
    {
      type: "mc",
      question: "A student pastes broken code and says \"fix it.\" What's missing that would help the AI fix it correctly?",
      hint: "Think about what info a helper would need.",
      options: [
        { text: "A description of the error message and what the code was SUPPOSED to do", correct: true },
        { text: "Nothing, \"fix it\" always contains all needed information", correct: false },
        { text: "The code needs to be deleted first", correct: false },
        { text: "It should be rewritten in a different human language, not code", correct: false }
      ],
      correctMsg: "Correct! The error message and intended behavior are key missing context.",
      wrongMsg: "Sharing the error message and the intended behavior gives the AI what it needs to fix the code correctly."
    },
    {
      type: "mc",
      question: "Why is it helpful to ask the AI to add COMMENTS explaining tricky parts of generated code?",
      hint: "Think about learning and reviewing.",
      options: [
        { text: "It helps you understand and verify what the code is actually doing", correct: true },
        { text: "Comments make code run faster", correct: false },
        { text: "Comments are required by every programming language", correct: false },
        { text: "It has no real benefit at all", correct: false }
      ],
      correctMsg: "Exactly! Comments help you understand and double-check the code's logic.",
      wrongMsg: "Comments help you understand and verify what the generated code is actually doing."
    },
    {
      type: "mc",
      question: "A founder wants a JavaScript function but forgets to mention the language. What's the risk?",
      hint: "Think about ambiguity.",
      options: [
        { text: "The AI might guess the wrong language or ask for clarification, wasting time", correct: true },
        { text: "No risk, AI can only ever write JavaScript", correct: false },
        { text: "The prompt becomes illegal to submit", correct: false },
        { text: "The code will always be written in French", correct: false }
      ],
      correctMsg: "Right! Leaving out the language creates ambiguity that can lead to wasted back-and-forth.",
      wrongMsg: "Without specifying the language, the AI may guess wrong or need clarification, costing time."
    }
  ],
  badges: [
    { icon: "bulb", name: "Coding Prompts Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Precision Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Coding Prompts Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
