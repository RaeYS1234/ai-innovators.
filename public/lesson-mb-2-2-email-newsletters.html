<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Email & Newsletters | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const MAIL_ICON = `<svg viewBox="0 0 64 64"><rect x="6" y="14" width="52" height="36" rx="4" fill="white" stroke="#0284c7" stroke-width="3"/><path d="M6 16 L32 38 L58 16" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

runLesson({
  lessonId: "marketing-branding-2-2",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 2 · LESSON 2.2",
  title: "Email & Newsletters",
  subtitle: "Discover why email is one of the most powerful marketing tools ever.",
  steps: [
    {
      type: "vocab",
      word: "Newsletter",
      pronounce: "say it: NOOZ-let-ur",
      definition: "A <b>newsletter</b> is an email a business sends regularly to people who signed up, sharing updates, deals, or useful tips.",
      example: "A cookie business might send a weekly newsletter with new flavors and a coupon code.",
      icon: MAIL_ICON
    },
    {
      type: "teach",
      title: "Why Email Still Works",
      body: "Unlike social media posts that disappear in a scroll, email lands directly in someone's inbox. People who give you their email ALREADY like your business, that's a warm audience, not strangers.",
      examples: ["Lands in the inbox", "Doesn't get lost in a feed", "Reaches people who already like you"]
    },
    {
      type: "teach",
      title: "What Makes People Open an Email",
      body: "A great <b>subject line</b> (the preview text you see first) is short, clear, and makes people curious or excited, like \"New Summer Flavor + a Surprise 🍋\" instead of just \"Update.\"",
      examples: ["Short and clear", "Creates curiosity", "Hints at value inside"]
    },
    {
      type: "mc",
      question: "What is a newsletter?",
      hint: "Think regular emails.",
      options: [
        { text: "A regular email sharing updates, deals, or tips with subscribers", correct: true },
        { text: "A paper flyer only", correct: false },
        { text: "A one-time text message", correct: false },
        { text: "A billboard ad", correct: false }
      ],
      correctMsg: "Right! It's a regular email to people who signed up.",
      wrongMsg: "A newsletter is a regular email with updates, deals, or tips, sent to subscribers."
    },
    {
      type: "mc",
      question: "Why is an email list valuable, even a small one?",
      hint: "Think about who's on it.",
      options: [
        { text: "The people on it already like your business", correct: true },
        { text: "It's worthless compared to social media", correct: false },
        { text: "Emails always get deleted immediately", correct: false },
        { text: "Nobody reads email anymore", correct: false }
      ],
      correctMsg: "Yes! An email list is a warm, interested audience.",
      wrongMsg: "People on your list already chose to follow your business, that makes them valuable."
    },
    {
      type: "mc",
      question: "FINAL: Which subject line is MOST likely to get opened?",
      hint: "Short, clear, curious.",
      options: [
        { text: "\"Update\"", correct: false },
        { text: "\"New Summer Flavor + a Surprise 🍋\"", correct: true },
        { text: "\"Email #47\"", correct: false },
        { text: "\"(no subject)\"", correct: false }
      ],
      correctMsg: "PERFECT! Clear, exciting, and makes you want to know more.",
      wrongMsg: "A great subject line is short, clear, and sparks curiosity or excitement."
    }
  ],
  badges: [
    { icon: "starter", name: "Inbox Starter", earned: true },
    { icon: "star", name: "Subject Line Pro", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Email Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Newsletter Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
