<script>
runLesson({
  lessonId: "build-mvps-3-2",
  courseUrl: "course-build-mvps.html",
  tag: "UNIT 3 · PRACTICE",
  title: "Build the Frontend",
  subtitle: "Practice building the part of the MVP users actually see and touch",
  steps: [
    {
      type: "teach",
      title: "Only Build the Screens You Truly Need",
      body: "The frontend is what users see and interact with. For an MVP, build only the screens necessary to test your core idea, a settings page, an about page, or a fancy onboarding flow can usually wait. AI and no-code tools can generate a working screen fast from a plain description, letting you focus more time on getting real user feedback.",
      examples: []
    },
    {
      type: "mc",
      question: "What is the \"frontend\" of a product?",
      hint: "Think about what users see and touch.",
      options: [
        { text: "The part of the product users actually see and interact with", correct: true },
        { text: "The internal database storing all the data", correct: false },
        { text: "The legal paperwork behind a company", correct: false },
        { text: "The company's hiring process", correct: false }
      ],
      correctMsg: "Right! The frontend is what users directly see and interact with.",
      wrongMsg: "The frontend is the part of the product that users actually see and interact with."
    },
    {
      type: "mc",
      question: "For an early MVP, which screens should usually be built FIRST?",
      hint: "Think about the core testable feature.",
      options: [
        { text: "Only the screens necessary to test the core idea", correct: true },
        { text: "Every possible screen, including settings and About pages", correct: false },
        { text: "No screens at all, skip building the frontend entirely", correct: false },
        { text: "Only screens unrelated to the core idea", correct: false }
      ],
      correctMsg: "Correct! Focus only on the screens needed to test the core idea first.",
      wrongMsg: "For an early MVP, build only the screens necessary to test the core idea, extras can wait."
    },
    {
      type: "mc",
      question: "How can AI or no-code tools help when building an MVP's frontend?",
      hint: "Think about speed from a description.",
      options: [
        { text: "They can generate a working screen quickly from a plain-English description", correct: true },
        { text: "They remove the need to ever test with real users", correct: false },
        { text: "They only work for backend databases, never frontends", correct: false },
        { text: "They make frontend building slower and more complicated", correct: false }
      ],
      correctMsg: "Exactly! AI and no-code tools can generate working screens fast from plain descriptions.",
      wrongMsg: "AI and no-code tools can generate a working screen quickly from a plain-English description."
    }
  ],
  badges: [
    { icon: "bulb", name: "Frontend Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "UI Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Frontend Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
