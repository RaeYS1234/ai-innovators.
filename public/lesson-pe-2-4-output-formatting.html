<script>
runLesson({
  lessonId: "prompt-engineering-2-4",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Output Formatting",
  subtitle: "Practice telling the AI exactly HOW to structure its answer",
  steps: [
    {
      type: "teach",
      title: "Ask for the Shape You Need",
      body: "AI can output plain paragraphs, bullet lists, numbered steps, tables, or even structured data like JSON, but only if you ask. Specifying the format upfront (\"give me a table with columns for Name, Price, and Rating\") saves you from having to manually reformat a wall of text afterward.",
      examples: []
    },
    {
      type: "mc",
      question: "Which prompt best requests a specific OUTPUT FORMAT?",
      hint: "Look for structure instructions.",
      options: [
        { text: "\"List 5 marketing ideas as a numbered list, one sentence each.\"", correct: true },
        { text: "\"Give me marketing ideas.\"", correct: false },
        { text: "\"Marketing please.\"", correct: false },
        { text: "\"Help.\"", correct: false }
      ],
      correctMsg: "Yes! Specifying \"numbered list, one sentence each\" is a clear format request.",
      wrongMsg: "Asking for a numbered list with a sentence limit clearly specifies the desired output format."
    },
    {
      type: "mc",
      question: "A founder needs to compare 3 competitors side by side. What output format should they request?",
      hint: "Think about side-by-side comparisons.",
      options: [
        { text: "A table with rows for each competitor and columns for key details", correct: true },
        { text: "A single run-on sentence combining everything", correct: false },
        { text: "A single emoji", correct: false },
        { text: "No format at all, just guess randomly", correct: false }
      ],
      correctMsg: "Correct! A table is ideal for clear, side-by-side comparisons.",
      wrongMsg: "A table with rows and columns makes side-by-side comparisons much easier to read."
    },
    {
      type: "mc",
      question: "Why is it helpful to specify output format UPFRONT in your prompt, rather than reformatting the answer yourself afterward?",
      hint: "Think about saving effort.",
      options: [
        { text: "It saves time and gets you a usable result immediately", correct: true },
        { text: "It has zero effect on the final result", correct: false },
        { text: "AI is incapable of following format instructions", correct: false },
        { text: "It always makes responses factually incorrect", correct: false }
      ],
      correctMsg: "Exactly! Asking upfront saves you from manually restructuring the response later.",
      wrongMsg: "Specifying format upfront saves time by getting a usable, structured result right away."
    },
    {
      type: "mc",
      question: "Which phrase would help you get a response formatted as clean, structured data (like for a spreadsheet)?",
      hint: "Think about data formats.",
      options: [
        { text: "\"Format the response as JSON with fields for name, price, and category.\"", correct: true },
        { text: "\"Write me a poem about spreadsheets.\"", correct: false },
        { text: "\"Just say yes or no.\"", correct: false },
        { text: "\"Respond only in emojis.\"", correct: false }
      ],
      correctMsg: "Right! Explicitly requesting a structured format like JSON gets clean, usable data.",
      wrongMsg: "Explicitly asking for a structured format like JSON with named fields produces clean, usable data."
    }
  ],
  badges: [
    { icon: "bulb", name: "Formatting Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Structure Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Formatting Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
