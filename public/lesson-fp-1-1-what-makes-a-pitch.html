<script>
const PITCH_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><circle cx="32" cy="32" r="17" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><circle cx="32" cy="32" r="8" fill="#7c3aed"/><path d="M 44 20 L 54 10 M 47 10 L 54 10 L 54 17" stroke="#4c1d95" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

runLesson({
  lessonId: "first-pitch-1-1",
  courseUrl: "course-first-pitch.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "What Makes a Great Pitch?",
  subtitle: "The anatomy of a pitch that actually gets a yes, problem, solution, market, traction, ask.",
  steps: [
    {
      type: "vocab",
      word: "Pitch",
      pronounce: "say it: PITCH",
      definition: "A <b>pitch</b> is a short, focused presentation where you convince someone, an investor, a customer, a judge, to believe in your idea and take action in just a few minutes. Every strong pitch hits five targets in order: the <b>problem</b>, your <b>solution</b>, the <b>market</b>, your <b>traction</b>, and <b>the ask</b>.",
      example: "Ryan Kaji started reviewing toys on YouTube at age 3. He never gave an investor pitch, but his channel, Ryan's World, proved something every founder needs to prove: that real people want what you're offering. That channel grew into a $50 million-plus licensing empire.",
      icon: PITCH_ICON
    },
    {
      type: "teach",
      title: "The 5 Parts of Every Pitch",
      body: "Strip away the slides and the nerves, and every winning pitch, from a school fundraiser to a Shark Tank deal, answers the same five questions in the same order: What's broken (<b>Problem</b>)? How do you fix it (<b>Solution</b>)? Who else has this problem, and how many of them are there (<b>Market</b>)? Do people already want it (<b>Traction</b>)? And what do you need from me right now (<b>The Ask</b>)? Skip a step and your listener gets confused. Nail all five and they're already nodding along before you finish.",
      examples: ["Problem, what's broken", "Solution, your fix", "Market, who & how many", "Traction, proof it works", "The Ask, what you need"]
    },
    {
      type: "teach",
      title: "Why Order Matters",
      body: "Founders who love their idea often want to lead with the solution, 'I built an app that...' But investors and judges don't care about a solution until they understand the problem is real and painful. That's why the problem always comes first: it earns the right to be heard. Only after someone agrees 'yeah, that IS annoying' will they actually listen to how you fix it.",
      examples: ["Problem earns attention", "Solution earns interest", "Market earns scale", "Traction earns trust", "Ask earns a decision"]
    },
    {
      type: "mc",
      question: "Which part of a pitch should almost always come FIRST?",
      hint: "What has to feel real before anyone cares about your fix?",
      options: [
        { text: "The Ask", correct: false },
        { text: "The Problem", correct: true },
        { text: "Your company logo", correct: false },
        { text: "A joke to break the ice", correct: false }
      ],
      correctMsg: "Exactly! The problem comes first, it earns the right to be heard before you explain your fix.",
      wrongMsg: "The Problem comes first. Until your listener believes the problem is real, they won't care about your solution."
    },
    {
      type: "mc",
      question: "What does the 'Market' part of a pitch actually explain?",
      hint: "Think about size and audience, not the product itself.",
      options: [
        { text: "How the product looks", correct: false },
        { text: "Who else has this problem, and roughly how many of them exist", correct: true },
        { text: "What color the logo is", correct: false },
        { text: "The founder's personal hobbies", correct: false }
      ],
      correctMsg: "Right! Market explains the size of the audience, not everyone loves a tiny market.",
      wrongMsg: "The Market section explains who else shares this problem and how many people that is, your addressable audience."
    },
    {
      type: "mc",
      question: "What is 'traction' in a pitch?",
      hint: "It's proof, not a promise.",
      options: [
        { text: "A guess about future sales", correct: false },
        { text: "Real evidence people already want or use what you're offering, users, sales, growth", correct: true },
        { text: "The number of slides in your deck", correct: false },
        { text: "How loud you speak", correct: false }
      ],
      correctMsg: "Yes! Traction is proof, real users, real sales, real growth, not a hopeful guess.",
      wrongMsg: "Traction means real evidence people already want your offering, like signups, sales, or repeat customers, not a hopeful guess about the future."
    },
    {
      type: "mc",
      question: "What is 'the ask' in a pitch?",
      hint: "It's the one thing you want the listener to DO.",
      options: [
        { text: "A vague hope that something good happens", correct: false },
        { text: "The specific thing you want from the listener right now, money, a sale, a yes", correct: true },
        { text: "A thank-you at the very end", correct: false },
        { text: "The name of your company", correct: false }
      ],
      correctMsg: "Correct! A strong ask is specific, a dollar amount, a purchase, a clear yes.",
      wrongMsg: "The ask is the SPECIFIC thing you want from the listener, a dollar amount to invest, a sale to make, or a clear yes. Vague asks get vague answers."
    },
    {
      type: "mc",
      question: "Ryan Kaji's channel, Ryan's World, is a real example of what pitch concept?",
      hint: "What did his huge audience of viewers prove, without him ever pitching an investor?",
      options: [
        { text: "A perfect slide deck design", correct: false },
        { text: "Traction, real proof that a massive audience wanted what he made", correct: true },
        { text: "A great logo", correct: false },
        { text: "The ask", correct: false }
      ],
      correctMsg: "Yes! His audience and views WERE the traction, proof people wanted it, long before licensing deals came in.",
      wrongMsg: "Ryan's World shows traction: millions of real viewers proved demand existed, that proof became the foundation for a $50M+ licensing empire."
    }
  ],
  badges: [
    { icon: "starter", name: "Pitch Starter", earned: true },
    { icon: "bulb", name: "Idea Spotter", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Pitch Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Founder-in-Training", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
