<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Your Business Logo — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">PRACTICE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Design It!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Logo Designer!</h1>
    <p class="complete-subtitle">You built a real logo prompt from scratch. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — even top designers redraft!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "ai-pictures-2-2",
  courseUrl: "course-ai-pictures.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Make Your Business Logo",
  subtitle: "Build a strong logo prompt step by step, then judge some real examples!",
  steps: [
    {
      type: "mc",
      question: "Business: \"Sunny Sips\" lemonade stand. Which logo prompt covers business name + symbol + colors + style?",
      hint: "Look for all four pieces.",
      options: [
        { text: "\"a circle logo with a lemon slice for 'Sunny Sips', yellow and blue, flat cartoon style\"", correct: true },
        { text: "\"lemonade\"", correct: false },
        { text: "\"a nice logo\"", correct: false },
        { text: "\"yellow circle\"", correct: false }
      ],
      correctMsg: "Yes! Name, symbol, colors, and style all included.",
      wrongMsg: "A strong logo prompt needs the business name, a symbol, colors, AND a style."
    },
    {
      type: "mc",
      question: "Which logo below is TOO complicated for a real logo (too many tiny details)?",
      hint: "Simple wins.",
      options: [
        { text: "A logo with 15 tiny objects, 3 fonts, and 8 colors", correct: true },
        { text: "One clean paw print in a single color", correct: false },
        { text: "A simple star shape with the business name", correct: false },
        { text: "A round badge with one icon and two colors", correct: false }
      ],
      correctMsg: "Right! Too many details make a logo hard to recognize, especially small.",
      wrongMsg: "The busiest option is the wrong pick — great logos are simple, not crowded."
    },
    {
      type: "mc",
      question: "Business: \"Bright Ideas Tutoring.\" Which symbol connects best?",
      hint: "Think about tutoring and learning.",
      options: [
        { text: "A lightbulb", correct: true },
        { text: "A pizza slice", correct: false },
        { text: "A skateboard", correct: false },
        { text: "A fish", correct: false }
      ],
      correctMsg: "Perfect! A lightbulb connects to bright ideas and learning.",
      wrongMsg: "Pick a symbol that connects to the business meaning — a lightbulb fits 'Bright Ideas'."
    },
    {
      type: "mc",
      question: "FINAL: You made 3 AI logo drafts. None feel quite right yet. What's the smartest next step?",
      hint: "Design is a process, not one try.",
      options: [
        { text: "Tweak the prompt with clearer details and generate more options", correct: true },
        { text: "Give up on having a logo", correct: false },
        { text: "Pick the worst one just to be done", correct: false },
        { text: "Never use AI for logos again", correct: false }
      ],
      correctMsg: "PERFECT! Real designers refine and try again — that's how great logos happen.",
      wrongMsg: "Refining your prompt and generating more options is exactly how you land on a great logo."
    }
  ],
  badges: [
    { icon: "starter", name: "Logo Drafter", earned: true },
    { icon: "star", name: "Symbol Spotter", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Design Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Logo Designer", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
