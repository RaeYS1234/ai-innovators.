      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>

  </div>

      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>

    <div class="badge-grid" id="badgeGrid"></div>

  </div>

</div>

  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>

<script src="lesson-engine.js"></script>
<script>
const MAGNIFY_ICON = `<svg viewBox="0 0 64 64"><circle cx="26" cy="26" r="18" fill="white" stroke="#0369a1" stroke-width="4"/><line x1="39" y1="39" x2="56" y2="56" stroke="#0369a1" stroke-width="6" stroke-linecap="round"/><path d="M18 26 A8 8 0 0 1 26 18" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

runLesson({
  lessonId: "startup-fundamentals-2-1",
  courseUrl: "course-startup-fundamentals.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "Finding the Problem",
  subtitle: "Every great startup starts with a real problem, not just a cool idea",
  steps: [
    {
      type: "vocab",
      word: "Product-Market Fit",
      pronounce: "say it: PRAH-duct MAR-ket FIT",
      definition: "<b>Product-market fit</b> is when your product solves a real problem so well that customers want it and keep coming back.",
      example: "Before product-market fit, customers barely notice you. After it, customers pull the product from you faster than you can supply it.",
      icon: MAGNIFY_ICON
    },
    {
      type: "teach",
      title: "Start With the Problem, Not the Idea",
      body: "Founders often fall in love with a cool IDEA first, then struggle to find people who need it. The stronger path: find a real, painful PROBLEM people already have, then build the smallest solution that fixes it. Problems that are frequent, painful, and expensive to leave unsolved make the best starting points.",
      examples: ["Is the problem frequent?", "Is it painful?", "Are people already trying (and failing) to solve it?"]
    },
    {
      type: "mc",
      question: "What is \"product-market fit\"?",
      hint: "Think about customers wanting your product.",
      options: [
        { text: "When your product solves a real problem well enough that customers want and keep using it", correct: true },
        { text: "When your logo matches your website colors", correct: false },
        { text: "When you have more employees than competitors", correct: false },
        { text: "When your product costs the least in the market", correct: false }
      ],
      correctMsg: "Right! Product-market fit means real demand for what you built.",
      wrongMsg: "Product-market fit is about customers genuinely wanting and using your solution."
    },
    {
      type: "mc",
      question: "Which is the SMARTER way to start a startup?",
      hint: "Problem first, or idea first?",
      options: [
        { text: "Find a real, painful problem first, then build a solution", correct: true },
        { text: "Build a cool idea first, then hope someone needs it", correct: false },
        { text: "Copy a random product with no research", correct: false },
        { text: "Skip research and guess what people want", correct: false }
      ],
      correctMsg: "Yes! Starting from a real problem gives you a much better shot at product-market fit.",
      wrongMsg: "Starting from a real, validated problem is smarter than starting from just a cool idea."
    },
    {
      type: "mc",
      question: "What makes a problem a GOOD one to build a startup around?",
      hint: "Three qualities matter most.",
      options: [
        { text: "It's frequent, painful, and hard for people to solve on their own", correct: true },
        { text: "It only affects one person in the world", correct: false },
        { text: "Nobody has ever noticed the problem before", correct: false },
        { text: "It's mildly annoying but nobody minds it", correct: false }
      ],
      correctMsg: "Exactly! Frequent + painful + hard-to-solve problems make the strongest starting points.",
      wrongMsg: "The best startup problems are frequent, painful, and difficult for people to solve alone."
    },
    {
      type: "mc",
      question: "How can a founder check if a problem is REAL before building anything?",
      hint: "Think about talking to people.",
      options: [
        { text: "Talk to potential customers and see if they already struggle with it", correct: true },
        { text: "Just assume it's real and start building immediately", correct: false },
        { text: "Ask only friends and family who won't ever use the product", correct: false },
        { text: "Never talk to anyone until launch day", correct: false }
      ],
      correctMsg: "Correct! Talking to real potential customers is the best way to validate a problem.",
      wrongMsg: "Talking directly to potential customers is the best way to confirm a problem is real."
    }
  ],
  badges: [
    { icon: "bulb", name: "Problem Finder", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Fit Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Problem Detective", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
