<script>
const INVESTOR_ICON = `<svg viewBox="0 0 64 64"><rect x="10" y="34" width="12" height="20" fill="#059669" stroke="#065f46" stroke-width="2"/><rect x="26" y="24" width="12" height="30" fill="#10b981" stroke="#065f46" stroke-width="2"/><rect x="42" y="14" width="12" height="40" fill="#34d399" stroke="#065f46" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "pitching-investors-1-1",
  courseUrl: "course-pitching-investors.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "Types of Investors",
  subtitle: "Not all investors are the same — knowing who you're pitching to matters",
  steps: [
    {
      type: "vocab",
      word: "Investor",
      pronounce: "say it: in-VES-ter",
      definition: "An <b>investor</b> is someone who gives a startup money in exchange for equity (ownership), hoping the company grows and their stake becomes valuable.",
      example: "An angel investor gives $25,000 to a startup in exchange for 5% ownership.",
      icon: INVESTOR_ICON
    },
    {
      type: "teach",
      title: "Different Investors, Different Expectations",
      body: "Friends & family often invest small amounts based on trust in you personally. Angel investors are individuals investing their own money, usually earlier and smaller. Venture capital (VC) firms manage large funds and invest bigger amounts, usually wanting fast, massive growth. Each type expects different things — knowing who you're pitching shapes how you present.",
      examples: ["Friends & family: trust-based, small amounts", "Angels: individuals, earlier, smaller checks", "VCs: firms, bigger checks, expect fast big growth"]
    },
    {
      type: "mc",
      question: "What is an \"investor\"?",
      hint: "Think about money for ownership.",
      options: [
        { text: "Someone who gives a startup money in exchange for equity", correct: true },
        { text: "A government office that regulates businesses", correct: false },
        { text: "A customer who buys a product once", correct: false },
        { text: "An employee who works for free", correct: false }
      ],
      correctMsg: "Right! An investor exchanges money for ownership (equity).",
      wrongMsg: "An investor gives a startup money in exchange for equity (ownership)."
    },
    {
      type: "mc",
      question: "How do VC firms typically differ from angel investors?",
      hint: "Think about fund size and stage.",
      options: [
        { text: "VCs manage large funds and often invest bigger amounts, usually a bit later than angels", correct: true },
        { text: "VCs never invest any money in any startup, ever", correct: false },
        { text: "Angels always invest more money than any VC firm", correct: false },
        { text: "There is no difference between the two at all", correct: false }
      ],
      correctMsg: "Correct! VCs typically manage bigger funds and invest larger amounts, often later than angels.",
      wrongMsg: "VC firms manage large funds and typically invest bigger amounts, usually a bit later than angel investors."
    },
    {
      type: "mc",
      question: "Why does it matter WHO you're pitching to (friends & family vs. angels vs. VCs)?",
      hint: "Think about different expectations.",
      options: [
        { text: "Each type of investor expects different things, so the pitch should be shaped accordingly", correct: true },
        { text: "It doesn't matter — every investor wants the exact same thing", correct: false },
        { text: "Only VCs ever actually give real money", correct: false },
        { text: "Friends and family always demand the most equity", correct: false }
      ],
      correctMsg: "Exactly! Tailoring your pitch to the investor type makes it far more effective.",
      wrongMsg: "Different investor types expect different things, so shaping your pitch to your audience matters a lot."
    }
  ],
  badges: [
    { icon: "bulb", name: "Investor Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Investor Types Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Investor Basics Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
