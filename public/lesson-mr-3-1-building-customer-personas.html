        { text: "A random guess with no research behind it", correct: false },
        { text: "A legal document required to sell a product", correct: false }

        { text: "A persona based on guesses could lead the whole business in the wrong direction", correct: true },
        { text: "Research has no effect on how accurate a persona is", correct: false },

      type: "mc",
