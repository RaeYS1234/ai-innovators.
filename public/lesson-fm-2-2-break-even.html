<script>
const BREAKEVEN_ICON = `<svg viewBox="0 0 64 64"><line x1="8" y1="56" x2="56" y2="56" stroke="#831843" stroke-width="2.5"/><line x1="8" y1="56" x2="8" y2="8" stroke="#831843" stroke-width="2.5"/><line x1="8" y1="50" x2="52" y2="14" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/><line x1="8" y1="50" x2="52" y2="30" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/><circle cx="34" cy="26" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "financial-modeling-2-2",
  courseUrl: "course-financial-modeling.html",
  tag: "UNIT 2 · LESSON 2.2",
  title: "Break-Even Analysis",
  subtitle: "The exact number of sales where you stop losing money.",
  steps: [
    {
      type: "vocab",
      word: "Break-Even Point",
      pronounce: "say it: BRAKE-EE-ven POYNT",
      definition: "The <b>break-even point</b> is the number of units (or amount of revenue) where total revenue exactly equals total costs, no profit, no loss. Sell one more unit past it, and you're profitable.",
      example: "A lemonade stand has $50 in fixed costs (table, sign) and sells cups for $2, with $0.50 variable cost per cup. Each cup contributes $1.50 toward fixed costs. Break-even = $50 ÷ $1.50 ≈ 34 cups.",
      icon: BREAKEVEN_ICON
    },
    {
      type: "teach",
      title: "Contribution Margin",
      body: "<b>Contribution margin</b> is price minus variable cost per unit, it's how much each sale actually contributes toward covering your fixed costs before you turn a profit. The formula: <b>Break-even units = Fixed Costs ÷ Contribution Margin per unit</b>.",
      examples: ["Contribution margin = Price − Variable Cost per unit", "Break-even units = Fixed Costs ÷ Contribution Margin", "Every unit past break-even is pure profit before tax"]
    },
    {
      type: "teach",
      title: "Worked Example",
      body: "A t-shirt business has $2,000/month in fixed costs (rent + software). Each shirt sells for $25, with $10 in variable cost (COGS + shipping). Contribution margin = $25 − $10 = $15. Break-even units = $2,000 ÷ $15 ≈ 133.3, which rounds UP to 134 shirts, because 133 shirts alone wouldn't fully cover the fixed costs.",
      examples: ["Fixed costs: $2,000/month", "Contribution margin: $25 − $10 = $15", "Break-even: $2,000 ÷ $15 ≈ 134 shirts"]
    },
    {
      type: "teach",
      title: "Why Break-Even Matters Beyond the Math",
      body: "Break-even isn't just a number, it's a reality check on the whole business model. Raising price increases contribution margin, which LOWERS break-even. Cutting fixed costs also lowers break-even. If your break-even point is way higher than what you can realistically sell, that's a sign the pricing or cost structure needs to change before you scale.",
      examples: ["Higher price → higher margin → lower break-even", "Lower fixed costs → lower break-even", "High break-even vs. realistic demand = risky model"]
    },
    {
      type: "mc",
      question: "Fixed costs are $3,000/month. Price is $20 per unit, variable cost is $5 per unit. What is the contribution margin per unit?",
      hint: "Contribution margin = Price − Variable Cost.",
      options: [
        { text: "$5", correct: false },
        { text: "$15", correct: true },
        { text: "$20", correct: false },
        { text: "$25", correct: false }
      ],
      correctMsg: "Right! $20 − $5 = $15 contribution margin per unit.",
      wrongMsg: "Contribution margin = Price − Variable Cost per unit = $20 − $5 = $15. This is the amount each unit sold contributes toward paying off fixed costs before any profit begins."
    },
    {
      type: "mc",
      question: "Using those same numbers, $3,000 fixed costs, $15 contribution margin per unit, what is the break-even point in units?",
      hint: "Break-even units = Fixed Costs ÷ Contribution Margin.",
      options: [
        { text: "150 units", correct: false },
        { text: "200 units", correct: true },
        { text: "3,000 units", correct: false },
        { text: "60 units", correct: false }
      ],
      correctMsg: "Correct! $3,000 ÷ $15 = 200 units to break even.",
      wrongMsg: "Break-even units = Fixed Costs ÷ Contribution Margin = $3,000 ÷ $15 = 200 units. Below 200 units sold, this business is losing money every month; above it, every extra unit is pure profit."
    },
    {
      type: "mc",
      question: "A business has fixed costs of $5,000, sells at $50 with a variable cost of $30 per unit. How many units must it sell to break even?",
      hint: "First find contribution margin ($50 − $30), then divide fixed costs by it.",
      options: [
        { text: "100 units", correct: false },
        { text: "166 units", correct: false },
        { text: "250 units", correct: true },
        { text: "500 units", correct: false }
      ],
      correctMsg: "Yes! Contribution margin = $50 − $30 = $20. Break-even = $5,000 ÷ $20 = 250 units.",
      wrongMsg: "Two steps: contribution margin = $50 − $30 = $20 per unit. Break-even units = $5,000 ÷ $20 = 250 units. A common error is dividing fixed costs by the full PRICE ($50) instead of the contribution margin, that ignores variable costs and understates how many units you actually need to sell."
    },
    {
      type: "mc",
      question: "If a founder raises the price without changing costs, what happens to the break-even point?",
      hint: "A higher price means each sale contributes more toward fixed costs.",
      options: [
        { text: "It goes down, because each sale contributes more toward covering fixed costs", correct: true },
        { text: "It goes up, because higher prices always scare away customers", correct: false },
        { text: "It stays exactly the same", correct: false },
        { text: "It becomes negative", correct: false }
      ],
      correctMsg: "Exactly. Raising price increases contribution margin per unit, so you need FEWER sales to cover fixed costs, break-even drops.",
      wrongMsg: "Raising price (with costs unchanged) increases the contribution margin per unit, which means fewer units are needed to cover the same fixed costs, break-even goes DOWN, not up. Whether customers accept the higher price is a separate question about demand, not about the break-even math itself."
    },
    {
      type: "mc",
      question: "A startup's break-even point is 50,000 units/month, but its realistic addressable market only supports selling 5,000 units/month. What does this tell a serious investor?",
      hint: "Compare the break-even number to what's actually achievable in the real market.",
      options: [
        { text: "Nothing, break-even doesn't matter if the product is good", correct: false },
        { text: "The business model likely isn't viable as structured, pricing or costs need to change before it can work", correct: true },
        { text: "It's a strong signal to invest immediately", correct: false },
        { text: "It means fixed costs should be ignored going forward", correct: false }
      ],
      correctMsg: "Right. A break-even point 10x higher than realistic demand is a major red flag, the model needs to change (higher price, lower costs, or a different market) before it can actually work.",
      wrongMsg: "This is exactly the kind of gap investors look for: if you can only ever realistically sell 5,000 units but need 50,000 to break even, the current pricing and cost structure simply can't work, no amount of good execution fixes math that doesn't add up. The fix is changing price, cutting costs, or rethinking the model, not ignoring the number."
    }
  ],
  badges: [
    { icon: "target", name: "Break-Even Solver", earned: true },
    { icon: "star", name: "Sharp Calculator", earned: ({ correct }) => correct >= 3 },
    { icon: "brain", name: "Contribution Margin Pro", earned: ({ correct }) => correct >= 5 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "CFO-Level Thinker", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
