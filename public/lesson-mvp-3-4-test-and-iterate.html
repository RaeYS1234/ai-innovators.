<script>
runLesson({
  lessonId: "build-mvps-3-4",
  courseUrl: "course-build-mvps.html",
  tag: "UNIT 3 · PRACTICE",
  title: "Test and Iterate",
  subtitle: "Practice turning real user feedback into your next, better version",
  steps: [
    {
      type: "teach",
      title: "Launch Is the Beginning, Not the End",
      body: "Getting your MVP in front of real users is just the start. Watch what they actually DO (not just what they say), collect specific feedback, then make focused changes based on real signals, not just your own opinions. Repeat this loop: build, test, learn, adjust. Each cycle should make the product a little better aligned with what users truly need.",
      examples: []
    },
    {
      type: "mc",
      question: "Why is watching what users ACTUALLY DO often more valuable than just what they SAY?",
      hint: "Think about behavior vs. politeness.",
      options: [
        { text: "People sometimes say polite things that don't match their real actions or preferences", correct: true },
        { text: "What users say is always 100% accurate and reliable", correct: false },
        { text: "Watching behavior is illegal without special permission", correct: false },
        { text: "There's no difference between what people say and do", correct: false }
      ],
      correctMsg: "Right! Real behavior often reveals more truth than polite verbal feedback.",
      wrongMsg: "People sometimes say polite things that don't match their real actions, behavior often reveals more truth."
    },
    {
      type: "mc",
      question: "What's the ideal loop for improving an MVP after launch?",
      hint: "Think about a repeating cycle.",
      options: [
        { text: "Build, test, learn, adjust, then repeat", correct: true },
        { text: "Build once and never change anything again", correct: false },
        { text: "Only build, with no testing or learning at all", correct: false },
        { text: "Test without ever building or adjusting anything", correct: false }
      ],
      correctMsg: "Correct! Repeating build, test, learn, adjust is the ideal improvement loop.",
      wrongMsg: "The ideal loop is build, test, learn, adjust, then repeat the cycle again."
    },
    {
      type: "mc",
      question: "Should changes to an MVP be based mainly on the founder's personal opinion, or on real user signals?",
      hint: "Think about evidence over instinct alone.",
      options: [
        { text: "Real user signals, actual behavior and feedback from real testing", correct: true },
        { text: "Only the founder's personal opinion, ignoring all user feedback", correct: false },
        { text: "Random guessing with no evidence at all", correct: false },
        { text: "Whatever a competitor happens to be doing, regardless of your users", correct: false }
      ],
      correctMsg: "Exactly! Real user signals should guide the changes you make.",
      wrongMsg: "Changes should be based mainly on real user signals, actual behavior and feedback from testing."
    }
  ],
  badges: [
    { icon: "bulb", name: "Iteration Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Feedback Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Iteration Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
