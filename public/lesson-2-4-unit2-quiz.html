<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 Check — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">QUIZ</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Take the Quiz!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Quiz Complete!</h1>
    <p class="complete-subtitle">Money math champion! Here's your score:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "business-101-2-4",
  tag: "UNIT 2 · CHECK",
  title: "Unit 2 Quiz",
  subtitle: "Money matters quiz time! Show what you know about revenue, cost, and profit.",
  steps: [
    {
      type: "mc",
      question: "What is REVENUE?",
      hint: "Money in or money out?",
      options: [
        { text: "Money you spend on supplies", correct: false },
        { text: "Money customers pay you", correct: true },
        { text: "Money you save", correct: false },
        { text: "Money in your wallet", correct: false }
      ],
      correctMsg: "Right! Revenue = money IN from customers.",
      wrongMsg: "Revenue is the money customers PAY you for your stuff."
    },
    {
      type: "mc",
      question: "What is COST?",
      hint: "It's the opposite of revenue.",
      options: [
        { text: "Money customers give you", correct: false },
        { text: "Money you spend on supplies and stuff", correct: true },
        { text: "Money in the bank", correct: false },
        { text: "Free money", correct: false }
      ],
      correctMsg: "Yes! Cost = money OUT.",
      wrongMsg: "Cost is the money you SPEND to run your business."
    },
    {
      type: "math",
      question: "Profit problem",
      story: "Revenue: $15. Cost: $6. What's your profit?",
      equation: "$15 − $6 = ?",
      answer: 9,
      correctMsg: "Yes! $9 profit.",
      wrongMsg: "Profit = Revenue − Cost. 15 − 6 = 9."
    },
    {
      type: "math",
      question: "Bigger numbers!",
      story: "Sold 20 cookies at $2 each. Spent $15 on ingredients. What's your profit?",
      equation: "$40 − $15 = ?",
      answer: 25,
      correctMsg: "Awesome! $25 profit.",
      wrongMsg: "Revenue is 20 × $2 = $40. Then $40 − $15 = $25."
    },
    {
      type: "mc",
      question: "Your revenue was $10 and your cost was $12. What happened?",
      hint: "Cost was BIGGER than revenue.",
      options: [
        { text: "You made $22 profit", correct: false },
        { text: "You broke even", correct: false },
        { text: "You had a loss (lost $2)", correct: true },
        { text: "Nothing changed", correct: false }
      ],
      correctMsg: "Right! When costs > revenue, you have a LOSS.",
      wrongMsg: "When you spend MORE than you earn, that's a LOSS. $12 − $10 = $2 loss."
    },
    {
      type: "mc",
      question: "What's the GOAL of every business?",
      hint: "It's the leftover money.",
      options: [
        { text: "Make profit", correct: true },
        { text: "Spend a lot", correct: false },
        { text: "Have many customers (but lose money)", correct: false },
        { text: "Be famous", correct: false }
      ],
      correctMsg: "Yes! Profit is the goal — that's why businesses exist!",
      wrongMsg: "The goal is PROFIT — money left over after you pay your costs."
    }
  ],
  badges: [
    { icon: "money", name: "Money Whiz", earned: true },
    { icon: "star", name: "Quiz Champ", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Brain Boss", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Money Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
