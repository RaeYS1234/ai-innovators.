<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 Quiz | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Start Quiz!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Unit 1 Complete!</h1>
    <p class="complete-subtitle">You know the AI art basics! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! Review the lessons and come back stronger!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "ai-pictures-1-3",
  courseUrl: "course-ai-pictures.html",
  tag: "UNIT 1 CHECK",
  title: "Unit 1 Quiz",
  subtitle: "Show what you know about AI art basics!",
  steps: [
    {
      type: "mc",
      question: "What is an image generator?",
      hint: "Think about what it turns words into.",
      options: [
        { text: "An AI tool that creates pictures from words", correct: true },
        { text: "A camera that takes real photos", correct: false },
        { text: "A printer for paper", correct: false },
        { text: "A video game console", correct: false }
      ],
      correctMsg: "Exactly! You type words, it draws a picture.",
      wrongMsg: "An image generator is an AI tool that turns your WORDS into a picture."
    },
    {
      type: "mc",
      question: "How did AI learn to make pictures?",
      hint: "Lots and lots of examples.",
      options: [
        { text: "By studying billions of labeled pictures", correct: true },
        { text: "By guessing randomly", correct: false },
        { text: "By copying one artist exactly", correct: false },
        { text: "It was born knowing how", correct: false }
      ],
      correctMsg: "Right! AI trained on billions of pictures to learn what things look like.",
      wrongMsg: "AI learned by studying BILLIONS of labeled pictures, that's how it knows what a \"cat\" or \"cake\" looks like."
    },
    {
      type: "mc",
      question: "What is a prompt?",
      hint: "It's what YOU type.",
      options: [
        { text: "The words you type to tell AI what to draw", correct: true },
        { text: "The finished picture", correct: false },
        { text: "A type of paintbrush", correct: false },
        { text: "The AI's name", correct: false }
      ],
      correctMsg: "Yes! A prompt is your instructions to the AI.",
      wrongMsg: "A prompt is the WORDS you type telling the AI what picture to make."
    },
    {
      type: "mc",
      question: "Which prompt follows the full formula: subject + details + style?",
      hint: "Look for all three parts together.",
      options: [
        { text: "\"cat\"", correct: false },
        { text: "\"a sleepy orange cat curled up on a pillow, watercolor style\"", correct: true },
        { text: "\"animal\"", correct: false },
        { text: "\"nice\"", correct: false }
      ],
      correctMsg: "That's the full formula in action, subject, details, AND style!",
      wrongMsg: "A strong prompt needs a subject, details about it, AND a style word."
    },
    {
      type: "mc",
      question: "Why does adding a STYLE word matter?",
      hint: "It changes how the picture looks overall.",
      options: [
        { text: "It changes the entire look and feel of the picture", correct: true },
        { text: "It makes the AI faster", correct: false },
        { text: "It has no effect", correct: false },
        { text: "It only changes the size", correct: false }
      ],
      correctMsg: "Correct! Style words (cartoon, realistic, watercolor) totally change the vibe of a picture.",
      wrongMsg: "A style word changes the WHOLE LOOK of a picture, cartoon vs realistic vs watercolor all look different."
    }
  ],
  badges: [
    { icon: "starter", name: "Unit 1 Graduate", earned: true },
    { icon: "star", name: "Quick Thinker", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "AI Art Scholar", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Ready for Unit 2", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
