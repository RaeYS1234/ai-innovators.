<script>
runLesson({
  lessonId: "pricing-strategy-2-3",
  courseUrl: "course-pricing-strategy.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Price Test Practice",
  subtitle: "Calculate discounts and bundle savings like a real founder",
  steps: [
    {
      type: "teach",
      title: "Testing Prices With Real Math",
      body: "Let's practice calculating discounts and bundle deals — the exact math real founders use every day.",
      examples: []
    },
    {
      type: "math",
      question: "Discount Amount",
      story: "A backpack normally costs $40. It's on sale for 25% off.",
      equation: "$40 × 0.25 = ?",
      hint: "Multiply the price by the discount percent (as a decimal).",
      answer: 10,
      correctMsg: "$40 × 0.25 = $10 off!",
      wrongMsg: "Multiply the original price by the discount percent (written as a decimal) to find the amount off."
    },
    {
      type: "math",
      question: "Sale Price",
      story: "That same $40 backpack has $10 off.",
      equation: "$40 − $10 = ?",
      hint: "Subtract the discount from the original price.",
      answer: 30,
      correctMsg: "$40 − $10 = $30 sale price!",
      wrongMsg: "Subtract the discount amount from the original price to get the sale price."
    },
    {
      type: "math",
      question: "Bundle Savings",
      story: "Buying a shirt ($15) and a hat ($10) separately costs $25 total. As a bundle, they cost $20.",
      equation: "$25 − $20 = ?",
      hint: "Subtract the bundle price from buying separately.",
      answer: 5,
      correctMsg: "$25 − $20 = $5 saved with the bundle!",
      wrongMsg: "Subtract the bundle price from the total cost of buying separately to find the savings."
    },
    {
      type: "math",
      question: "Discount Price",
      story: "A $50 skateboard is 10% off.",
      equation: "$50 − ($50 × 0.10) = ?",
      hint: "Find 10% of $50 first, then subtract it from $50.",
      answer: 45,
      correctMsg: "10% of $50 is $5, so $50 − $5 = $45!",
      wrongMsg: "First find 10% of $50 (that's the discount), then subtract it from $50."
    },
    {
      type: "math",
      question: "Total Revenue With Discount",
      story: "You sell 8 candles at a discounted price of $6 each (normally $8).",
      equation: "8 × $6 = ?",
      hint: "Multiply how many sold by the discounted price.",
      answer: 48,
      correctMsg: "8 × $6 = $48 total revenue!",
      wrongMsg: "Multiply the number of candles sold by the discounted price to find total revenue."
    }
  ],
  badges: [
    { icon: "money", name: "Discount Detective", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Math Whiz", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Price Test Champion", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
