<script>
const SCOPE_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="none" stroke="#0ea5e9" stroke-width="3"/><circle cx="32" cy="32" r="14" fill="none" stroke="#0ea5e9" stroke-width="3"/><circle cx="32" cy="32" r="4" fill="#0ea5e9"/></svg>`;

runLesson({
  lessonId: "build-mvps-1-2",
  courseUrl: "course-build-mvps.html",
  tag: "UNIT 1 · LESSON 1.2",
  title: "Scoping the Smallest Useful Thing",
  subtitle: "The hardest skill in MVP building: knowing what to leave OUT",
  steps: [
    {
      type: "teach",
      title: "Cut Until It Hurts (Then Cut Once More)",
      body: "Founders often want to include every feature they can imagine. Good scoping means asking: \"What's the ONE thing this MVP must prove?\" Then cut everything that doesn't directly test that. A helpful trick: list every feature you want, then ask \"could I test my core idea WITHOUT this?\" If yes, cut it for now.",
      examples: ["Ask: what's the ONE thing this MVP must prove?", "List features, then cut anything not essential", "\"Could I test this without that feature?\" → if yes, cut it"]
    },
    {
      type: "mc",
      question: "What's the key question to ask when scoping an MVP?",
      hint: "Think about the core thing to prove.",
      options: [
        { text: "\"What's the ONE thing this MVP must prove?\"", correct: true },
        { text: "\"How many features can I possibly cram in?\"", correct: false },
        { text: "\"What color should the logo be?\"", correct: false },
        { text: "\"How can I make this as complicated as possible?\"", correct: false }
      ],
      correctMsg: "Right! Scoping starts with identifying the ONE core thing to test.",
      wrongMsg: "Good scoping starts by asking \"What's the ONE thing this MVP must prove?\""
    },
    {
      type: "mc",
      question: "A founder wants to add a complex referral rewards system to their very first MVP. What's a smart question to ask?",
      hint: "Think about testing without it.",
      options: [
        { text: "\"Could I test my core idea WITHOUT this feature?\" — if yes, cut it for now", correct: true },
        { text: "\"How can I add even MORE complex features?\"", correct: false },
        { text: "\"Should I skip testing the core idea entirely?\"", correct: false },
        { text: "\"What's the most expensive way to build this?\"", correct: false }
      ],
      correctMsg: "Correct! If the core idea can be tested without a feature, it's a strong candidate to cut for now.",
      wrongMsg: "Asking \"could I test this without that feature?\" helps identify what to cut from an early MVP."
    },
    {
      type: "mc",
      question: "Why is scoping an MVP down to the essentials often described as the HARDEST skill?",
      hint: "Think about founder attachment to features.",
      options: [
        { text: "Founders often feel attached to many features and find it hard to cut any of them", correct: true },
        { text: "It's technically impossible to remove any feature ever", correct: false },
        { text: "Scoping has no real difficulty at all", correct: false },
        { text: "It requires expensive software that most founders can't access", correct: false }
      ],
      correctMsg: "Exactly! Emotional attachment to features makes cutting them genuinely hard.",
      wrongMsg: "Scoping is hard because founders often feel attached to features and find it difficult to cut any of them."
    }
  ],
  badges: [
    { icon: "bulb", name: "Scoping Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Focus Smart", earned: ({ correct }) => correct >= 3 },

    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
