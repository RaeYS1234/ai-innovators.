<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Few-Shot Examples — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const EXAMPLES_ICON = `<svg viewBox="0 0 64 64"><rect x="6" y="14" width="20" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="22" y="20" width="20" height="26" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="2"/><rect x="38" y="26" width="20" height="26" rx="2" fill="white" stroke="#d97706" stroke-width="2.5"/><line x1="43" y1="34" x2="53" y2="34" stroke="#d97706" stroke-width="2"/><line x1="43" y1="40" x2="53" y2="40" stroke="#d97706" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "prompt-engineering-2-2",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 2 · LESSON 2.2",
  title: "Few-Shot Examples",
  subtitle: "Show the AI what you want by giving it a few examples first",
  steps: [
    {
      type: "vocab",
      word: "Few-Shot Prompting",
      pronounce: "say it: FYOO-SHAHT PRAHMT-ing",
      definition: "<b>Few-shot prompting</b> means including a few examples of the input/output pattern you want directly in your prompt, so the AI can copy the pattern.",
      example: "Showing 3 example product taglines before asking \"now write one for my brand\" is few-shot prompting.",
      icon: EXAMPLES_ICON
    },
    {
      type: "teach",
      title: "Show, Don't Just Tell",
      body: "Sometimes it's hard to describe EXACTLY the style or format you want in words. Few-shot prompting solves this: you give 2-5 examples of the pattern first, then ask for a new one in that same style. The AI picks up on tone, structure, and length from your examples far more reliably than from instructions alone.",
      examples: ["Zero-shot: no examples, just instructions", "Few-shot: 2-5 examples included in the prompt", "Great for matching a specific tone or format"]
    },
    {
      type: "mc",
      question: "What is \"few-shot prompting\"?",
      hint: "Think about showing examples.",
      options: [
        { text: "Including a few examples of the pattern you want in the prompt itself", correct: true },
        { text: "Asking the AI exactly one question with zero context", correct: false },
        { text: "Sending the same prompt many times in a row", correct: false },
        { text: "A setting that limits how long the AI's answer can be", correct: false }
      ],
      correctMsg: "Right! Few-shot means showing a few examples right in the prompt.",
      wrongMsg: "Few-shot prompting means including a few examples of the desired pattern directly in the prompt."
    },
    {
      type: "mc",
      question: "Why might few-shot prompting work better than just describing a style in words?",
      hint: "Think about how hard tone is to describe.",
      options: [
        { text: "Some styles or formats are hard to describe precisely, but easy to demonstrate", correct: true },
        { text: "It always makes the response ten times longer", correct: false },
        { text: "Words can never describe any style at all", correct: false },
        { text: "It removes the need to write any prompt at all", correct: false }
      ],
      correctMsg: "Exactly! Demonstrating a pattern is often clearer than describing it.",
      wrongMsg: "Certain styles or formats are hard to describe in words but easy to show through examples."
    },
    {
      type: "mc",
      question: "A founder wants product taglines that all match a punchy, one-line style. What's a smart few-shot approach?",
      hint: "Think about giving sample taglines first.",
      options: [
        { text: "Show 3 example punchy taglines, then ask for a new one in that same style", correct: true },
        { text: "Just say \"make it punchy\" with no examples at all", correct: false },
        { text: "Ask for a 500-word essay instead of a tagline", correct: false },
        { text: "Give zero information and hope for the best", correct: false }
      ],
      correctMsg: "Correct! Showing examples of the exact style is the core of few-shot prompting.",
      wrongMsg: "Giving a few example taglines in the desired style helps the AI match that exact pattern."
    }
  ],
  badges: [
    { icon: "bulb", name: "Examples Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Few-Shot Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Few-Shot Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
