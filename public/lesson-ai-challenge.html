<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Basics Challenge — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Course Complete!</h1>
    <p class="complete-subtitle">You're officially AI Smart. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "what-is-ai-challenge",
  courseUrl: "course-what-is-ai.html",
  tag: "🏆 FINAL CHALLENGE",
  title: "AI Basics Challenge",
  subtitle: "The boss battle! Prove you know AI.",
  steps: [
    { type: "mc", question: "What does AI stand for?", hint: "Two words.",
      options: [
        { text: "Awesome Internet", correct: false },
        { text: "Artificial Intelligence", correct: true },
        { text: "Amazing Idea", correct: false },
        { text: "Apple iPhone", correct: false }
      ],
      correctMsg: "Right! Artificial Intelligence.",
      wrongMsg: "AI = Artificial Intelligence. Computer brains that learn!" },
    { type: "mc", question: "Which of these uses AI?", hint: "AI is EVERYWHERE these days.",
      options: [
        { text: "A regular calculator", correct: false },
        { text: "Netflix guessing shows you might like", correct: true },
        { text: "A paper notebook", correct: false },
        { text: "A basketball", correct: false }
      ],
      correctMsg: "Yes! Netflix uses AI to guess what you'll love.",
      wrongMsg: "Netflix uses AI to learn what you like and suggest more!" },
    { type: "mc", question: "How does AI learn?", hint: "It's not magic — it's data.",
      options: [
        { text: "By reading lots of examples", correct: true },
        { text: "By sleeping", correct: false },
        { text: "By eating food", correct: false },
        { text: "It knows everything from birth", correct: false }
      ],
      correctMsg: "Yes! AI learns from tons and tons of examples (called data).",
      wrongMsg: "AI learns by studying lots of examples — millions of photos or texts." },
    { type: "mc", question: "Can AI be WRONG sometimes?", hint: "AI isn't perfect.",
      options: [
        { text: "Never — AI is always right", correct: false },
        { text: "Yes — always double-check important stuff", correct: true },
        { text: "Only on Tuesdays", correct: false },
        { text: "Only when the wifi is bad", correct: false }
      ],
      correctMsg: "Right! Always double-check important AI answers.",
      wrongMsg: "AI CAN be wrong. Smart people check AI's answers." },
    { type: "mc", question: "Using AI for a story — smartest move?", hint: "AI helps YOU, not the other way around.",
      options: [
        { text: "Copy exactly what AI writes and turn it in", correct: false },
        { text: "Use AI's ideas but write in your OWN voice and check facts", correct: true },
        { text: "Believe every word AI says", correct: false },
        { text: "Don't ever use AI", correct: false }
      ],
      correctMsg: "🎯 Yes! AI helps, YOU create.",
      wrongMsg: "Smart use = AI is a helper. YOU still do the thinking." },
    { type: "mc", question: "Which AI helps make a poster for a lemonade stand?", hint: "Think about what makes posters.",
      options: [
        { text: "A weather AI", correct: false },
        { text: "A picture-making AI (like DALL-E or Canva AI)", correct: true },
        { text: "A calculator", correct: false },
        { text: "A cooking AI", correct: false }
      ],
      correctMsg: "Perfect! Image AIs are amazing for posters and logos.",
      wrongMsg: "Picture-making AIs turn your ideas into images!" },
    { type: "mc", question: "Why be careful with AI?", hint: "AI is powerful, but not perfect.",
      options: [
        { text: "It can steal your snacks", correct: false },
        { text: "It can make up wrong info that sounds real", correct: true },
        { text: "It might turn into a robot friend", correct: false },
        { text: "It gets tired", correct: false }
      ],
      correctMsg: "🎯 Yes! AI sometimes 'hallucinates' fake info.",
      wrongMsg: "AI can make up things that sound real but aren't true." }
  ],
  badges: [
    { icon: "star", name: "Course Complete", earned: true },
    { icon: "brain", name: "AI Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "starter", name: "AI Smart", earned: ({ correct }) => correct >= 5 },
    { icon: "perfect", name: "Perfect Champion", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "Untouchable", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "AI Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
