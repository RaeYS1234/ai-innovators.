<script>
const PRICE_TAG_ICON = `<svg viewBox="0 0 64 64"><path d="M28 6 L54 6 C 57 6 58 7 58 10 L58 30 L34 58 L6 30 L6 16 Z" fill="#10b981" stroke="#047857" stroke-width="2.5" stroke-linejoin="round"/><circle cx="46" cy="18" r="5" fill="white" stroke="#047857" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "pricing-strategy-1-1",
  courseUrl: "course-pricing-strategy.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "What Determines Price?",
  subtitle: "Why does one t-shirt cost $5 and another cost $50?",
  steps: [
    {
      type: "vocab",
      word: "Price",
      pronounce: "say it: PRYSS",
      definition: "<b>Price</b> is the amount of money a customer pays to get your product or service.",
      example: "If your candle costs $8, that's the price customers pay to take it home.",
      icon: PRICE_TAG_ICON
    },
    {
      type: "teach",
      title: "What Goes Into a Price?",
      body: "Founders don't just pick a random number! A smart price considers what it costs YOU to make it, what competitors charge for similar things, how much customers value it, and even your brand's reputation.",
      examples: ["Cost to make it", "Competitor prices", "Customer value", "Your brand"]
    },
    {
      type: "mc",
      question: "What is \"price\"?",
      hint: "Think about who pays and for what.",
      options: [
        { text: "The amount a customer pays for your product", correct: true },
        { text: "The cost to make the product", correct: false },
        { text: "Your profit only", correct: false },
        { text: "A random number with no meaning", correct: false }
      ],
      correctMsg: "Right! Price is what the customer actually pays you.",
      wrongMsg: "Price is the amount a customer pays, not the same as your cost or your profit."
    },
    {
      type: "mc",
      question: "Which of these should affect what price you charge?",
      hint: "Good pricing looks at more than one thing.",
      options: [
        { text: "Your costs, competitor prices, AND how much customers value it", correct: true },
        { text: "Only your mood that day", correct: false },
        { text: "Just copying a friend's business exactly", correct: false },
        { text: "Nothing, pick any number for fun", correct: false }
      ],
      correctMsg: "Exactly! Smart pricing weighs several factors together.",
      wrongMsg: "Price should be based on real factors like cost, competitors, and customer value, not guesswork."
    },
    {
      type: "mc",
      question: "Two bakeries sell almost the same cookie. Bakery A charges $2. Bakery B charges $5 because their cookies are famous online. Why can Bakery B charge more?",
      hint: "Think about how customers FEEL about each bakery.",
      options: [
        { text: "Customers value Bakery B's cookies more (it feels worth more to them)", correct: true },
        { text: "Bakery B's cookies must cost way more to make", correct: false },
        { text: "It's illegal for Bakery A to charge more", correct: false },
        { text: "Price never affects what customers think", correct: false }
      ],
      correctMsg: "Yes! When customers perceive higher value, they'll pay a higher price.",
      wrongMsg: "It's about perceived value, customers believe Bakery B's cookies are worth more, so they'll pay more."
    },
    {
      type: "mc",
      question: "What's the risk of pricing something too LOW?",
      hint: "Think about what a business needs to survive.",
      options: [
        { text: "You might not make enough profit to keep the business running", correct: true },
        { text: "Customers will never buy it", correct: false },
        { text: "You'll accidentally make too much profit", correct: false },
        { text: "Nothing bad happens at all", correct: false }
      ],
      correctMsg: "Correct! Pricing too low can mean you're not covering your costs or earning enough to grow.",
      wrongMsg: "If you price too low, you risk not covering your costs or earning enough profit to sustain your business."
    }
  ],
  badges: [
    { icon: "bulb", name: "Price Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Pricing Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Price Detective", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
