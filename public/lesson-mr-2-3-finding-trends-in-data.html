<script>
runLesson({
  lessonId: "market-research-2-3",
  courseUrl: "course-market-research.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Finding Trends in Data",
  subtitle: "Practice spotting real patterns instead of random noise",
  steps: [
    {
      type: "teach",
      title: "Patterns Need Repetition to Be Real",
      body: "A real trend shows up repeatedly across many data points, not just once. If 2 out of 50 survey responses mention something, that's probably noise. If 35 out of 50 mention it, that's a real trend worth acting on. AI can help spot these repeated patterns fast, but the key skill is knowing how much repetition makes something meaningful.",
      examples: []
    },
    {
      type: "mc",
      question: "A founder sees ONE customer mention wanting a dark mode feature. Is this a strong trend?",
      hint: "Think about how many people mentioned it.",
      options: [
        { text: "Not necessarily — one mention alone isn't enough to confirm a real trend", correct: true },
        { text: "Yes — any single mention is always a guaranteed trend", correct: false },
        { text: "It means the whole business should shut down", correct: false },
        { text: "It's proof that nobody wants the product at all", correct: false }
      ],
      correctMsg: "Right! A single mention alone isn't enough evidence of a real trend.",
      wrongMsg: "One single mention isn't strong enough evidence on its own — real trends usually repeat across many responses."
    },
    {
      type: "mc",
      question: "Out of 100 survey responses, 60 mention frustration with slow shipping. What should the founder likely do?",
      hint: "Think about a strong, repeated signal.",
      options: [
        { text: "Treat this as a real trend worth addressing, since it's a strong, repeated pattern", correct: true },
        { text: "Ignore it completely since shipping never matters", correct: false },
        { text: "Assume it's a coincidence with no real meaning", correct: false },
        { text: "Change the company name instead", correct: false }
      ],
      correctMsg: "Correct! A pattern repeated by 60% of responses is a strong, real trend.",
      wrongMsg: "When a large share of responses (60%) repeat the same issue, that's a strong, real trend worth addressing."
    },
    {
      type: "mc",
      question: "How can AI help a founder find trends across hundreds of open-ended responses?",
      hint: "Think about grouping similar answers.",
      options: [
        { text: "It can group similar responses together and count how often themes repeat", correct: true },
        { text: "AI can only read one response and nothing more", correct: false },
        { text: "AI always ignores open-ended text responses", correct: false },
        { text: "It has no ability to group or summarize text at all", correct: false }
      ],
      correctMsg: "Exactly! AI can group similar responses and count how often themes repeat.",
      wrongMsg: "AI can group similar open-ended responses together and count how often certain themes repeat."
    },
    {
      type: "mc",
      question: "Why is it risky to chase every small, one-off comment as if it were a major trend?",
      hint: "Think about wasted effort.",
      options: [
        { text: "You could waste time and resources reacting to noise instead of real, repeated signals", correct: true },
        { text: "It's illegal to read one-off comments", correct: false },
        { text: "One-off comments always represent the majority opinion", correct: false },
        { text: "There's no risk at all in doing this", correct: false }
      ],
      correctMsg: "Right! Chasing noise instead of real signal wastes time and resources.",
      wrongMsg: "Reacting to every one-off comment risks wasting resources chasing noise instead of real, repeated trends."
    }
  ],
  badges: [
    { icon: "bulb", name: "Trend Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Pattern Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Trend Spotter Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
