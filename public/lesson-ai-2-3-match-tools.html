<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the AI Tool | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">PRACTICE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Start Matching!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Practice Complete!</h1>
    <p class="complete-subtitle">You're a tool-matching pro! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "what-is-ai-2-3",
  courseUrl: "course-what-is-ai.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Match the AI Tool",
  subtitle: "Time to test your skills! Match each task to the right AI tool.",
  steps: [
    {
      type: "match",
      question: "Round 1: Easy ones",
      hint: "Tap an answer, then tap the task.",
      pairs: [
        { prompt: "Write a story", answer: "Chatbot" },
        { prompt: "Make a picture", answer: "Image AI" },
        { prompt: "Hands-free question", answer: "Voice AI" }
      ],
      correctMsg: "Easy round done!",
      wrongMsg: "Think about typing vs. drawing vs. speaking!"
    },
    {
      type: "match",
      question: "Round 2: Real tasks",
      hint: "Pick the AI that does each job.",
      pairs: [
        { prompt: "Plan a birthday party", answer: "Chatbot" },
        { prompt: "Design a logo", answer: "Image AI" },
        { prompt: "Set a kitchen timer", answer: "Voice AI" }
      ],
      correctMsg: "Nice! You picked the right tools.",
      wrongMsg: "Planning = typing. Logo = picture. Timer = voice command."
    },
    {
      type: "match",
      question: "Round 3: Boss level!",
      hint: "These are trickier!",
      pairs: [
        { prompt: "Explain a hard math problem", answer: "Chatbot" },
        { prompt: "Draw your business mascot", answer: "Image AI" },
        { prompt: "Hands-free homework help", answer: "Voice AI" }
      ],
      correctMsg: "Boss level beat!",
      wrongMsg: "Each task fits ONE AI type, think it through!"
    },
    {
      type: "mc",
      question: "Why does it matter which AI you pick?",
      hint: "Think about why this practice mattered.",
      options: [
        { text: "Picking the right tool = better, faster results", correct: true },
        { text: "It doesn't matter at all", correct: false },
        { text: "Only one AI exists", correct: false },
        { text: "AI is too confusing to use", correct: false }
      ],
      correctMsg: "EXACTLY! Right tool = best results. Like using a hammer for nails, not screws.",
      wrongMsg: "The RIGHT tool matters! Using a chatbot to make a picture won't work, gotta match the tool to the task."
    }
  ],
  badges: [
    { icon: "starter", name: "Match Master", earned: true },
    { icon: "star", name: "Tool Picker", earned: ({ correct }) => correct >= 2 },
    { icon: "bulb", name: "Smart Chooser", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "AI Toolbox Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
