<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI as a Helper | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">You see how AI helps people now. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const HELPER_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="20" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/><path d="M 12 56 C 12 44 20 38 32 38 C 44 38 52 44 52 56 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/><circle cx="48" cy="14" r="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/><line x1="48" y1="20" x2="48" y2="28" stroke="#0284c7" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "what-is-ai-2-1",
  courseUrl: "course-what-is-ai.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "AI as a Helper",
  subtitle: "AI is a TOOL, like a calculator or pencil, but smarter. Nova will show you how people use it.",
  steps: [
    {
      type: "teach",
      title: "AI is a Helper, Not a Replacement",
      body: "AI doesn't <b>replace people</b>. It HELPS them do their jobs faster and better. Just like a hammer helps a builder, AI helps everyone from doctors to artists.",
      icon: HELPER_ICON
    },
    {
      type: "teach",
      title: "Doctors Use AI",
      body: "Doctors use AI to look at X-rays and find diseases SUPER fast. AI can spot tiny things the human eye might miss. But the doctor still makes the final call!",
      examples: ["Scans X-rays in seconds", "Spots hidden problems", "Helps doctors save lives"]
    },
    {
      type: "teach",
      title: "Artists Use AI",
      body: "Artists use AI to <b>brainstorm ideas</b>, generate quick sketches, and try new styles. The artist still designs the final piece, AI just helps them work faster.",
      examples: ["Idea generator", "Quick sketches", "Color suggestions"]
    },
    {
      type: "teach",
      title: "Teachers Use AI",
      body: "Teachers use AI to <b>grade quizzes</b>, plan lessons, and explain hard topics to students. AI saves them hours so they can focus on actually teaching kids!",
      examples: ["Grades fast", "Plans lessons", "Translates languages"]
    },
    {
      type: "mc",
      question: "Does AI replace doctors?",
      hint: "Think about who makes the final call.",
      options: [
        { text: "Yes, AI does ALL the work", correct: false },
        { text: "No, AI helps but doctors decide", correct: true },
        { text: "Doctors don't exist anymore", correct: false },
        { text: "AI is the doctor now", correct: false }
      ],
      correctMsg: "Right! AI helps speed things up, but doctors are still in charge.",
      wrongMsg: "AI is a TOOL for doctors, like a stethoscope. The doctor still makes the decisions!"
    },
    {
      type: "mc",
      question: "Mia wants to design a logo for her cookie business. How can AI help?",
      hint: "Think about what an artist uses AI for.",
      options: [
        { text: "Make 100 quick ideas to pick from", correct: true },
        { text: "Do nothing, AI can't draw", correct: false },
        { text: "Steal someone else's logo", correct: false },
        { text: "Bake the cookies", correct: false }
      ],
      correctMsg: "Yes! AI can quickly generate ideas for Mia to choose from.",
      wrongMsg: "AI is GREAT for brainstorming logo ideas! It generates lots of options, then YOU pick the best one."
    },
    {
      type: "mc",
      question: "What's the BEST way to think about AI?",
      hint: "Think about its role.",
      options: [
        { text: "A scary robot taking over the world", correct: false },
        { text: "A smart helper for ANY job", correct: true },
        { text: "Only for tech jobs", correct: false },
        { text: "Just for fun, not useful", correct: false }
      ],
      correctMsg: "EXACTLY! AI is a helper that makes any job easier.",
      wrongMsg: "AI is a HELPER, a tool that makes jobs easier. Not scary, and useful for tons of jobs!"
    }
  ],
  badges: [
    { icon: "starter", name: "AI Helper Aware", earned: true },
    { icon: "star", name: "Sharp Thinker", earned: ({ correct }) => correct >= 2 },
    { icon: "bulb", name: "Big Picture", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Helper Champion", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
