<script>
runLesson({
  lessonId: "prompt-engineering-3-2",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 3 · PRACTICE",
  title: "Prompts for Analysis",
  subtitle: "Practice prompting AI to analyze data, compare options, and spot patterns",
  steps: [
    {
      type: "teach",
      title: "Tell It WHAT to Look For",
      body: "When asking AI to analyze something — sales numbers, customer feedback, competitor info — vague requests like \"analyze this\" get vague results. Instead, tell it exactly what angle to analyze from: trends over time, strengths vs weaknesses, or specific comparisons. The sharper your analytical question, the sharper the insight.",
      examples: []
    },
    {
      type: "mc",
      question: "Which prompt gives the SHARPEST analytical request?",
      hint: "Look for a specific analytical angle.",
      options: [
        { text: "\"Analyze this sales data and identify the 3 months with the biggest drop, and possible reasons why.\"", correct: true },
        { text: "\"Analyze this.\"", correct: false },
        { text: "\"Numbers, thoughts?\"", correct: false },
        { text: "\"Tell me stuff about this data.\"", correct: false }
      ],
      correctMsg: "Yes! It specifies exactly what pattern to find and asks for reasoning.",
      wrongMsg: "The strongest analytical prompt names a specific pattern to look for and asks for reasoning."
    },
    {
      type: "mc",
      question: "A founder shares customer feedback and just says \"thoughts?\" What's the risk of this vague prompt?",
      hint: "Think about unfocused results.",
      options: [
        { text: "The response may be too broad and miss the specific insight the founder actually needs", correct: true },
        { text: "The AI will always find the exact same answer no matter what", correct: false },
        { text: "It's technically impossible for AI to read feedback", correct: false },
        { text: "There's no risk at all — vague prompts are just as effective", correct: false }
      ],
      correctMsg: "Correct! Vague analytical prompts risk missing the actual insight needed.",
      wrongMsg: "A vague prompt like \"thoughts?\" risks a broad, unfocused answer that misses the real insight needed."
    },
    {
      type: "mc",
      question: "What's a good way to get AI to compare two pricing plans?",
      hint: "Think about naming clear comparison points.",
      options: [
        { text: "\"Compare Plan A and Plan B on price, features, and target customer — list pros and cons of each.\"", correct: true },
        { text: "\"Which plan is better, I guess?\"", correct: false },
        { text: "\"Plans.\"", correct: false },
        { text: "\"Say something about pricing.\"", correct: false }
      ],
      correctMsg: "Exactly! Naming specific comparison points (price, features, audience) sharpens the analysis.",
      wrongMsg: "Naming specific comparison criteria like price, features, and audience produces a much clearer analysis."
    },
    {
      type: "mc",
      question: "Why is it helpful to ask AI to explain its REASONING when analyzing data, not just give a conclusion?",
      hint: "Think about trust and double-checking.",
      options: [
        { text: "It lets you check the logic and catch mistakes, rather than blindly trusting a conclusion", correct: true },
        { text: "Reasoning makes the AI's answer factually impossible to be wrong", correct: false },
        { text: "It has no benefit and just wastes time", correct: false },
        { text: "Reasoning is only useful for math homework", correct: false }
      ],
      correctMsg: "Right! Seeing the reasoning lets you verify the logic yourself.",
      wrongMsg: "Asking for reasoning lets you check the logic behind a conclusion instead of blindly trusting it."
    }
  ],
  badges: [
    { icon: "bulb", name: "Analysis Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Insight Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Analysis Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
