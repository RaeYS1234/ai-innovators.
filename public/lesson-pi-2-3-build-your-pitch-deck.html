<script>
runLesson({
  lessonId: "pitching-investors-2-3",
  courseUrl: "course-pitching-investors.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Build Your Pitch Deck",
  subtitle: "Practice putting the pieces together into one strong deck",
  steps: [
    {
      type: "teach",
      title: "Every Slide Earns Its Place",
      body: "A strong deck keeps each slide focused on ONE idea, uses minimal text (investors skim, they don't read essays), and always answers \"so what?\" If a slide doesn't clearly support why this business will succeed, cut it. Simpler and sharper always beats longer and cluttered.",
      examples: []
    },
    {
      type: "mc",
      question: "How much text should a strong pitch deck slide typically have?",
      hint: "Think about skimming, not reading.",
      options: [
        { text: "Minimal text, investors skim slides, they don't read long paragraphs", correct: true },
        { text: "As much text as physically possible", correct: false },
        { text: "Exactly 500 words per slide", correct: false },
        { text: "Text doesn't matter at all on any slide", correct: false }
      ],
      correctMsg: "Right! Minimal text keeps slides skimmable and punchy.",
      wrongMsg: "Strong slides use minimal text, since investors skim rather than read long paragraphs."
    },
    {
      type: "mc",
      question: "A founder has a slide that doesn't clearly connect to why the business will succeed. What should they do?",
      hint: "Think about focus.",
      options: [
        { text: "Cut it or revise it so it clearly supports the case for the business", correct: true },
        { text: "Keep it exactly as-is regardless of relevance", correct: false },
        { text: "Add even MORE unrelated content to that slide", correct: false },
        { text: "Move it to be the very first slide in the deck", correct: false }
      ],
      correctMsg: "Correct! Every slide should clearly support the case for the business.",
      wrongMsg: "If a slide doesn't clearly support the case for the business, it should be cut or revised."
    },
    {
      type: "mc",
      question: "Why should each slide focus on ONE main idea, rather than several?",
      hint: "Think about clarity.",
      options: [
        { text: "It keeps the message clear and easy for investors to follow", correct: true },
        { text: "Multiple ideas per slide are always more persuasive", correct: false },
        { text: "One idea per slide is a legal requirement", correct: false },
        { text: "It has no effect on how clear the pitch is", correct: false }
      ],
      correctMsg: "Exactly! One clear idea per slide keeps the whole pitch easy to follow.",
      wrongMsg: "Focusing each slide on one main idea keeps the message clear and easy for investors to follow."
    },
    {
      type: "mc",
      question: "What question should every slide be able to answer?",
      hint: "Think about relevance to the bigger picture.",
      options: [
        { text: "\"So what?\", why does this matter to the case for the business?", correct: true },
        { text: "\"What font was used?\"", correct: false },
        { text: "\"How many colors are on this slide?\"", correct: false },
        { text: "\"What time is it?\"", correct: false }
      ],
      correctMsg: "Right! Every slide should clearly answer \"so what?\" for the investor.",
      wrongMsg: "Every slide should be able to answer \"so what?\", why it matters to the overall case."
    }
  ],
  badges: [
    { icon: "bulb", name: "Deck Builder Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Slide Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Deck Builder Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
