<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>

    <div class="mascot" id="gameoverMascot"></div>

    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const SOURCES_ICON = `<svg viewBox="0 0 64 64"><rect x="8" y="10" width="22" height="30" rx="2" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><rect x="34" y="10" width="22" height="30" rx="2" fill="white" stroke="#7c3aed" stroke-width="2.5"/><line x1="38" y1="18" x2="52" y2="18" stroke="#7c3aed" stroke-width="2"/><line x1="38" y1="24" x2="52" y2="24" stroke="#7c3aed" stroke-width="2"/><line x1="38" y1="30" x2="46" y2="30" stroke="#7c3aed" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "market-research-1-2",
  courseUrl: "course-market-research.html",
  tag: "UNIT 1 · LESSON 1.2",
  title: "Primary vs Secondary Research",
  subtitle: "Two very different ways to gather the information you need",
  steps: [
    {
      type: "vocab",
      word: "Primary Research",
      pronounce: "say it: PRY-mair-ee REE-surch",
      definition: "<b>Primary research</b> is original data you collect yourself, directly from real people, like surveys, interviews, or observations.",
      example: "Interviewing 20 potential customers yourself about a product idea is primary research.",
      icon: SOURCES_ICON
    },
    {
      type: "teach",
      title: "Original Data vs Existing Data",
      body: "<b>Primary research</b> means YOU collect fresh data, surveys, interviews, focus groups. <b>Secondary research</b> means using EXISTING data others already gathered, industry reports, articles, government statistics. Secondary research is usually faster and cheaper, and it's a great starting point. Primary research takes more effort but answers your SPECIFIC questions that no existing report will cover.",
      examples: ["Primary: surveys, interviews, original & specific", "Secondary: reports, articles, fast & existing", "Smart researchers often use both"]
    },
    {
      type: "mc",
      question: "What is \"primary research\"?",
      hint: "Think about who's collecting it.",
      options: [
        { text: "Original data you collect yourself, directly from real people", correct: true },
        { text: "Reading a report someone else already published", correct: false },
        { text: "Guessing without any evidence", correct: false },
        { text: "Copying a competitor's website exactly", correct: false }
      ],
      correctMsg: "Right! Primary research means collecting fresh, original data yourself.",
      wrongMsg: "Primary research is original data you collect yourself, directly from real people."
    },
    {
      type: "mc",
      question: "Which of these is an example of SECONDARY research?",
      hint: "Think about existing data.",
      options: [
        { text: "Reading an industry report published last year about your market", correct: true },
        { text: "Interviewing 15 customers yourself this week", correct: false },
        { text: "Running your own new survey", correct: false },
        { text: "Watching customers use your product in person", correct: false }
      ],
      correctMsg: "Correct! Using an existing published report is secondary research.",
      wrongMsg: "Secondary research uses existing data others already gathered, like a published industry report."
    },
    {
      type: "mc",
      question: "Why might a founder use BOTH primary and secondary research?",
      hint: "Think about combining speed with specific answers.",
      options: [
        { text: "Secondary research gives a fast overview, while primary research answers specific questions no report covers", correct: true },
        { text: "It's illegal to use only one type of research", correct: false },
        { text: "Using both guarantees the business will never fail", correct: false },
        { text: "Secondary research is always more accurate than primary research", correct: false }
      ],
      correctMsg: "Exactly! Combining both gives a fast overview plus specific, tailored answers.",
      wrongMsg: "Secondary research gives a quick overview, while primary research answers your specific questions directly."
    }
  ],
  badges: [
    { icon: "bulb", name: "Sources Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Research Types Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Research Sources Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
