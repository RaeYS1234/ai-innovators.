<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Earning Practice | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "money-math-2-3",
  courseUrl: "course-money-math.html",
  tag: "UNIT 2 · LESSON 2.3",
  title: "Earning Practice",
  subtitle: "Real word problems! Do the math like a mini business owner.",
  steps: [
    {
      type: "teach",
      title: "Word Problem Superpower",
      body: "Real business people do <b>word problems</b> every day! You read the story, find the numbers, then decide: do you ADD, SUBTRACT, MULTIPLY, or DIVIDE?<br><br>Reading carefully = money smart.",
      examples: ["Read the problem", "Find the numbers", "Pick + - × ÷"]
    },
    {
      type: "mc",
      question: "You mow 4 lawns and earn $8 each. Total earned?",
      hint: "4 lawns × $8 = ?",
      options: [
        { text: "$8", correct: false },
        { text: "$12", correct: false },
        { text: "$32", correct: true },
        { text: "$40", correct: false }
      ],
      correctMsg: "Yes! 4 × $8 = $32. Nice hustle!",
      wrongMsg: "Multiply lawns × price per lawn: 4 × $8 = $32."
    },
    {
      type: "mc",
      question: "You sell 6 bracelets for $2 each. How much did you earn?",
      hint: "6 × $2 = ?",
      options: [
        { text: "$6", correct: false },
        { text: "$8", correct: false },
        { text: "$12", correct: true },
        { text: "$62", correct: false }
      ],
      correctMsg: "Perfect! 6 × $2 = $12.",
      wrongMsg: "6 bracelets × $2 each = $12 total."
    },
    {
      type: "mc",
      question: "Your allowance is $5 per week. How much do you earn in 4 weeks?",
      hint: "$5 × 4 weeks = ?",
      options: [
        { text: "$5", correct: false },
        { text: "$9", correct: false },
        { text: "$20", correct: true },
        { text: "$45", correct: false }
      ],
      correctMsg: "Right! $5 × 4 = $20 per month.",
      wrongMsg: "$5 per week × 4 weeks = $20."
    },
    {
      type: "mc",
      question: "You have $30. You earned $20 more. Now how much?",
      hint: "$30 + $20 = ?",
      options: [
        { text: "$30", correct: false },
        { text: "$50", correct: true },
        { text: "$20", correct: false },
        { text: "$10", correct: false }
      ],
      correctMsg: "Yes! $30 + $20 = $50.",
      wrongMsg: "Add: $30 + $20 = $50."
    },
    {
      type: "mc",
      question: "You earn $18 doing chores. Your parents match with $18 more. Total?",
      hint: "$18 + $18 = ?",
      options: [
        { text: "$18", correct: false },
        { text: "$28", correct: false },
        { text: "$36", correct: true },
        { text: "$180", correct: false }
      ],
      correctMsg: "Awesome! $18 + $18 = $36. Doubled up!",
      wrongMsg: "$18 + $18 = $36. When something is matched, it doubles."
    },
    {
      type: "mc",
      question: "You want to earn $50 in a month. You made $12 week 1, $15 week 2, $10 week 3. How much MORE do you need in week 4?",
      hint: "Add what you have, then see how much to reach $50.",
      options: [
        { text: "$5", correct: false },
        { text: "$13", correct: true },
        { text: "$27", correct: false },
        { text: "$50", correct: false }
      ],
      correctMsg: "🎯 Nailed it! $12+$15+$10 = $37. $50-$37 = $13 more needed.",
      wrongMsg: "Add up what you have ($37), then subtract from $50 = $13 to go."
    }
  ],
  badges: [
    { icon: "money", name: "Word Problem Whiz", earned: true },
    { icon: "star", name: "Multiplier", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Math Genius", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Money Mathematician", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
