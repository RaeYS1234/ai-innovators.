<script>
const BRAIN_ICON = `<svg viewBox="0 0 64 64"><path d="M22 12 C 12 12 8 22 12 28 C 8 34 12 44 22 46 C 24 52 40 52 42 46 C 52 44 56 34 52 28 C 56 22 52 12 42 12 C 40 8 24 8 22 12 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5"/><circle cx="24" cy="24" r="2.5" fill="#6d28d9"/><circle cx="34" cy="20" r="2.5" fill="#6d28d9"/><circle cx="40" cy="30" r="2.5" fill="#6d28d9"/><circle cx="26" cy="36" r="2.5" fill="#6d28d9"/><line x1="24" y1="24" x2="34" y2="20" stroke="#6d28d9" stroke-width="1.5"/><line x1="34" y1="20" x2="40" y2="30" stroke="#6d28d9" stroke-width="1.5"/><line x1="24" y1="24" x2="26" y2="36" stroke="#6d28d9" stroke-width="1.5"/></svg>`;

runLesson({
  lessonId: "prompt-engineering-1-1",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "How Language Models Think",
  subtitle: "Understanding what's really happening inside an AI when it answers you",
  steps: [
    {
      type: "vocab",
      word: "Large Language Model (LLM)",
      pronounce: "say it: LARJ LANG-gwij MOD-ul",
      definition: "A <b>Large Language Model (LLM)</b> is an AI trained on huge amounts of text that predicts the most likely next word, over and over, to build a full response.",
      example: "ChatGPT and Claude are both LLMs — they generate answers by predicting word after word based on patterns learned from massive amounts of text.",
      icon: BRAIN_ICON
    },
    {
      type: "teach",
      title: "Prediction, Not Real Understanding",
      body: "An LLM doesn't \"know\" facts the way a person does. It has learned patterns from enormous amounts of text and predicts the most likely next word given everything written so far — including your prompt. This means the QUALITY of your prompt directly shapes the quality of its prediction. Vague prompts lead to vague, generic predictions. Clear, detailed prompts guide it toward much better ones.",
      examples: ["LLMs predict word-by-word based on patterns", "Your prompt is the strongest signal guiding that prediction", "Better prompts → better predictions → better answers"]
    },
    {
      type: "mc",
      question: "What does an LLM actually do when it generates a response?",
      hint: "Think about predicting, not \"knowing.\"",
      options: [
        { text: "Predicts the most likely next word, over and over, based on learned patterns", correct: true },
        { text: "Looks up the exact answer in a fixed database of facts", correct: false },
        { text: "Randomly generates letters with no pattern at all", correct: false },
        { text: "Calls a human to type the response", correct: false }
      ],
      correctMsg: "Right! LLMs generate text by predicting the next word, again and again.",
      wrongMsg: "An LLM predicts the most likely next word repeatedly, based on patterns learned from training text."
    },
    {
      type: "mc",
      question: "Why does the QUALITY of your prompt matter so much?",
      hint: "Think about what guides the prediction.",
      options: [
        { text: "Your prompt is the main signal the model uses to predict a good response", correct: true },
        { text: "Prompt quality has no effect on the AI's answer at all", correct: false },
        { text: "Only very long prompts ever work", correct: false },
        { text: "The AI ignores your prompt and always gives the same answer", correct: false }
      ],
      correctMsg: "Exactly! A clearer prompt gives the model a much better signal to predict from.",
      wrongMsg: "Since the model predicts based on your prompt, a clearer prompt leads to a much better response."
    },
    {
      type: "mc",
      question: "A student types a vague prompt: \"write something.\" What's the most likely result?",
      hint: "Think about vague inputs leading to vague outputs.",
      options: [
        { text: "A generic, unfocused response since there's little guidance to predict from", correct: true },
        { text: "A perfectly tailored essay exactly matching their hidden intentions", correct: false },
        { text: "An error message that crashes the AI", correct: false },
        { text: "The exact same result no matter what they typed", correct: false }
      ],
      correctMsg: "Correct! Vague prompts tend to produce vague, generic results.",
      wrongMsg: "A vague prompt gives the model little to guide its prediction, so the result tends to be generic."
    }
  ],
  badges: [
    { icon: "bulb", name: "AI Thinker Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Model Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "LLM Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
