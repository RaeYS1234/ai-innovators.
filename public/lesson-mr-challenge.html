<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Market Researcher Challenge | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">FINAL CHALLENGE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Start Challenge!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Market Researcher!</h1>
    <p class="complete-subtitle">You crushed the final challenge! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! Great researchers double-check their work!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "market-research-challenge",
  courseUrl: "course-market-research.html",
  tag: "FINAL CHALLENGE",
  title: "Market Researcher Challenge",
  subtitle: "Prove you've mastered research methods, AI-assisted analysis, and finding real opportunities",
  steps: [
    {
      type: "mc",
      question: "What is market research?",
      hint: "Think about gathering information before deciding.",
      options: [
        { text: "Gathering information about customers, competitors, and trends before making decisions", correct: true },
        { text: "Randomly guessing what customers might want", correct: false },
        { text: "A legal requirement to start any business", correct: false },
        { text: "Something only huge companies ever do", correct: false }
      ],
      correctMsg: "Right! Market research means gathering real information before deciding.",
      wrongMsg: "Market research is gathering information about customers, competitors, and trends before deciding."
    },
    {
      type: "mc",
      question: "What's the difference between primary and secondary research?",
      hint: "Think about who collected the data.",
      options: [
        { text: "Primary is original data you collect yourself; secondary is existing data others already gathered", correct: true },
        { text: "They mean exactly the same thing", correct: false },
        { text: "Secondary research is always collected first", correct: false },
        { text: "Primary research can only ever be done by big companies", correct: false }
      ],
      correctMsg: "Correct! Primary is original data you collect; secondary is existing published data.",
      wrongMsg: "Primary research is original data you collect yourself; secondary research uses existing published data."
    },
    {
      type: "mc",
      question: "Why should researchers avoid \"leading questions\"?",
      hint: "Think about honest answers.",
      options: [
        { text: "Leading questions push people toward an answer, risking false or misleading results", correct: true },
        { text: "Leading questions are illegal to ask anyone", correct: false },
        { text: "They always take longer to answer than other questions", correct: false },
        { text: "There's no real downside to leading questions", correct: false }
      ],
      correctMsg: "Yes! Leading questions risk pushing people toward a specific, possibly dishonest answer.",
      wrongMsg: "Leading questions push people toward an answer, risking false or misleading research results."
    },
    {
      type: "mc",
      question: "What is sentiment analysis?",
      hint: "Think about detecting feelings in text.",
      options: [
        { text: "Using AI to detect whether text expresses positive, negative, or neutral feelings", correct: true },
        { text: "A method for designing a company logo", correct: false },
        { text: "A type of customer refund policy", correct: false },
        { text: "Counting exactly how many words are in a paragraph", correct: false }
      ],
      correctMsg: "Correct! Sentiment analysis detects the emotional tone in text using AI.",
      wrongMsg: "Sentiment analysis uses AI to detect whether text expresses positive, negative, or neutral feelings."
    },
    {
      type: "mc",
      question: "A founder sees ONE customer mention a random complaint. Is this alone strong evidence of a real trend?",
      hint: "Think about repetition.",
      options: [
        { text: "No, real trends usually need to repeat across many data points to be meaningful", correct: true },
        { text: "Yes, one single mention always confirms a guaranteed trend", correct: false },
        { text: "It means the business should shut down immediately", correct: false },
        { text: "It proves the product is a total failure", correct: false }
      ],
      correctMsg: "Right! A single mention alone usually isn't enough to confirm a real trend.",
      wrongMsg: "Real trends usually need to repeat across many data points, one single mention alone is weak evidence."
    },
    {
      type: "mc",
      question: "What makes a customer persona useful?",
      hint: "Think about what goes beyond just a name.",
      options: [
        { text: "It's based on real research and includes goals, frustrations, and current behavior", correct: true },
        { text: "It's a completely random guess with zero research behind it", correct: false },
        { text: "It only needs a fake name and nothing else", correct: false },
        { text: "It should describe every single customer exactly, with no generalization", correct: false }
      ],
      correctMsg: "Exactly! Real research plus goals, frustrations, and behavior makes a persona genuinely useful.",
      wrongMsg: "A useful persona is based on real research and includes goals, frustrations, and current behavior."
    },
    {
      type: "mc",
      question: "What is a \"market gap\"?",
      hint: "Think about unmet needs.",
      options: [
        { text: "An unmet need that no current option serves well", correct: true },
        { text: "The exact price a company charges for a product", correct: false },
        { text: "A hole in a competitor's website design", correct: false },
        { text: "A legal document required to launch a business", correct: false }
      ],
      correctMsg: "Right! A market gap is an unmet need with no good current solution.",
      wrongMsg: "A market gap is an unmet need, something customers want that no current option serves well."
    }
  ],
  badges: [
    { icon: "trophy", name: "Market Researcher", earned: true },
    { icon: "star", name: "Sharp Thinker", earned: ({ correct }) => correct >= 4 },
    { icon: "brain", name: "Research Smart", earned: ({ correct }) => correct >= 6 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "Research Master", earned: ({ score, hearts }) => score >= 85 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
