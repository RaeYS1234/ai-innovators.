<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Word-of-Mouth & Reviews — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const REVIEW_ICON = `<svg viewBox="0 0 64 64"><path d="M8 12 L56 12 L56 40 L28 40 L16 52 L16 40 L8 40 Z" fill="white" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/><polygon points="32,18 35,25 42,25 36,29 38,36 32,32 26,36 28,29 22,25 29,25" fill="#fbbf24"/></svg>`;

runLesson({
  lessonId: "marketing-branding-2-3",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 2 · LESSON 2.3",
  title: "Word-of-Mouth & Reviews",
  subtitle: "The oldest, most powerful marketing tool: a happy customer telling a friend.",
  steps: [
    {
      type: "vocab",
      word: "Word-of-Mouth",
      pronounce: "say it: word-of-mouth",
      definition: "<b>Word-of-mouth</b> is when happy customers tell their friends and family about your business — no ads needed, just real recommendations.",
      example: "If your neighbor loves your cookies and tells 5 friends, that's word-of-mouth marketing working for free!",
      icon: REVIEW_ICON
    },
    {
      type: "teach",
      title: "Why People Trust Reviews",
      body: "People trust a friend's recommendation — or a stranger's honest online review — WAY more than an ad, because ads are trying to sell you something. Reviews feel more real and unbiased.",
      examples: ["Friends' opinions feel honest", "Reviews feel unbiased", "Ads feel like selling"]
    },
    {
      type: "teach",
      title: "Earning Word-of-Mouth",
      body: "You can't force word-of-mouth — you EARN it by giving people a great experience worth talking about, and by simply asking happy customers to leave a review or tell a friend.",
      examples: ["Give a great experience", "Ask happy customers to share", "Make it easy to leave a review"]
    },
    {
      type: "mc",
      question: "What is word-of-mouth marketing?",
      hint: "Think about friends telling friends.",
      options: [
        { text: "Happy customers telling friends and family about your business", correct: true },
        { text: "Paying for a TV ad", correct: false },
        { text: "A business's official slogan", correct: false },
        { text: "Sending spam texts", correct: false }
      ],
      correctMsg: "Right! It's real people sharing real recommendations.",
      wrongMsg: "Word-of-mouth is happy customers naturally telling others — not paid ads or slogans."
    },
    {
      type: "mc",
      question: "Why do people often trust a friend's recommendation MORE than an ad?",
      hint: "Think about who's trying to sell you something.",
      options: [
        { text: "A friend isn't trying to sell you anything — it feels more honest", correct: true },
        { text: "Friends always lie more than ads", correct: false },
        { text: "Ads are always 100% true", correct: false },
        { text: "There's no difference at all", correct: false }
      ],
      correctMsg: "Exactly! A friend's opinion feels unbiased and honest.",
      wrongMsg: "Friends aren't trying to sell you something, so their opinion feels more trustworthy than an ad."
    },
    {
      type: "mc",
      question: "What's the BEST way to earn more word-of-mouth?",
      hint: "You can't force it — you earn it.",
      options: [
        { text: "Give a great experience, then simply ask happy customers to share", correct: true },
        { text: "Beg strangers online constantly", correct: false },
        { text: "Ignore your customers completely", correct: false },
        { text: "Make the experience worse on purpose", correct: false }
      ],
      correctMsg: "Yes! Great experience + a simple ask = real word-of-mouth.",
      wrongMsg: "You earn word-of-mouth with a great experience, then asking happy customers to share it."
    },
    {
      type: "mc",
      question: "FINAL: A customer leaves a 5-star review saying \"best cookies ever!\" What should the business do?",
      hint: "Think about showing appreciation and using it.",
      options: [
        { text: "Thank them and maybe share the review on social media", correct: true },
        { text: "Ignore it completely", correct: false },
        { text: "Delete it so nobody sees it", correct: false },
        { text: "Argue with the customer", correct: false }
      ],
      correctMsg: "PERFECT! Say thanks and share great reviews to build even more trust.",
      wrongMsg: "A great review is gold — thank the customer and share it to build more trust."
    }
  ],
  badges: [
    { icon: "starter", name: "Reputation Starter", earned: true },
    { icon: "star", name: "Trust Builder", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Review Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Word-of-Mouth Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
