<script>
const ANGEL_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="24" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><path d="M10 50 C 10 36 20 30 32 30 C 44 30 54 36 54 50 Z" fill="white" stroke="#d97706" stroke-width="2"/><path d="M6 34 L20 40 L6 46 Z" fill="#f9fafb" stroke="#d97706" stroke-width="1.5"/><path d="M58 34 L44 40 L58 46 Z" fill="#f9fafb" stroke="#d97706" stroke-width="1.5"/></svg>`;

runLesson({
  lessonId: "startup-fundamentals-3-2",
  courseUrl: "course-startup-fundamentals.html",
  tag: "UNIT 3 · LESSON 3.2",
  title: "Angel Investors & VCs",
  subtitle: "Two very different types of people who invest in startups",
  steps: [
    {
      type: "vocab",
      word: "Venture Capital (VC)",
      pronounce: "say it: VEN-cher CAP-ih-tal",
      definition: "<b>Venture capital</b> is money invested by firms (VCs) that manage large funds, investing in many startups hoping a few become huge successes.",
      example: "A VC firm might invest $2 million in a startup in exchange for 15% ownership.",
      icon: ANGEL_ICON
    },
    {
      type: "teach",
      title: "Angels vs VCs",
      body: "An <b>angel investor</b> is usually a single wealthy individual investing their own money, often early and in smaller amounts. A <b>VC (venture capital) firm</b> manages a large fund from many investors, usually investing bigger amounts, often a bit later once a startup shows real traction.",
      examples: ["Angel: individual, own money, often earliest", "VC: firm, managed fund, often bigger checks"]
    },
    {
      type: "mc",
      question: "What is an \"angel investor\"?",
      hint: "Think about a single person.",
      options: [
        { text: "A wealthy individual investing their own money in startups", correct: true },
        { text: "A government program for startups", correct: false },
        { text: "A bank that only gives loans", correct: false },
        { text: "A type of customer, not investor", correct: false }
      ],
      correctMsg: "Right! Angel investors are individuals investing their own money.",
      wrongMsg: "An angel investor is a wealthy individual who invests their own personal money."
    },
    {
      type: "mc",
      question: "What is \"venture capital\"?",
      hint: "Think about firms managing big funds.",
      options: [
        { text: "Money from firms managing large funds, investing in many startups", correct: true },
        { text: "Money the founder saves personally", correct: false },
        { text: "A type of tax", correct: false },
        { text: "Free money with no ownership given up", correct: false }
      ],
      correctMsg: "Correct! VC firms manage large funds and invest across many startups.",
      wrongMsg: "Venture capital comes from firms that manage large funds, investing in many startups."
    },
    {
      type: "mc",
      question: "Which typically invests EARLIER in a startup's life, angels or VCs?",
      hint: "Think about who takes risks on very new ideas.",
      options: [
        { text: "Angel investors, often before there's much proof the idea works", correct: true },
        { text: "VCs always invest first, before angels", correct: false },
        { text: "They always invest at the exact same time", correct: false },
        { text: "Neither ever invests early", correct: false }
      ],
      correctMsg: "Yes! Angels often take the earliest, riskiest bets.",
      wrongMsg: "Angel investors typically invest earlier, often before a startup has much proof it works."
    },
    {
      type: "mc",
      question: "Why do VC firms invest in MANY startups instead of just one?",
      hint: "Think about risk and odds.",
      options: [
        { text: "Most startups fail, so spreading bets increases the odds one becomes a huge win", correct: true },
        { text: "It's required by law to invest in at least 100 companies", correct: false },
        { text: "Investing in one company is always more profitable", correct: false },
        { text: "VCs never actually lose money on any investment", correct: false }
      ],
      correctMsg: "Exactly! Spreading investments across many startups improves the odds of a big win.",
      wrongMsg: "Since most startups fail, VCs spread bets across many companies hoping a few become huge successes."
    }
  ],
  badges: [
    { icon: "bulb", name: "Investor Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Investor Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Investor Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
