<!DOCTYPE html>
<html lang="en">
<head>

<title>What is a Logo? — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const LOGO_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/><text x="32" y="41" font-size="24" fill="white" text-anchor="middle" font-weight="900" font-family="sans-serif">S</text></svg>`;

runLesson({
  lessonId: "ai-pictures-2-1",
  courseUrl: "course-ai-pictures.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "What is a Logo?",
  subtitle: "Discover the tiny picture that makes a business unforgettable!",
  steps: [
    {
      type: "vocab",
      word: "Logo",
      pronounce: "say it: LOH-go",
      definition: "A <b>logo</b> is a simple picture or symbol that represents your business — it's the first thing people notice and remember.",
      example: "The Nike swoosh and the Apple bitten-apple are both famous logos you'd recognize instantly.",
      icon: LOGO_ICON
    },
    {
      type: "teach",
      title: "What Makes a Great Logo",
      body: "The best logos are <b>simple</b> (easy to recognize even tiny), <b>memorable</b> (sticks in your brain), and <b>meaningful</b> (connects to what the business does). Think of a lemon shape for a lemonade stand!",
      examples: ["Simple shapes", "Easy to remember", "Connects to the business"]
    },
    {
      type: "teach",
      title: "Logos and AI",
      body: "AI image tools can generate logo ideas fast! Describe your business name, a shape or symbol, and your colors — AI gives you a starting point you can pick from and refine.",
      examples: ["Give your business name", "Pick a symbol", "Choose your colors"]
    },
    {
      type: "mc",
      question: "What is a logo?",
      hint: "Think about first impressions.",
      options: [
        { text: "A simple picture or symbol that represents your business", correct: true },
        { text: "A long paragraph about your business", correct: false },
        { text: "Your business's phone number", correct: false },
        { text: "A type of receipt", correct: false }
      ],
      correctMsg: "Right! A logo is the visual symbol of your business.",
      wrongMsg: "A logo is a simple picture or symbol — not text, numbers, or receipts."
    },
    {
      type: "mc",
      question: "Which of these makes the BEST logo?",
      hint: "Think simple and clear.",
      options: [
        { text: "A busy picture with 20 tiny details and 10 colors", correct: false },
        { text: "A simple, clear shape that's easy to recognize even tiny", correct: true },
        { text: "A photo of your whole family", correct: false },
        { text: "Random scribbles", correct: false }
      ],
      correctMsg: "Yes! Simple and clear wins every time — even at a tiny size.",
      wrongMsg: "Great logos are simple and clear so people recognize them instantly, even small."
    },
    {
      type: "mc",
      question: "FINAL: You're designing a logo for a business called \"Paw Print Pet Sitting.\" What's the smartest symbol choice?",
      hint: "Connect the symbol to the business.",
      options: [
        { text: "A paw print — it directly connects to pets", correct: true },
        { text: "A random star", correct: false },
        { text: "A slice of pizza", correct: false },
        { text: "A car", correct: false }
      ],
      correctMsg: "PERFECT! A paw print instantly tells people this is about pets.",
      wrongMsg: "Pick a symbol that connects to what the business actually does — a paw print fits pet sitting."
    }
  ],
  badges: [
    { icon: "starter", name: "Logo Learner", earned: true },
    { icon: "star", name: "Design Eye", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Brand Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Logo Genius", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
