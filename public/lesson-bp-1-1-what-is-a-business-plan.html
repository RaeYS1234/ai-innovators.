<script>
const BIZPLAN_ICON = `<svg viewBox="0 0 64 64"><rect x="14" y="6" width="36" height="52" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/><rect x="24" y="2" width="16" height="10" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/><line x1="20" y1="22" x2="44" y2="22" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/><line x1="20" y1="30" x2="44" y2="30" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/><line x1="20" y1="38" x2="36" y2="38" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/><circle cx="46" cy="46" r="14" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/><path d="M 40 46 L 44 50 L 52 40" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

runLesson({
  lessonId: "business-plan-1-1",
  courseUrl: "course-business-plan.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "What Is a Business Plan?",
  subtitle: "The one document every real founder writes before spending a single dollar.",
  steps: [
    {
      type: "vocab",
      word: "Business Plan",
      pronounce: "say it: BIZ-ness plan",
      definition: "A <b>business plan</b> is a written document that explains what your business does, who it helps, how it makes money, and how it will grow. It's the map that keeps a founder from getting lost.",
      example: "Moziah Bridges started Mo's Bows, a handmade bow tie company, at age 9. By age 12, his plan was clear enough to pitch on Shark Tank, and investor Daymond John was so impressed he offered to mentor him instead of just handing over money.",
      icon: BIZPLAN_ICON
    },
    {
      type: "teach",
      title: "Why Every Business Needs One",
      body: "A business plan isn't paperwork for the sake of paperwork, it's a thinking tool. Writing one forces you to answer the hard questions <b>before</b> you spend money: Who actually wants what I'm selling? What will it cost me to make? How will people even find out about it? Businesses that skip this step often waste money guessing. Businesses that plan first build on facts.",
      examples: ["Answers hard questions early", "Stops wasted money", "Helps you get funding", "Proves you're serious"]
    },
    {
      type: "teach",
      title: "The Four Big Parts",
      body: "Every solid business plan covers the same four things, whether it's a lemonade stand or a billion-dollar company: what you're selling and why (Executive Summary), who will buy it (Target Market), who else sells something similar (Competition), and how the numbers work out (Money Plan). You'll build all four over this course.",
      examples: ["Executive Summary", "Target Market", "Competition", "Money Plan"]
    },
    {
      type: "mc",
      question: "What is a business plan?",
      hint: "Think about what it explains.",
      options: [
        { text: "A written document explaining what your business does, who it helps, and how it makes money", correct: true },
        { text: "A list of your favorite businesses", correct: false },
        { text: "A poster you hang in your room", correct: false },
        { text: "A savings account at the bank", correct: false }
      ],
      correctMsg: "Exactly! A business plan is your written map for the whole business.",
      wrongMsg: "A business plan is a written document, it explains what your business does, who it helps, and how it earns money."
    },
    {
      type: "mc",
      question: "Why should you write a business plan BEFORE you spend any money?",
      hint: "What does planning first help you avoid?",
      options: [
        { text: "So you can guess and hope it works out", correct: false },
        { text: "So you answer the hard questions first and avoid wasting money", correct: true },
        { text: "Because the law requires it for every business", correct: false },
        { text: "So you have something to show your teacher", correct: false }
      ],
      correctMsg: "Right! Planning first means you build on facts instead of guesses.",
      wrongMsg: "Planning first helps you answer tough questions BEFORE you spend money, so you're building on facts, not guesses."
    },
    {
      type: "mc",
      question: "Moziah Bridges started Mo's Bows, his bow tie company, at what age?",
      hint: "It's the same number from the vocab example.",
      options: [
        { text: "Age 16", correct: false },
        { text: "Age 9", correct: true },
        { text: "Age 25", correct: false },
        { text: "Age 5", correct: false }
      ],
      correctMsg: "Yes! He started at 9, and by 12 his plan was strong enough to pitch on Shark Tank.",
      wrongMsg: "Moziah Bridges started Mo's Bows at age 9, by age 12, his plan was ready to pitch on Shark Tank."
    },
    {
      type: "mc",
      question: "Which of these is NOT one of the four big parts of a business plan?",
      hint: "Three of these are real sections, one is unrelated.",
      options: [
        { text: "Executive Summary", correct: false },
        { text: "Target Market", correct: false },
        { text: "Your favorite video game", correct: true },
        { text: "Money Plan", correct: false }
      ],
      correctMsg: "Correct! Your favorite game has nothing to do with your business plan.",
      wrongMsg: "The four big parts are Executive Summary, Target Market, Competition, and Money Plan, your favorite video game isn't one of them."
    }
  ],
  badges: [
    { icon: "starter", name: "Plan Starter", earned: true },
    { icon: "bulb", name: "Big Thinker", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Business Brain", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Future Founder", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
