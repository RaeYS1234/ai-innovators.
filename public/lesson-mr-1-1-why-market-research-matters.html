<script src="lesson-engine.js"></script>
<script>
const RESEARCH_ICON = `<svg viewBox="0 0 64 64"><circle cx="26" cy="26" r="16" fill="none" stroke="#7c3aed" stroke-width="4"/><line x1="37" y1="37" x2="54" y2="54" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><path d="M18 26 L24 32 L34 20" stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

runLesson({
  lessonId: "market-research-1-1",
  courseUrl: "course-market-research.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "Why Market Research Matters",
  subtitle: "How understanding your market before you build saves time, money, and heartbreak",
  steps: [
    {
      type: "vocab",
      word: "Market Research",
      pronounce: "say it: MAR-ket REE-surch",
      definition: "<b>Market research</b> is the process of gathering information about customers, competitors, and industry trends before making business decisions.",
      example: "Before launching a new snack brand, a founder surveys 100 potential customers to see if they'd actually buy it, that's market research.",
      icon: RESEARCH_ICON
    },
    {
      type: "teach",
      title: "Build the Right Thing, Not Just A Thing",
      body: "Many startups fail not because they built something poorly, but because they built something nobody actually wanted. Market research reduces this risk by testing assumptions BEFORE investing months of time and money. It answers questions like: Does this problem really exist? How big is the potential market? What are competitors already doing?",
      examples: ["Confirms real demand before you build", "Reveals how big the opportunity actually is", "Shows what competitors are already doing"]
    },
    {
      type: "mc",
      question: "What is \"market research\"?",
      hint: "Think about gathering information before deciding.",
      options: [
        { text: "Gathering information about customers, competitors, and trends before making decisions", correct: true },
        { text: "Randomly guessing what customers might want", correct: false },
        { text: "A legal requirement to start any business", correct: false },
        { text: "Only something huge companies need to do", correct: false }
      ],
      correctMsg: "Right! Market research is gathering real information before deciding.",
      wrongMsg: "Market research is the process of gathering info about customers, competitors, and trends before deciding."
    },
    {
      type: "mc",
      question: "What's a MAIN reason startups fail, that market research helps prevent?",
      hint: "Think about building something nobody wants.",
      options: [
        { text: "Building something nobody actually wanted or needed", correct: true },
        { text: "Having too many happy customers", correct: false },
        { text: "Spending too little time on the idea", correct: false },
        { text: "Doing too much research before launching", correct: false }
      ],
      correctMsg: "Correct! Building something without real demand is a top reason startups fail.",
      wrongMsg: "A major failure reason is building something nobody actually wanted, research helps catch this early."
    },
    {
      type: "mc",
      question: "A founder skips research and spends 6 months building an app, only to find nobody wants it. What could have helped?",
      hint: "Think about testing before building.",
      options: [
        { text: "Doing market research first to test real demand before investing months of work", correct: true },
        { text: "Building the app even faster next time", correct: false },
        { text: "Never talking to any potential customers, ever", correct: false },
        { text: "Making the app more complicated", correct: false }
      ],
      correctMsg: "Exactly! Testing demand first would have saved months of wasted effort.",
      wrongMsg: "Doing market research first tests real demand, potentially saving months of wasted building time."
    }
  ],
  badges: [
    { icon: "bulb", name: "Research Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Market Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Research Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
