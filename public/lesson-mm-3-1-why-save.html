<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Why Save? — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const PIGGY_ICON = `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="38" rx="22" ry="16" fill="#fda4af" stroke="#be185d" stroke-width="2"/><ellipse cx="16" cy="34" rx="6" ry="8" fill="#fda4af" stroke="#be185d" stroke-width="2"/><path d="M 20 26 L 24 22 L 22 30" fill="#fda4af" stroke="#be185d" stroke-width="2" stroke-linejoin="round"/><path d="M 44 26 L 40 22 L 42 30" fill="#fda4af" stroke="#be185d" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="34" r="1.5" fill="#1c1917"/><circle cx="28" cy="32" r="1.5" fill="#1c1917"/><ellipse cx="12" cy="36" rx="3" ry="2" fill="#f9a8d4"/><circle cx="10" cy="35" r="0.5" fill="#1c1917"/><circle cx="14" cy="35" r="0.5" fill="#1c1917"/><rect x="28" y="24" width="8" height="2" rx="1" fill="#1c1917"/><rect x="20" y="50" width="4" height="6" fill="#be185d"/><rect x="40" y="50" width="4" height="6" fill="#be185d"/><circle cx="45" cy="14" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/><text x="45" y="17" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle" font-family="sans-serif">$</text><path d="M 45 20 Q 44 24 42 26" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`;

runLesson({
  lessonId: "money-math-3-1",
  courseUrl: "course-money-math.html",
  tag: "UNIT 3 · LESSON 3.1",
  title: "Why Save?",
  subtitle: "Saving money is a superpower. Let's find out why!",
  steps: [
    {
      type: "vocab",
      word: "Saving",
      pronounce: "say it: SAY-ving",
      definition: "<b>Saving</b> is when you <b>keep some of your money instead of spending it all</b>. You put it away for later — for something bigger and better!",
      example: "You have $10 and only spend $3. You SAVED $7!",
      icon: PIGGY_ICON
    },
    {
      type: "teach",
      title: "3 Big Reasons to Save",
      body: "Smart people save for these reasons:<br><br>🎯 <b>Big goals</b> — like a bike, a phone, or college<br>🚨 <b>Emergencies</b> — when something breaks or you need help<br>💪 <b>Freedom</b> — money in the bank means MORE CHOICES",
      examples: ["Big goals", "Emergencies", "Freedom to choose"]
    },
    {
      type: "mc",
      question: "You want to buy a $60 bike. Which is smarter?",
      hint: "You don't have $60 yet.",
      options: [
        { text: "Spend all your $10 allowance every week", correct: false },
        { text: "Save $5 each week until you have enough", correct: true },
        { text: "Wait for a birthday and hope", correct: false },
        { text: "Beg parents", correct: false }
      ],
      correctMsg: "Yes! Save $5/week × 12 weeks = $60. Bike unlocked!",
      wrongMsg: "Saving little by little adds up: $5/week for 12 weeks = $60."
    },
    {
      type: "mc",
      question: "Why is having an EMERGENCY fund important?",
      hint: "Life is unpredictable!",
      options: [
        { text: "It makes you popular", correct: false },
        { text: "So you're ready if something unexpected happens", correct: true },
        { text: "So you can buy candy", correct: false },
        { text: "Because parents say so", correct: false }
      ],
      correctMsg: "Right! Emergencies are surprises. Money helps you handle them.",
      wrongMsg: "Emergency money = ready for surprises like a broken bike or lost thing."
    },
    {
      type: "mc",
      question: "You save $2 every week. How much after 10 weeks?",
      hint: "$2 × 10 = ?",
      options: [
        { text: "$2", correct: false },
        { text: "$10", correct: false },
        { text: "$20", correct: true },
        { text: "$200", correct: false }
      ],
      correctMsg: "🎯 $2 × 10 weeks = $20. Small savings become BIG savings!",
      wrongMsg: "$2 per week × 10 weeks = $20 total saved."
    },
    {
      type: "mc",
      question: "You get $50 for your birthday. Save 50% or spend it ALL. Which is smart?",
      hint: "Balance is key. Save some, enjoy some.",
      options: [
        { text: "Save all $50", correct: false },
        { text: "Save $25, spend $25 on something fun", correct: true },
        { text: "Spend all $50", correct: false },
        { text: "Give it all away", correct: false }
      ],
      correctMsg: "Smart! Save some for later + enjoy some now = happy AND future-you thanks you.",
      wrongMsg: "Best answer is BALANCE. Save half, enjoy half. Both future you AND now you win."
    }
  ],
  badges: [
    { icon: "money", name: "Saver", earned: true },
    { icon: "star", name: "Goal Setter", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Future Thinker", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Money Wise", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
