<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Designing with Canva AI — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "ai-tools-1-2",
  courseUrl: "course-ai-tools-workshop.html",
  tag: "UNIT 1 · LESSON 1.2",
  title: "Designing with Canva AI",
  subtitle: "Turn your ideas into logos, posters, and more — no art degree needed!",
  steps: [
    {
      type: "teach",
      title: "What is Canva Magic Studio?",
      body: "Canva is a design tool, and its AI feature called <b>Magic Studio</b> can create logos, posters, social posts, and more — just from your text description. Type what you want, and Canva's AI designs it for you in seconds!",
      examples: ["Magic Design", "Text to Image", "Logo maker", "Magic Write"]
    },
    {
      type: "teach",
      title: "Making a Logo with AI",
      body: "To make a logo with Canva AI: describe your business (name + what it does + colors you like), let the AI generate a few options, then pick your favorite and tweak the colors, fonts, or icons until it feels like YOU.",
      examples: ["Describe your biz", "Generate options", "Pick a favorite", "Tweak it"]
    },
    {
      type: "mc",
      question: "What does Canva's Magic Studio do?",
      hint: "Think 'design,' not 'sound.'",
      options: [
        { text: "Only prints photos", correct: false },
        { text: "Uses AI to create designs like logos and posters from your text", correct: true },
        { text: "Deletes your files", correct: false },
        { text: "Only makes music", correct: false }
      ],
      correctMsg: "Yes! Magic Studio turns your text description into real designs.",
      wrongMsg: "Magic Studio is Canva's AI feature — it builds designs (logos, posters, and more) from a text description you give it."
    },
    {
      type: "mc",
      question: "You want a logo for 'Luna's Slime Shop.' What's the BEST info to give Canva AI?",
      hint: "More details = a design that actually fits YOUR business.",
      options: [
        { text: "Nothing — just click a random logo", correct: false },
        { text: "The business name, what it sells, and colors you like", correct: true },
        { text: "Your home address", correct: false },
        { text: "Just the word 'logo'", correct: false }
      ],
      correctMsg: "Perfect! The more details you give, the more it matches YOUR business.",
      wrongMsg: "Give Canva AI the business name, what it sells, and your favorite colors — the more details, the better the design match."
    },
    {
      type: "mc",
      question: "Canva AI makes you 4 logo options. None are perfect. What now?",
      hint: "Don't settle for 'good enough.'",
      options: [
        { text: "Pick the worst one and quit", correct: false },
        { text: "Tweak the colors/fonts, or re-describe and generate again", correct: true },
        { text: "Delete your business idea", correct: false },
        { text: "Wait for Canva to guess your mind", correct: false }
      ],
      correctMsg: "Right! Tweak or regenerate — that's exactly how designers work with AI.",
      wrongMsg: "Don't settle! Tweak the fonts and colors, or write a new description and generate again until it feels right."
    },
    {
      type: "mc",
      question: "Which is a smart use of AI-made designs for YOUR business?",
      hint: "AI should help you build something original.",
      options: [
        { text: "Copy someone else's exact logo", correct: false },
        { text: "Use AI to build your own original design, then make it uniquely yours", correct: true },
        { text: "Never design anything yourself", correct: false },
        { text: "Use a random image with no connection to your business", correct: false }
      ],
      correctMsg: "Yes! AI helps you build — but it should still feel like YOUR brand.",
      wrongMsg: "Use AI as a starting point, then customize it so the design truly reflects your own business and style."
    },
    {
      type: "mc",
      question: "True or False: You should always describe your business clearly before asking Canva AI to design something.",
      hint: "Clear input = clear output.",
      options: [
        { text: "True", correct: true },
        { text: "False", correct: false },
        { text: "Only sometimes", correct: false },
        { text: "Never — Canva can read your mind", correct: false }
      ],
      correctMsg: "Exactly! Clear descriptions = designs that actually match your business.",
      wrongMsg: "Always describe your business clearly first — vague requests get generic, unhelpful designs."
    }
  ],
  badges: [
    { icon: "bulb", name: "Design Starter", earned: true },
    { icon: "star", name: "Canva Curious", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Design Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Logo Legend", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
