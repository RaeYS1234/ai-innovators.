<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Money Math Challenge | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "money-math-challenge",
  courseUrl: "course-money-math.html",
  tag: "🏆 FINAL CHALLENGE",
  title: "Money Math Challenge",
  subtitle: "The Boss Battle! Prove you're a money master.",
  steps: [
    {
      type: "mc",
      question: "What is money for?",
      hint: "Basics!",
      options: [
        { text: "Buying and selling", correct: true },
        { text: "Eating", correct: false },
        { text: "Sleeping", correct: false },
        { text: "Nothing", correct: false }
      ],
      correctMsg: "Right! Money = a tool for trading.",
      wrongMsg: "Money is for buying and selling stuff."
    },
    {
      type: "mc",
      question: "You earn $9 mowing a lawn and $5 walking a dog. Total?",
      hint: "$9 + $5",
      options: [
        { text: "$4", correct: false },
        { text: "$9", correct: false },
        { text: "$14", correct: true },
        { text: "$95", correct: false }
      ],
      correctMsg: "Perfect! $9 + $5 = $14 total.",
      wrongMsg: "Add them: $9 + $5 = $14."
    },
    {
      type: "mc",
      question: "Rule for smart spending?",
      hint: "One thing before the other.",
      options: [
        { text: "Wants before needs", correct: false },
        { text: "Needs before wants", correct: true },
        { text: "Spend it all", correct: false },
        { text: "Never spend", correct: false }
      ],
      correctMsg: "Yes! Needs first, then wants.",
      wrongMsg: "NEEDS come first (food, shelter). Then wants (fun stuff)."
    },
    {
      type: "mc",
      question: "The 'Pay Yourself First' rule means:",
      hint: "Where does saved money go?",
      options: [
        { text: "Spend all, save what's left", correct: false },
        { text: "Save some FIRST, then spend the rest", correct: true },
        { text: "Never save", correct: false },
        { text: "Save 100% always", correct: false }
      ],
      correctMsg: "Yes! Save first = automatic savings.",
      wrongMsg: "Save FIRST, spend the rest. That way you never forget to save."
    },
    {
      type: "mc",
      question: "You want a $75 skateboard. You save $15/week. How many weeks?",
      hint: "$75 ÷ $15 = ?",
      options: [
        { text: "3 weeks", correct: false },
        { text: "5 weeks", correct: true },
        { text: "15 weeks", correct: false },
        { text: "75 weeks", correct: false }
      ],
      correctMsg: "🎯 $75 ÷ $15 = 5 weeks. Skateboard incoming!",
      wrongMsg: "$75 goal ÷ $15/week = 5 weeks to save up."
    },
    {
      type: "mc",
      question: "You earn $40. Which is the SMARTEST plan?",
      hint: "Balance saving + smart spending.",
      options: [
        { text: "Spend all $40 on candy", correct: false },
        { text: "Save $10, buy needed lunch $10, keep $20 for a want", correct: true },
        { text: "Give it all to your dog", correct: false },
        { text: "Hide it and forget about it", correct: false }
      ],
      correctMsg: "🏆 GENIUS! Save + Need + Want. That's the pro balance.",
      wrongMsg: "Smart plan = save some ($10), cover needs ($10), leave room for wants ($20)."
    },
    {
      type: "mc",
      question: "You have $50. You save 20% ($10). How much left for spending?",
      hint: "$50 - $10 = ?",
      options: [
        { text: "$10", correct: false },
        { text: "$20", correct: false },
        { text: "$40", correct: true },
        { text: "$50", correct: false }
      ],
      correctMsg: "🎯 Correct! $50 - $10 saved = $40 to spend.",
      wrongMsg: "$50 - $10 you saved = $40 left to spend."
    }
  ],
  badges: [
    { icon: "money", name: "Course Complete", earned: true },
    { icon: "star", name: "Money Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Money Master", earned: ({ correct }) => correct >= 5 },
    { icon: "perfect", name: "Perfect Champion", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "Untouchable", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Money Legend", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
