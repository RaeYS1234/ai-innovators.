<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "business-plan-2-3",
  courseUrl: "course-business-plan.html",
  tag: "UNIT 2 · LESSON 2.3",
  title: "The Simple Money Plan",
  subtitle: "Real numbers: what you'll earn, what you'll spend, what you'll keep.",
  steps: [
    {
      type: "teach",
      title: "Revenue, Costs, and Profit",
      body: "The money section of a business plan uses three numbers: <b>Revenue</b> (all the money coming in from sales), <b>Costs</b> (what it costs you to make and run the business), and <b>Profit</b> (Revenue minus Costs — what you actually keep). A real financial projection estimates these numbers before you even start selling.",
      examples: ["Revenue = money coming in", "Costs = money going out", "Profit = Revenue − Costs"]
    },
    {
      type: "teach",
      title: "Projecting Your First Month",
      body: "A financial projection is just an educated guess, written down with real math. If you think you'll sell 20 bracelets at $6 each, your projected revenue is $120. If materials cost $2 per bracelet, your costs are $40. That leaves a projected profit of $80 for the month — before you've sold a single bracelet.",
      examples: []
    },
    {
      type: "math",
      question: "Projected Revenue",
      story: "You plan to sell 15 candles next month at $8 each.",
      equation: "15 × $8 = ?",
      hint: "Multiply the number sold by the price.",
      answer: 120,
      correctMsg: "Perfect! 15 × $8 = $120 in projected revenue.",
      wrongMsg: "Multiply units sold by price to find revenue."
    },
    {
      type: "math",
      question: "Projected Costs",
      story: "Each candle costs you $3 in wax and jars to make. You're making 15 candles.",
      equation: "15 × $3 = ?",
      hint: "Multiply candles made by the cost per candle.",
      answer: 45,
      correctMsg: "Yes! 15 × $3 = $45 in total costs.",
      wrongMsg: "Multiply the number made by the cost each to find total costs."
    },
    {
      type: "math",
      question: "Projected Profit",
      story: "Your projected revenue is $120 and your projected costs are $45.",
      equation: "$120 − $45 = ?",
      hint: "Profit = Revenue − Costs.",
      answer: 75,
      correctMsg: "Exactly! $120 − $45 = $75 profit.",
      wrongMsg: "Subtract costs from revenue to find profit: Revenue − Costs = Profit."
    },
    {
      type: "math",
      question: "Break-Even Check",
      story: "You spend $60 to rent a table at a craft fair. Each bracelet sells for $5 and costs you $1 to make, so you profit $4 per bracelet sold.",
      equation: "$60 ÷ $4 = ?",
      hint: "How many $4 profits does it take to cover $60?",
      answer: 15,
      correctMsg: "Right! You need to sell 15 bracelets to cover your $60 table fee — that's your break-even point.",
      wrongMsg: "Divide the cost by your profit per item to find how many you need to sell to break even."
    }
  ],
  badges: [
    { icon: "money", name: "Money Planner", earned: true },
    { icon: "star", name: "Number Cruncher", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Profit Pro", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Break-Even Boss", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
