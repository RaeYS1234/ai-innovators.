<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Picking Your Name & Voice — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">PRACTICE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Find My Voice!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Voice Found!</h1>
    <p class="complete-subtitle">You can name a business and give it a real personality. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — naming takes a few drafts!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const VOICE_ICON = `<svg viewBox="0 0 64 64"><path d="M16 24 L16 40 L26 40 L38 52 L38 12 L26 24 Z" fill="#22c55e" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/><path d="M44 22 C 50 28 50 36 44 42" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50 16 C 58 24 58 40 50 48" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

runLesson({
  lessonId: "marketing-branding-1-3",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 1 · PRACTICE",
  title: "Picking Your Name & Voice",
  subtitle: "A great name plus the right voice makes your brand unforgettable!",
  steps: [
    {
      type: "vocab",
      word: "Brand Voice",
      pronounce: "say it: brand voys",
      definition: "Your <b>brand voice</b> is the personality behind your words — playful, serious, bold, or friendly. It's how your brand \"talks\" to customers.",
      example: "Duolingo's voice is silly and a little sassy. A law firm's voice is serious and formal. Same goal (getting customers) — totally different voice.",
      icon: VOICE_ICON
    },
    {
      type: "teach",
      title: "Naming Rules That Work",
      body: "Great business names are <b>easy to say and spell</b>, <b>hint at what you do</b>, and <b>aren't already taken</b> by another business. \"Sunny Sips\" tells you it's a drink stand instantly!",
      examples: ["Easy to say/spell", "Hints at what you do", "Not already used"]
    },
    {
      type: "mc",
      question: "Which name is EASIEST for customers to remember and spell?",
      hint: "Simple beats tricky.",
      options: [
        { text: "\"Xzyquorlth Enterprises\"", correct: false },
        { text: "\"Sunny Sips\"", correct: true },
        { text: "\"The Business of Selling Cold Refreshing Beverages LLC\"", correct: false },
        { text: "\"Qw3rty Co\"", correct: false }
      ],
      correctMsg: "Yes! Short, simple, and easy to say and spell.",
      wrongMsg: "A great name is short, simple, and easy for anyone to say and spell."
    },
    {
      type: "mc",
      question: "A silly, joke-cracking pet-sitting business should probably use which brand voice?",
      hint: "Match the voice to the personality.",
      options: [
        { text: "Playful and fun", correct: true },
        { text: "Extremely formal and serious", correct: false },
        { text: "Cold and robotic", correct: false },
        { text: "No voice at all", correct: false }
      ],
      correctMsg: "Right! A playful business should sound playful in its posts and messages too.",
      wrongMsg: "Match your brand voice to your business's real personality — playful business, playful voice."
    },
    {
      type: "mc",
      question: "Why should your brand voice stay THE SAME across posts, emails, and your website?",
      hint: "Think about trust and recognition.",
      options: [
        { text: "So customers recognize and trust you everywhere", correct: true },
        { text: "It doesn't matter if it changes every time", correct: false },
        { text: "Rules require exactly one voice per year", correct: false },
        { text: "So people get confused on purpose", correct: false }
      ],
      correctMsg: "Exactly! A consistent voice builds trust and recognition.",
      wrongMsg: "Keeping your voice consistent helps people recognize and trust your brand everywhere."
    },
    {
      type: "mc",
      question: "FINAL: You're naming a tutoring business for kids who love science. Best pick?",
      hint: "Look for name + hint at what you do.",
      options: [
        { text: "\"Bright Ideas Science Tutoring\"", correct: true },
        { text: "\"Blorp Industries\"", correct: false },
        { text: "\"XYZ 4589\"", correct: false },
        { text: "\"The Thing\"", correct: false }
      ],
      correctMsg: "PERFECT! Clear, easy to say, and it hints exactly what you do.",
      wrongMsg: "The best name is clear, easy to say, and hints at what the business actually does."
    }
  ],
  badges: [
    { icon: "bulb", name: "Namer", earned: true },
    { icon: "star", name: "Voice Finder", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Brand Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "Naming Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
