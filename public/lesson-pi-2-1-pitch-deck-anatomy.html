<script>
const DECK_ICON = `<svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="30" rx="2" fill="white" stroke="#7c3aed" stroke-width="2.5"/><line x1="16" y1="22" x2="40" y2="22" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/><line x1="16" y1="30" x2="48" y2="30" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="36" x2="48" y2="36" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/><rect x="20" y="48" width="24" height="4" rx="2" fill="#7c3aed"/></svg>`;

runLesson({
  lessonId: "pitching-investors-2-1",
  courseUrl: "course-pitching-investors.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "10-Slide Pitch Deck Anatomy",
  subtitle: "The classic structure that most great investor decks follow",
  steps: [
    {
      type: "vocab",
      word: "Pitch Deck",
      pronounce: "say it: PITCH DEK",
      definition: "A <b>pitch deck</b> is a short slide presentation founders use to explain their business to investors.",
      example: "A 10-slide pitch deck covering the problem, solution, market, and team is what most founders bring to investor meetings.",
      icon: DECK_ICON
    },
    {
      type: "teach",
      title: "The Classic 10 Slides",
      body: "A common structure: 1) Problem, 2) Solution, 3) Market size, 4) Product/how it works, 5) Business model, 6) Traction, 7) Competition, 8) Team, 9) Financials/ask, 10) Vision/closing. Not every deck needs all ten in this exact order, but this flow tells a complete, logical story, from \"here's the problem\" to \"here's why we'll win.\"",
      examples: ["Problem → Solution → Market → Product", "Business model → Traction → Competition", "Team → Financials/Ask → Vision"]
    },
    {
      type: "mc",
      question: "What is a \"pitch deck\"?",
      hint: "Think about a slide presentation for investors.",
      options: [
        { text: "A short slide presentation founders use to explain their business to investors", correct: true },
        { text: "A legal contract signed after receiving investment", correct: false },
        { text: "A spreadsheet tracking daily expenses", correct: false },
        { text: "A type of employee training manual", correct: false }
      ],
      correctMsg: "Right! A pitch deck is a slide presentation explaining the business to investors.",
      wrongMsg: "A pitch deck is a short slide presentation founders use to explain their business to investors."
    },
    {
      type: "mc",
      question: "Which slide usually comes FIRST in a classic pitch deck structure?",
      hint: "Think about starting with the reason the business exists.",
      options: [
        { text: "The Problem slide", correct: true },
        { text: "The Financials/Ask slide", correct: false },
        { text: "The Team slide", correct: false },
        { text: "The Closing/Vision slide", correct: false }
      ],
      correctMsg: "Correct! Most decks start by establishing the problem before anything else.",
      wrongMsg: "Most pitch decks start with the Problem slide, before moving to the solution and beyond."
    },
    {
      type: "mc",
      question: "Why does the classic 10-slide order (Problem → Solution → Market → ...) work well?",
      hint: "Think about building a logical story.",
      options: [
        { text: "It tells a complete, logical story from the problem to why the startup will win", correct: true },
        { text: "It's required by law for every investor pitch", correct: false },
        { text: "The order has zero effect on how the pitch is received", correct: false },
        { text: "Randomizing the slide order always works better", correct: false }
      ],
      correctMsg: "Exactly! The order builds a clear, logical narrative for investors to follow.",
      wrongMsg: "This order builds a complete, logical story, from the problem all the way to why the startup will succeed."
    }
  ],
  badges: [
    { icon: "bulb", name: "Deck Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Structure Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Deck Anatomy Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
