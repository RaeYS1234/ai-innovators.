<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who are Customers? — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const PEOPLE_ICON = `<svg viewBox="0 0 64 64"><circle cx="22" cy="22" r="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="2.5"/><path d="M 10 50 C 10 40 16 34 22 34 C 28 34 34 40 34 50 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="2.5"/><circle cx="42" cy="22" r="8" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/><path d="M 30 50 C 30 40 36 34 42 34 C 48 34 54 40 54 50 Z" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/></svg>`;

runLesson({
  lessonId: "business-101-3-1",
  tag: "UNIT 3 · LESSON 3.1",
  title: "Who are Customers?",
  subtitle: "Without customers, no business! Let's learn how to find the right ones.",
  steps: [
    {
      type: "vocab",
      word: "Customer",
      pronounce: "say it: KUS-tuh-mer",
      definition: "A <b>customer</b> is a person who buys from your business. Smart entrepreneurs know exactly WHO their customers are.",
      example: "If you sell dog treats, your customers are <b>people who own dogs</b>!",
      icon: PEOPLE_ICON
    },
    {
      type: "teach",
      title: "Different Businesses, Different Customers",
      body: "Every business has a <b>specific kind</b> of customer. A toy store's customers are kids and parents. A pet shop's customers are pet owners. Knowing your customer helps you sell MORE!",
      examples: ["Game store → Gamers", "Pet shop → Pet owners", "Bookstore → Readers"]
    },
    {
      type: "mc",
      question: "Who are the customers of an ice cream shop?",
      hint: "Who walks in and buys ice cream?",
      options: [
        { text: "People who want a cold treat", correct: true },
        { text: "Cars", correct: false },
        { text: "Cats", correct: false },
        { text: "People who hate sweets", correct: false }
      ],
      correctMsg: "Yes! Customers = people who want what you sell.",
      wrongMsg: "Customers are PEOPLE who want what you sell. Ice cream shops sell to people who like cold treats!"
    },
    {
      type: "mc",
      question: "Why is it important to know your customer?",
      hint: "Think about what customers WANT.",
      options: [
        { text: "So you can sell what they actually want", correct: true },
        { text: "So you can ignore them", correct: false },
        { text: "It doesn't matter", correct: false },
        { text: "So you charge them extra", correct: false }
      ],
      correctMsg: "Right! When you know your customer, you can give them exactly what they want.",
      wrongMsg: "Knowing your customer = giving them what they actually want = MORE sales!"
    },
    {
      type: "mc",
      question: "You're starting a business making slime. Who's your perfect customer?",
      hint: "Think about who LOVES slime.",
      options: [
        { text: "Babies", correct: false },
        { text: "Older adults", correct: false },
        { text: "Kids who love sensory toys", correct: true },
        { text: "Dogs", correct: false }
      ],
      correctMsg: "Yes! Slime is HUGE with kids. They're your perfect customer!",
      wrongMsg: "Slime is most popular with KIDS who love squishy, fun stuff. They're your customer!"
    }
  ],
  badges: [
    { icon: "starter", name: "Customer Aware", earned: true },
    { icon: "star", name: "People Person", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Customer Pro", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Customer King", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
