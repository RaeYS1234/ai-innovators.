<body>
<div class="app">

    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>

    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>

      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>

    <div class="mascot" id="gameoverMascot"></div>

</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>

<script src="lesson-engine.js"></script>
<script>
const PIVOT_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#14b8a6" stroke="#0f766e" stroke-width="2.5"/><path d="M20 24 A14 14 0 1 1 20 40" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M14 20 L20 24 L24 18 Z" fill="white"/></svg>`;

runLesson({
  lessonId: "startup-fundamentals-2-4",
  courseUrl: "course-startup-fundamentals.html",
  tag: "UNIT 2 · LESSON 2.4",
  title: "Iteration & Pivots",
  subtitle: "What to do when your first idea isn't quite working",
  steps: [
    {
      type: "vocab",
      word: "Pivot",
      pronounce: "say it: PIH-vut",
      definition: "A <b>pivot</b> is a major change in direction for a startup — keeping some of what you learned while changing the core product, market, or strategy.",
      example: "A company that started as a photo-sharing app noticed users loved its messaging feature more — so it pivoted to become a messaging app.",
      icon: PIVOT_ICON
    },
    {
      type: "teach",
      title: "Iteration vs Pivoting",
      body: "<b>Iteration</b> means making small improvements based on feedback — same core idea, better execution. A <b>pivot</b> is bigger — changing direction because what you're doing isn't working, but you keep valuable lessons learned along the way. Both are normal, healthy parts of building a startup, not signs of failure.",
      examples: ["Iteration: small tweaks, same direction", "Pivot: bigger change in direction"]
    },
    {
      type: "mc",
      question: "What is a \"pivot\"?",
      hint: "Bigger than a small tweak.",
      options: [
        { text: "A major change in direction while keeping lessons learned", correct: true },
        { text: "Giving up on the company completely", correct: false },
        { text: "A tiny bug fix", correct: false },
        { text: "Hiring a new employee", correct: false }
      ],
      correctMsg: "Right! A pivot is a significant strategic change, not quitting.",
      wrongMsg: "A pivot is a major direction change — different from quitting or a tiny fix."
    },
    {
      type: "mc",
      question: "How is iteration DIFFERENT from a pivot?",
      hint: "Think about the size of the change.",
      options: [
        { text: "Iteration is small improvements; a pivot is a bigger directional change", correct: true },
        { text: "They mean exactly the same thing", correct: false },
        { text: "Iteration always means shutting the company down", correct: false },
        { text: "A pivot never involves any learning", correct: false }
      ],
      correctMsg: "Yes! Iteration = small tweaks. Pivot = bigger strategic shift.",
      wrongMsg: "Iteration involves small improvements, while a pivot is a larger change in direction."
    },
    {
      type: "mc",
      question: "A startup notices users love one small feature way more than the main product. What's a smart move?",
      hint: "Follow the real signal from users.",
      options: [
        { text: "Seriously consider pivoting toward that popular feature", correct: true },
        { text: "Ignore users and keep pushing the unpopular main feature", correct: false },
        { text: "Shut down the company immediately", correct: false },
        { text: "Remove the popular feature since it wasn't the original plan", correct: false }
      ],
      correctMsg: "Correct! Following strong user signals toward what they actually love is a classic smart pivot.",
      wrongMsg: "When users clearly gravitate toward one feature, that's a strong signal worth considering as a pivot."
    },
    {
      type: "mc",
      question: "Why are pivots considered a NORMAL part of building a startup, not a failure?",
      hint: "Think about what you keep, not just what you lose.",
      options: [
        { text: "You keep valuable lessons and skills even while changing direction", correct: true },
        { text: "Pivots always mean the founder quits entirely", correct: false },
        { text: "Pivots are illegal so they never really happen", correct: false },
        { text: "Nothing learned before a pivot is ever useful again", correct: false }
      ],
      correctMsg: "Exactly! Pivots build on what you've already learned, they don't erase it.",
      wrongMsg: "Pivots are normal because founders carry forward real lessons even as the direction changes."
    }
  ],
  badges: [
    { icon: "bulb", name: "Pivot Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Iteration Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Pivot Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
