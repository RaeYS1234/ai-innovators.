<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Building Your First Pitch Challenge | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "first-pitch-challenge",
  courseUrl: "course-first-pitch.html",
  tag: "FINAL CHALLENGE",
  title: "Building Your First Pitch Challenge",
  subtitle: "Real scenarios, real pitch decisions. Show what a founder-in-training really knows.",
  steps: [
    {
      type: "mc",
      question: "You're pitching a school-supply subscription box. Which slide order is correct?",
      hint: "Problem always earns attention first.",
      options: [
        { text: "Solution, Problem, Ask, Team, Market", correct: false },
        { text: "Problem, Solution, Market, Traction, Ask", correct: true },
        { text: "Ask, Team, Problem, Solution, Market", correct: false },
        { text: "Team, Ask, Problem, Market, Solution", correct: false }
      ],
      correctMsg: "Right! Problem, Solution, Market, Traction, Ask, the order that earns trust step by step.",
      wrongMsg: "The correct order is Problem, Solution, Market, Traction, Ask, each part earns the right to move to the next."
    },
    {
      type: "mc",
      question: "Which problem statement is sharp enough to use in a real pitch?",
      hint: "Look for a specific person and a specific, measurable pain.",
      options: [
        { text: "Homework is hard sometimes.", correct: false },
        { text: "Middle schoolers spend 45+ minutes a night re-writing messy notes because their handwriting is hard to read later.", correct: true },
        { text: "School could be more fun.", correct: false },
        { text: "Everyone has problems.", correct: false }
      ],
      correctMsg: "Yes! It names a specific group, a specific pain, and a measurable cost (45+ minutes a night).",
      wrongMsg: "A sharp problem statement names WHO struggles, WHAT exactly they struggle with, and roughly how much it costs them, vague statements could describe any business."
    },
    {
      type: "mc",
      question: "Your note-taking app's UVP should explain:",
      hint: "It's about being better than the alternative, not just existing.",
      options: [
        { text: "Why your app is the better choice compared to the alternatives, like rewriting notes by hand", correct: true },
        { text: "Your favorite school subject", correct: false },
        { text: "How many hours you spent coding it", correct: false },
        { text: "The exact date you plan to launch", correct: false }
      ],
      correctMsg: "Correct! A UVP is about the specific advantage over real alternatives.",
      wrongMsg: "A UVP explains why your solution is the BETTER choice over real alternatives, like rewriting notes by hand, not unrelated facts about you."
    },
    {
      type: "mc",
      question: "A judge asks 'what's your traction so far?' Which answer is strongest?",
      hint: "Traction is proof, not a hope.",
      options: [
        { text: "We think a lot of people will probably want this eventually.", correct: false },
        { text: "40 classmates have used the beta for two weeks, and 30 of them used it again the next day.", correct: true },
        { text: "We haven't tested it with anyone yet, but the idea is really good.", correct: false },
        { text: "Our slides look really professional.", correct: false }
      ],
      correctMsg: "Yes! Real numbers, users, repeat usage, is exactly what traction means.",
      wrongMsg: "Traction is real evidence: specific users, specific repeat usage. 'We think people will want this' or nice-looking slides are not traction."
    },
    {
      type: "mc",
      question: "You get a Q&A question you genuinely don't know the answer to. What's the strongest response?",
      hint: "Honesty beats a risky guess.",
      options: [
        { text: "Make up a number that sounds confident", correct: false },
        { text: "Say it's a great question, share what you DO know, and be upfront about the gap", correct: true },
        { text: "Change the subject completely", correct: false },
        { text: "Get flustered and stop talking", correct: false }
      ],
      correctMsg: "Right! Honest gaps build more trust than confident wrong answers.",
      wrongMsg: "The strongest move is acknowledging the question, sharing what you do know, and being honest about what you don't, guessing and getting caught is worse."
    },
    {
      type: "mc",
      question: "Why should you practice your pitch OUT LOUD, not just in your head?",
      hint: "Silent rehearsal hides certain problems.",
      options: [
        { text: "It doesn't actually matter which way you practice", correct: false },
        { text: "Saying it out loud reveals awkward phrasing and pacing issues silent practice hides", correct: true },
        { text: "It makes your voice louder in real life", correct: false },
        { text: "It's required by every pitch competition", correct: false }
      ],
      correctMsg: "Yes! Out-loud practice catches problems that feel fine in your head but don't work spoken.",
      wrongMsg: "Practicing out loud reveals real issues, awkward wording, rushed pacing, that silent, in-your-head rehearsal never catches."
    },
    {
      type: "mc",
      question: "Ryan Kaji's story (Ryan's World) mainly teaches founders-in-training that:",
      hint: "He never gave a formal investor pitch, what did his audience prove instead?",
      options: [
        { text: "You need a fancy slide deck before anyone will believe you", correct: false },
        { text: "Real audience demand, even without a formal pitch, is powerful traction that can build a massive business", correct: true },
        { text: "Only adults can build successful businesses", correct: false },
        { text: "Traction doesn't matter if the idea is good enough", correct: false }
      ],
      correctMsg: "Exactly! His huge, engaged audience WAS the traction, proof of demand that grew into a $50M+ empire, no formal pitch deck required.",
      wrongMsg: "Ryan Kaji's channel shows that real, proven audience demand is powerful traction on its own, his views and engagement built a $50M+ empire without ever giving a formal investor pitch."
    }
  ],
  badges: [
    { icon: "trophy", name: "Challenge Complete", earned: true },
    { icon: "star", name: "Sharp Pitcher", earned: ({ correct }) => correct >= 3 },
    { icon: "brain", name: "Pitch Genius", earned: ({ correct }) => correct >= 5 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "First Pitch Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
