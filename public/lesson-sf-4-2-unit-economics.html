<script>
runLesson({
  lessonId: "startup-fundamentals-4-2",
  courseUrl: "course-startup-fundamentals.html",
  tag: "UNIT 4 · PRACTICE",
  title: "Unit Economics",
  subtitle: "Practice the numbers that tell you if a startup can actually make money",
  steps: [
    {
      type: "teach",
      title: "CAC and LTV, The Two Numbers That Matter Most",
      body: "<b>CAC (Customer Acquisition Cost)</b> is how much it costs to get ONE new customer. <b>LTV (Lifetime Value)</b> is how much money that customer will spend with you over time. A healthy startup needs LTV to be much bigger than CAC, a common rule of thumb is LTV should be at least 3 times CAC.",
      examples: ["CAC: cost to gain 1 customer", "LTV: total value of 1 customer over time", "Goal: LTV should be 3x CAC or more"]
    },
    {
      type: "math",
      question: "A startup spends $500 on ads and gains 25 new customers. What is the CAC (cost per customer)?",
      hint: "Divide total spend by number of customers gained.",
      story: "Total ad spend: $500. New customers gained: 25.",
      equation: "$500 ÷ 25 = ?",
      answer: 20,
      correctMsg: "Yes! CAC = $20 per customer.",
      wrongMsg: "CAC = total spend ÷ number of customers = $500 ÷ 25."
    },
    {
      type: "math",
      question: "A customer pays $15/month and stays subscribed for 10 months on average. What is their LTV?",
      hint: "Multiply monthly payment by months stayed.",
      story: "Monthly payment: $15. Average months subscribed: 10.",
      equation: "$15 × 10 = ?",
      answer: 150,
      correctMsg: "Correct! LTV = $150.",
      wrongMsg: "LTV = monthly payment × months subscribed = $15 × 10."
    },
    {
      type: "math",
      question: "If CAC is $40 and LTV is $200, what is the LTV-to-CAC ratio?",
      hint: "Divide LTV by CAC.",
      story: "LTV: $200. CAC: $40.",
      equation: "$200 ÷ $40 = ?",
      answer: 5,
      correctMsg: "Great! An LTV:CAC ratio of 5 is very healthy (above the 3x rule of thumb).",
      wrongMsg: "LTV ÷ CAC = $200 ÷ $40 = 5."
    },
    {
      type: "math",
      question: "A startup spends $1,200 total on marketing and gains 40 new customers. What is the CAC?",
      hint: "Divide total spend by number of customers.",
      story: "Total marketing spend: $1,200. New customers gained: 40.",
      equation: "$1,200 ÷ 40 = ?",
      answer: 30,
      correctMsg: "Right! CAC = $30 per customer.",
      wrongMsg: "CAC = total spend ÷ number of customers = $1,200 ÷ 40."
    },
    {
      type: "mc",
      question: "A startup's CAC is $50 and LTV is $60. What should the founder be concerned about?",
      hint: "Compare LTV to the 3x CAC rule of thumb.",
      options: [
        { text: "LTV is barely bigger than CAC, the business may not be very profitable per customer", correct: true },
        { text: "Nothing, any LTV bigger than CAC at all is considered excellent", correct: false },
        { text: "The numbers are too small to ever matter", correct: false },
        { text: "CAC should always be bigger than LTV", correct: false }
      ],
      correctMsg: "Exactly! A healthy startup usually wants LTV to be around 3x CAC or more, not barely above it.",
      wrongMsg: "When LTV is only slightly bigger than CAC, there's little room for profit, most founders aim for LTV near 3x CAC."
    }
  ],
  badges: [

    { icon: "brain", name: "Numbers Smart", earned: ({ correct }) => correct >= 4 },
