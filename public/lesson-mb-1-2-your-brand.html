      <span id="heartsCount">3</span>

  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>

  </div>

<script src="lesson-engine.js"></script>
<script>
const BRAND_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="25" r="19" fill="#a855f7" stroke="#7e22ce" stroke-width="2.5"/><path d="M21 40 L16 58 L32 49 L48 58 L43 40 Z" fill="#a855f7" stroke="#7e22ce" stroke-width="2.5" stroke-linejoin="round"/><text x="32" y="32" font-size="20" fill="white" text-anchor="middle" font-weight="900" font-family="sans-serif">★</text></svg>`;

runLesson({
  lessonId: "marketing-branding-1-2",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 1 · LESSON 1.2",
  title: "What is a Brand?",
  subtitle: "Discover the secret behind logos you already know!",
  steps: [
    {
      type: "vocab",
      word: "Brand",
      pronounce: "say it: BRAND",
      definition: "A <b>brand</b> is the way people <b>see and feel</b> about your business — your name, colors, and personality all mixed together!",
      example: "When you see Nike's swoosh, you instantly think 'sports and speed' — that's the power of a brand!",
      icon: BRAND_ICON
    },
    {
      type: "teach",
      title: "Your Brand is Your Personality",
      body: "Big companies like Apple, Nike, and McDonald's all have a brand — a special look and feeling that makes them easy to recognize anywhere. Apple feels sleek and simple. McDonald's feels fun and fast. What does YOUR business feel like?",
      examples: ["Nike swoosh", "Apple logo", "McDonald's arches", "Coca-Cola red"]
    },
    {
      type: "mc",
      question: "What is a \"brand\"?",
      hint: "Think about feelings, not prices.",
      options: [
        { text: "The way people see and feel about your business", correct: true },
        { text: "Just your product's price", correct: false },
        { text: "Your home address", correct: false },
        { text: "A kind of food", correct: false }
      ],
      correctMsg: "Boom! A brand is your business's whole personality.",
      wrongMsg: "A brand isn't the price — it's how people SEE and FEEL about your business."
    },
    {
      type: "mc",
      question: "When you see the golden arches, which business do you think of?",
      hint: "Fast food, fun, and fries.",
      options: [
        { text: "McDonald's", correct: true },
        { text: "Nike", correct: false },
        { text: "Apple", correct: false },
        { text: "Coca-Cola", correct: false }
      ],
      correctMsg: "You got it! Those golden arches are McDonald's brand.",
      wrongMsg: "The golden arches are McDonald's famous symbol."
    },
    {
      type: "mc",
      question: "Why do businesses want a STRONG brand?",
      hint: "Think about how customers come back.",
      options: [
        { text: "So people remember and trust them", correct: true },
        { text: "So nobody notices them", correct: false },
        { text: "So they can change their name every day", correct: false },
        { text: "It doesn't matter at all", correct: false }
      ],
      correctMsg: "Yes! A strong brand helps people remember and trust you.",
      wrongMsg: "A strong brand helps customers remember you and trust you again and again."
    },
    {
      type: "mc",
      question: "Which of these is part of your brand?",
      hint: "Think about what makes you, you.",
      options: [
        { text: "Your colors, name, and style", correct: true },
        { text: "Only your bank account", correct: false },
        { text: "The weather", correct: false },
        { text: "Your favorite food", correct: false }
      ],
      correctMsg: "Exactly! Colors, name, and style all build your brand.",
      wrongMsg: "Your brand is built from things like your name, colors, and style."
    }
  ],
  badges: [
    { icon: "bulb", name: "Brand Builder", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Brand Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "Brand Boss", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
