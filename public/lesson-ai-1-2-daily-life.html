<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI in Your Daily Life | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">You're an AI spotter now! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const EYE_ICON = `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="32" rx="26" ry="16" fill="white" stroke="#0c1e3e" stroke-width="3"/><circle cx="32" cy="32" r="10" fill="#0ea5e9"/><circle cx="32" cy="32" r="5" fill="#0c1e3e"/><circle cx="34" cy="30" r="2" fill="white"/></svg>`;

runLesson({
  lessonId: "what-is-ai-1-2",
  courseUrl: "course-what-is-ai.html",
  tag: "UNIT 1 · LESSON 1.2",
  title: "AI in Your Daily Life",
  subtitle: "Nova here! Bet you use AI more than you think. Let's count the ways!",
  steps: [
    {
      type: "teach",
      title: "AI is EVERYWHERE",
      body: "You probably use AI <b>at least 10 times a day</b> without even noticing. It's hiding in your phone, apps, games, and TV. Let's find it!",
      icon: EYE_ICON
    },
    {
      type: "teach",
      title: "YouTube & TikTok",
      body: "Ever notice how YouTube knows EXACTLY what video you'll like next? That's <b>AI watching what you watch</b> and picking videos similar to ones you enjoyed.",
      examples: ["Watch one cat video", "AI shows 50 more", "Suddenly you're a cat expert"]
    },
    {
      type: "teach",
      title: "Voice Assistants",
      body: "When you say \"Hey Siri\" or \"Alexa, play music\", that's AI <b>listening to your voice, understanding your words</b>, and responding back. Wild, right?",
      examples: ["Siri (Apple)", "Alexa (Amazon)", "Google Assistant"]
    },
    {
      type: "teach",
      title: "Snapchat & Instagram Filters",
      body: "Those dog-ear filters? Sparkles around your face? AI is <b>finding your face in the camera</b>, mapping it, and putting cool stuff on it in real time!",
      examples: ["Face detection", "Background blur", "Funny animal ears"]
    },
    {
      type: "mc",
      question: "Which of these uses AI?",
      hint: "Think about it, does it learn or predict things?",
      options: [
        { text: "YouTube recommendations", correct: true },
        { text: "A regular calculator", correct: false },
        { text: "A book", correct: false },
        { text: "A door", correct: false }
      ],
      correctMsg: "Yes! YouTube uses AI to predict what you'll watch next.",
      wrongMsg: "YouTube uses AI to RECOMMEND videos. Calculators, books, and doors don't learn anything!"
    },
    {
      type: "mc",
      question: "How does Siri understand what you say?",
      hint: "Think about how AI learns.",
      options: [
        { text: "It's magic", correct: false },
        { text: "AI listened to millions of people talk and learned", correct: true },
        { text: "A tiny person inside the phone", correct: false },
        { text: "It guesses randomly", correct: false }
      ],
      correctMsg: "Right! Siri's AI trained on millions of voices to understand speech.",
      wrongMsg: "Siri uses AI that learned from MILLIONS of voice recordings. No magic, just lots of training!"
    },
    {
      type: "mc",
      question: "Spotify and Apple Music suggest songs you might like. How?",
      hint: "Same idea as YouTube!",
      options: [
        { text: "They just play random songs", correct: false },
        { text: "AI looks at what you listened to and finds similar songs", correct: true },
        { text: "An artist picks for you personally", correct: false },
        { text: "It's totally a guess", correct: false }
      ],
      correctMsg: "Yes! AI studies your music taste and finds songs you'll probably love.",
      wrongMsg: "Music apps use AI to LEARN what you like and suggest similar songs."
    },
    {
      type: "mc",
      question: "FINAL: About how many times a day do most people use AI?",
      hint: "More than you'd think!",
      options: [
        { text: "0 times, only scientists use AI", correct: false },
        { text: "Maybe 1 time", correct: false },
        { text: "10+ times without even realizing it", correct: true },
        { text: "Once a year", correct: false }
      ],
      correctMsg: "EXACTLY! AI is woven into your daily life. You just learned to SEE it!",
      wrongMsg: "Most people use AI 10+ times a day! Every app, recommendation, and voice assistant is AI in action."
    }
  ],
  badges: [
    { icon: "brain", name: "AI Spotter", earned: true },
    { icon: "star", name: "Quick Eye", earned: ({ correct }) => correct >= 2 },
    { icon: "bulb", name: "Daily Detective", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "AI Watcher", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
