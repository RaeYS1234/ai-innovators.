<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brand Builder Challenge — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">🏆 FINAL CHALLENGE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Course Complete!</h1>
    <p class="complete-subtitle">You're officially a Brand Builder. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "marketing-branding-challenge",
  courseUrl: "course-marketing-branding.html",
  tag: "🏆 FINAL CHALLENGE",
  title: "Brand Builder Challenge",
  subtitle: "The boss battle! Prove you can build and market a real brand.",
  steps: [
    { type: "mc", question: "What is marketing?", hint: "Think reaching customers.",
      options: [
        { text: "Reaching and connecting with the people who'd want your product", correct: true },
        { text: "Only making the product itself", correct: false },
        { text: "Filing paperwork", correct: false },
        { text: "Counting money", correct: false }
      ],
      correctMsg: "Right! Marketing is about reaching your customers.",
      wrongMsg: "Marketing means reaching and connecting with people who'd want what you offer." },
    { type: "mc", question: "What is a brand?", hint: "Think feelings, not prices.",
      options: [
        { text: "The way people see and feel about your business", correct: true },
        { text: "Just your product's price", correct: false },
        { text: "Your home address", correct: false },
        { text: "A kind of food", correct: false }
      ],
      correctMsg: "Yes! A brand is your business's whole personality.",
      wrongMsg: "A brand isn't the price — it's how people SEE and FEEL about your business." },
    { type: "mc", question: "What makes a name easy to build a brand around?", hint: "Simple, clear, unique.",
      options: [
        { text: "Easy to say and spell, hints at what you do", correct: true },
        { text: "As long and complicated as possible", correct: false },
        { text: "Copied exactly from another business", correct: false },
        { text: "Random letters and numbers", correct: false }
      ],
      correctMsg: "Right! Simple, clear names build brands fastest.",
      wrongMsg: "A great name is easy to say, easy to spell, and hints at what the business does." },
    { type: "mc", question: "Why should your logo, colors, and fonts stay the SAME everywhere?", hint: "Think recognition.",
      options: [
        { text: "So people instantly recognize your brand anywhere", correct: true },
        { text: "It doesn't matter if it's different everywhere", correct: false },
        { text: "Rules require only one color total", correct: false },
        { text: "To confuse customers on purpose", correct: false }
      ],
      correctMsg: "Yes! Consistency builds instant recognition.",
      wrongMsg: "A consistent visual identity is what makes a brand instantly recognizable." },
    { type: "mc", question: "What does \"engagement\" mean on social media?", hint: "Likes, comments, shares.",
      options: [
        { text: "People liking, commenting, and reacting to your posts", correct: true },
        { text: "How many followers you started with", correct: false },
        { text: "The price of your product", correct: false },
        { text: "How long a video is", correct: false }
      ],
      correctMsg: "Right! Engagement shows real attention.",
      wrongMsg: "Engagement is likes, comments, and shares — real signs people are paying attention." },
    { type: "mc", question: "Why is word-of-mouth so powerful?", hint: "Think trust.",
      options: [
        { text: "A friend's honest recommendation feels more trustworthy than an ad", correct: true },
        { text: "It's the same as an expensive ad", correct: false },
        { text: "It never actually works", correct: false },
        { text: "It costs more money than TV ads", correct: false }
      ],
      correctMsg: "🎯 Yes! Trust is why word-of-mouth works so well.",
      wrongMsg: "Word-of-mouth works because friends' recommendations feel honest and unbiased." },
    { type: "mc", question: "What are the 4 parts of a real marketing campaign?", hint: "Goal, who, what, where.",
      options: [
        { text: "Goal, audience, message, and channel", correct: true },
        { text: "Just a logo and nothing else", correct: false },
        { text: "Only a price tag", correct: false },
        { text: "A random guess with no plan", correct: false }
      ],
      correctMsg: "🎯 Yes! Goal, audience, message, channel — all 4 pieces matter.",
      wrongMsg: "A real campaign needs a goal, an audience, a message, and a channel." },
    { type: "mc", question: "What's the smartest way to write a hook for a video?", hint: "Grab attention fast.",
      options: [
        { text: "Make it exciting and specific so people want to keep watching", correct: true },
        { text: "Start slow with no clear point", correct: false },
        { text: "Say nothing for the first 30 seconds", correct: false },
        { text: "Use the most boring line possible", correct: false }
      ],
      correctMsg: "PERFECT! A strong hook is exciting, specific, and grabs attention fast.",
      wrongMsg: "The best hooks are exciting and specific — they stop people from scrolling away." }
  ],
  badges: [
    { icon: "star", name: "Course Complete", earned: true },
    { icon: "bulb", name: "Brand Thinker", earned: ({ correct }) => correct >= 4 },
    { icon: "brain", name: "Marketing Smart", earned: ({ correct }) => correct >= 6 },
    { icon: "perfect", name: "Perfect Champion", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "Untouchable", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "Brand Builder", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
