<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 Check | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">QUIZ</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Take the Quiz!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Quiz Complete!</h1>
    <p class="complete-subtitle">Great work on Unit 1! Here's how you did:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "what-is-ai-1-3",
  courseUrl: "course-what-is-ai.html",
  tag: "UNIT 1 · CHECK",
  title: "Unit 1 Quiz",
  subtitle: "Let's see what you remember about AI and where it shows up!",
  steps: [
    {
      type: "mc",
      question: "What is AI short for?",
      options: [
        { text: "Awesome Internet", correct: false },
        { text: "Artificial Intelligence", correct: true },
        { text: "Auto Information", correct: false },
        { text: "Anyone's Idea", correct: false }
      ],
      correctMsg: "Yes! Artificial Intelligence.",
      wrongMsg: "AI stands for ARTIFICIAL INTELLIGENCE."
    },
    {
      type: "mc",
      question: "How does AI learn?",
      options: [
        { text: "It reads one book and memorizes it", correct: false },
        { text: "By looking at lots and lots of examples", correct: true },
        { text: "By guessing", correct: false },
        { text: "Magic", correct: false }
      ],
      correctMsg: "Right! AI learns by studying tons of examples.",
      wrongMsg: "AI learns from millions of EXAMPLES. The more it sees, the smarter it gets!"
    },
    {
      type: "mc",
      question: "Which of these is NOT AI?",
      options: [
        { text: "Siri voice assistant", correct: false },
        { text: "YouTube recommendations", correct: false },
        { text: "A regular flashlight", correct: true },
        { text: "Snapchat filters", correct: false }
      ],
      correctMsg: "Yes! A flashlight is just on or off, no learning needed.",
      wrongMsg: "Flashlights don't learn or predict, they just turn on and off!"
    },
    {
      type: "mc",
      question: "Is AI magic?",
      options: [
        { text: "Yes, totally magic", correct: false },
        { text: "No, it's software that learned from examples", correct: true },
        { text: "Kinda magic", correct: false },
        { text: "Only on Wednesdays", correct: false }
      ],
      correctMsg: "Exactly! AI is just smart software, no magic involved.",
      wrongMsg: "AI is SOFTWARE, it learned from tons of data. Not magic!"
    },
    {
      type: "mc",
      question: "Why does AI matter for kid entrepreneurs?",
      options: [
        { text: "It can help you build and design business stuff faster", correct: true },
        { text: "It's just for grown-ups", correct: false },
        { text: "It doesn't matter at all", correct: false },
        { text: "It only works for scientists", correct: false }
      ],
      correctMsg: "YES! AI is your secret weapon as a young entrepreneur!",
      wrongMsg: "AI helps EVERYONE, including kids, build and design stuff way faster!"
    }
  ],
  badges: [
    { icon: "brain", name: "AI Quiz Taker", earned: true },
    { icon: "star", name: "Knowledge Seeker", earned: ({ correct }) => correct >= 1 },
    { icon: "bulb", name: "Sharp Thinker", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Unit 1 Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
