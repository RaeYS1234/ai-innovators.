<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const STORY_ICON = `<svg viewBox="0 0 64 64"><path d="M8 44 L20 30 L30 38 L44 18 L58 30" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="18" r="4" fill="#059669"/></svg>`;

runLesson({
  lessonId: "pitching-investors-2-2",
  courseUrl: "course-pitching-investors.html",
  tag: "UNIT 2 · LESSON 2.2",
  title: "Telling a Story With Data",
  subtitle: "Numbers alone don't persuade, the story around them does",
  steps: [
    {
      type: "teach",
      title: "Data Needs a Narrative",
      body: "A slide full of numbers with no context is forgettable. Great pitches wrap data in a story: what the number MEANS, why it MATTERS, and where it's HEADED. Instead of \"Revenue: $50K,\" try \"We hit $50K in revenue in just 3 months, growing 20% month over month, and we're only in one city so far.\" The second version tells investors a story of momentum, not just a static fact.",
      examples: ["Bad: \"Revenue: $50K\"", "Better: \"$50K in 3 months, growing 20%/month, in just one city\"", "Numbers + context + trajectory = a story"]
    },
    {
      type: "mc",
      question: "Why is a bare number like \"Revenue: $50K\" often weak on a pitch slide?",
      hint: "Think about missing context.",
      options: [
        { text: "It lacks context about growth, timeframe, or what it means for the future", correct: true },
        { text: "$50K is always too small a number to ever matter", correct: false },
        { text: "Investors are not allowed to see revenue numbers", correct: false },
        { text: "Numbers should never appear on any slide", correct: false }
      ],
      correctMsg: "Right! Without context, a number doesn't tell investors the full story.",
      wrongMsg: "A bare number lacks context, growth rate, timeframe, or trajectory, that makes it meaningful to investors."
    },
    {
      type: "mc",
      question: "Which version of a data point tells a stronger STORY to investors?",
      hint: "Look for growth and context.",
      options: [
        { text: "\"$50K in 3 months, growing 20% month over month, in just one city so far\"", correct: true },
        { text: "\"Revenue: $50K\"", correct: false },
        { text: "\"We made some money.\"", correct: false },
        { text: "\"Numbers are private.\"", correct: false }
      ],
      correctMsg: "Yes! Adding timeframe, growth rate, and untapped potential creates a compelling story.",
      wrongMsg: "The version with timeframe, growth rate, and untapped potential tells a far more compelling story."
    },
    {
      type: "mc",
      question: "What THREE things should good data storytelling include?",
      hint: "Think meaning, importance, and direction.",
      options: [
        { text: "What the number means, why it matters, and where it's headed", correct: true },
        { text: "Only the raw number and nothing else", correct: false },
        { text: "The founder's personal opinion with zero data at all", correct: false },
        { text: "A random unrelated fact about the weather", correct: false }
      ],
      correctMsg: "Correct! Meaning, importance, and trajectory turn a number into a persuasive story.",
      wrongMsg: "Good data storytelling explains what a number means, why it matters, and where it's headed."
    }
  ],
  badges: [
    { icon: "bulb", name: "Storytelling Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Data Story Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Storytelling Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
