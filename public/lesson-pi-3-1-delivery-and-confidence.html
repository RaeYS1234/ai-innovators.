<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Delivery & Confidence — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const CONFIDENCE_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="20" r="10" fill="#fbcfe8" stroke="#db2777" stroke-width="2.5"/><path d="M14 54 C 14 40 22 34 32 34 C 42 34 50 40 50 54 Z" fill="#f472b6" stroke="#db2777" stroke-width="2.5"/><path d="M22 46 Q32 54 42 46" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

runLesson({
  lessonId: "pitching-investors-3-1",
  courseUrl: "course-pitching-investors.html",
  tag: "UNIT 3 · LESSON 3.1",
  title: "Delivery & Confidence",
  subtitle: "How you say it matters almost as much as what you say",
  steps: [
    {
      type: "teach",
      title: "Confidence Is Practiced, Not Innate",
      body: "Great pitch delivery comes from PREPARATION, not natural talent. Know your numbers cold, practice out loud (not just in your head), speak slower than feels natural (nerves speed us up), and make eye contact instead of reading slides word-for-word. Confidence isn't about hiding nerves perfectly — it's about being so prepared that nerves don't throw you off.",
      examples: ["Know your numbers cold", "Practice out loud, many times", "Speak slower than feels natural", "Make eye contact, don't just read slides"]
    },
    {
      type: "mc",
      question: "What is the BEST way to build confidence for a pitch?",
      hint: "Think about preparation, not luck.",
      options: [
        { text: "Thorough preparation and lots of out-loud practice", correct: true },
        { text: "Avoiding any practice so it feels more natural", correct: false },
        { text: "Reading every slide word-for-word from memory", correct: false },
        { text: "Hoping nerves magically disappear on their own", correct: false }
      ],
      correctMsg: "Right! Preparation and practice are what actually build confidence.",
      wrongMsg: "Confidence comes from thorough preparation and lots of out-loud practice, not luck."
    },
    {
      type: "mc",
      question: "Why should presenters speak SLOWER than feels natural during a pitch?",
      hint: "Think about what nerves do to speaking speed.",
      options: [
        { text: "Nerves tend to speed people up, so slowing down helps sound calm and clear", correct: true },
        { text: "Speaking slowly is required by every investor, by law", correct: false },
        { text: "Speaking fast always sounds more confident", correct: false },
        { text: "Slower speech has no effect on how a pitch is received", correct: false }
      ],
      correctMsg: "Correct! Nerves speed people up, so consciously slowing down helps you sound calm and in control.",
      wrongMsg: "Since nerves naturally speed people up, deliberately slowing down helps a presenter sound calmer and clearer."
    },
    {
      type: "mc",
      question: "Why is making eye contact often better than reading slides word-for-word?",
      hint: "Think about connection with the audience.",
      options: [
        { text: "It builds a stronger connection and shows real confidence in the material", correct: true },
        { text: "Eye contact makes slides completely unnecessary", correct: false },
        { text: "Reading slides is always the more professional choice", correct: false },
        { text: "It has no impact on how the audience perceives the pitch", correct: false }
      ],
      correctMsg: "Exactly! Eye contact builds connection and signals genuine command of the material.",
      wrongMsg: "Eye contact builds a stronger connection with investors and shows real confidence in the material."
    }
  ],
  badges: [
    { icon: "bulb", name: "Delivery Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Confidence Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Delivery Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
