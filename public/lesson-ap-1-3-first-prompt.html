<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try Your First Prompt — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">PRACTICE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Try It Out!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">First Prompt Done!</h1>
    <p class="complete-subtitle">You wrote a real AI image prompt like a pro. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — every artist re-does a prompt sometimes!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "ai-pictures-1-3",
  courseUrl: "course-ai-pictures.html",
  tag: "UNIT 1 · PRACTICE",
  title: "Try Your First Prompt",
  subtitle: "Let's put the prompt formula to work — pick the strongest prompt each round!",
  steps: [
    {
      type: "match",
      question: "Round 1: Match the goal to the strong prompt",
      hint: "Look for subject + details + style.",
      pairs: [
        { prompt: "A poster for a dog-walking business", answer: "a happy golden retriever on a leash, sunny park, cheerful cartoon style" },
        { prompt: "A logo for a cookie shop called Sweet Treats", answer: "a round cookie logo with 'Sweet Treats' text, warm brown and cream colors, flat cartoon style" },
        { prompt: "A picture for a book about space", answer: "a rocket flying past colorful planets, glowing stars, dreamy digital art style" }
      ],
      correctMsg: "Nice matching! You picked the fully-loaded prompts.",
      wrongMsg: "Pick the prompt with subject + details + style, not the vague one."
    },
    {
      type: "mc",
      question: "You typed \"a cat.\" The picture came out blurry and boring. What should you add?",
      hint: "Think formula: subject, details, style.",
      options: [
        { text: "Details and a style, like \"a fluffy orange cat wearing sunglasses, cartoon style\"", correct: true },
        { text: "Type \"a cat\" again exactly", correct: false },
        { text: "Nothing, blurry is fine", correct: false },
        { text: "Just add more exclamation points", correct: false }
      ],
      correctMsg: "Yes! Details + style level up almost any prompt.",
      wrongMsg: "Adding details and a style is the fix for a vague, blurry result."
    },
    {
      type: "mc",
      question: "Which prompt is BEST for a birthday party flyer?",
      hint: "Look for the most complete one.",
      options: [
        { text: "\"party\"", correct: false },
        { text: "\"a colorful birthday party flyer with balloons and confetti, bold friendly cartoon style\"", correct: true },
        { text: "\"fun\"", correct: false },
        { text: "\"flyer thing\"", correct: false }
      ],
      correctMsg: "That's the one! Subject, details, and style all together.",
      wrongMsg: "The best prompt names the subject, adds details, and picks a style."
    },
    {
      type: "mc",
      question: "FINAL: If your first picture doesn't look right, what's the smartest move?",
      hint: "AI art is a back-and-forth.",
      options: [
        { text: "Give up on AI art completely", correct: false },
        { text: "Tweak the prompt with more details and try again", correct: true },
        { text: "Never change the prompt", correct: false },
        { text: "Just use the blurry one anyway", correct: false }
      ],
      correctMsg: "PERFECT! Great prompts often take a few tries — that's totally normal.",
      wrongMsg: "Tweaking the prompt and trying again is exactly how AI artists get great results."
    }
  ],
  badges: [
    { icon: "starter", name: "Prompt Tester", earned: true },
    { icon: "star", name: "Formula Fan", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Prompt Pro", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Art Director", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
