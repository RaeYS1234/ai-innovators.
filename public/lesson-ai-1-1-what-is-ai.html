<script>
const ROBOT_ICON = `<svg viewBox="0 0 64 64"><rect x="14" y="22" width="36" height="32" rx="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="2.5"/><rect x="20" y="28" width="10" height="10" rx="2" fill="white"/><rect x="34" y="28" width="10" height="10" rx="2" fill="white"/><circle cx="25" cy="33" r="3" fill="#0c1e3e"/><circle cx="39" cy="33" r="3" fill="#0c1e3e"/><rect x="22" y="44" width="20" height="4" rx="2" fill="white"/><line x1="32" y1="14" x2="32" y2="22" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="11" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="2"/></svg>`;
const BRAIN_ICON = `<svg viewBox="0 0 64 64"><path d="M32 8 C 22 8 14 16 14 26 C 12 28 10 30 10 34 C 10 38 12 40 14 41 C 14 49 22 56 32 56 C 42 56 50 49 50 41 C 52 40 54 38 54 34 C 54 30 52 28 50 26 C 50 16 42 8 32 8 Z" fill="#f472b6" stroke="#be185d" stroke-width="2"/><path d="M32 12 L 32 52 M 22 18 L 42 18 M 18 26 L 46 26 M 22 36 L 42 36 M 18 44 L 46 44" stroke="#be185d" stroke-width="1.2" opacity="0.4"/></svg>`;

runLesson({
  lessonId: "what-is-ai-1-1",
  courseUrl: "course-what-is-ai.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "What is AI, Really?",
  subtitle: "Nova here — let me show you what AI actually is. Hint: it's not magic.",
  steps: [
    {
      type: "vocab",
      word: "AI (Artificial Intelligence)",
      pronounce: "say it: ay-eye",
      definition: "<b>AI</b> is computer software that can do things that usually need a human brain — like understanding what you say, recognizing pictures, or coming up with new ideas.",
      example: "When you ask Siri for the weather, AI listens to your words, looks up the answer, and talks back to you!",
      icon: ROBOT_ICON
    },
    {
      type: "teach",
      title: "AI Learns From Examples",
      body: "AI doesn't just KNOW stuff. It LEARNS by looking at <b>millions</b> of examples. Show it 1 million pictures of cats, and it learns to spot a cat in any new picture!",
      examples: ["Sees 1M cat pics → spots cats", "Reads 1M books → can write stories", "Hears 1M voices → can talk back"]
    },
    {
      type: "teach",
      title: "Where You See AI Every Day",
      body: "AI is already everywhere! It's the magic behind:",
      examples: ["YouTube suggestions", "Voice assistants (Siri, Alexa)", "Self-driving cars", "Chatbots like ChatGPT", "Spam filters in email"],
      icon: BRAIN_ICON
    },
    {
      type: "mc",
      question: "What does AI need to LEARN how to do something?",
      hint: "Think about how AI gets smart.",
      options: [
        { text: "A brain transplant", correct: false },
        { text: "Lots of examples", correct: true },
        { text: "A magic spell", correct: false },
        { text: "A coffee break", correct: false }
      ],
      correctMsg: "Right! AI learns from EXAMPLES. The more it sees, the smarter it gets!",
      wrongMsg: "AI learns from EXAMPLES — millions and millions of them. That's how it gets smart."
    },
    {
      type: "mc",
      question: "Which of these uses AI?",
      hint: "Think about what we just learned.",
      options: [
        { text: "A toaster", correct: false },
        { text: "YouTube suggesting your next video", correct: true },
        { text: "A regular pencil", correct: false },
        { text: "A swing set", correct: false }
      ],
      correctMsg: "Yes! YouTube uses AI to figure out what you'll like next.",
      wrongMsg: "YouTube uses AI to RECOMMEND videos based on what you've watched. The others are just regular things!"
    },
    {
      type: "mc",
      question: "Is AI magic?",
      hint: "Nope! It's something more interesting...",
      options: [
        { text: "Yes, it's pure magic", correct: false },
        { text: "Yes, it's basically wizardry", correct: false },
        { text: "No — it's software that learned from examples", correct: true },
        { text: "No — it's just a robot dance", correct: false }
      ],
      correctMsg: "Exactly! AI is software + lots of training data. No magic needed.",
      wrongMsg: "AI is NOT magic! It's software that learned from examples. Cool, right?"
    },
    {
      type: "mc",
      question: "FINAL: Why is AI such a big deal for entrepreneurs?",
      hint: "Think about all the things AI can do.",
      options: [
        { text: "It can help you build, design, and grow your business faster", correct: true },
        { text: "It will replace all humans", correct: false },
        { text: "It only works for big companies", correct: false },
        { text: "It's too hard for kids", correct: false }
      ],
      correctMsg: "YES! AI is like a super-helpful assistant. Even kids can use it to build amazing things!",
      wrongMsg: "AI is a TOOL that helps anyone build faster — including kids! That's what makes this exciting."
    }
  ],
  badges: [
    { icon: "brain", name: "AI Explorer", earned: true },
    { icon: "star", name: "Sharp Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "bulb", name: "Big Idea Brain", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "AI Beginner", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
