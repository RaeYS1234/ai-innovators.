<script>
runLesson({
  lessonId: "prompt-engineering-1-3",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 1 · PRACTICE",
  title: "Specificity & Context",
  subtitle: "Practice turning vague prompts into sharp, specific ones",
  steps: [
    {
      type: "teach",
      title: "Vague In, Vague Out",
      body: "The single biggest lever you have as a prompt writer is specificity. Instead of \"write a story,\" try \"write a 200-word sci-fi story about a robot who learns to paint, for a 10-year-old audience.\" The more specific details you provide, audience, length, topic, tone, the more the AI's prediction narrows in on exactly what you want.",
      examples: []
    },
    {
      type: "mc",
      question: "Which prompt is more likely to get a great result?",
      hint: "Look for specific details.",
      options: [
        { text: "\"Write a 100-word email to a customer apologizing for a late shipment, in a warm and professional tone.\"", correct: true },
        { text: "\"Write an email.\"", correct: false },
        { text: "\"Help me with a business thing.\"", correct: false },
        { text: "\"Say something nice.\"", correct: false }
      ],
      correctMsg: "Yes! Specific details about length, topic, and tone lead to a much better result.",
      wrongMsg: "The prompt with specific length, topic, and tone details will produce a far more useful result."
    },
    {
      type: "mc",
      question: "A prompt says: \"Give me marketing ideas.\" What's missing that would make it much stronger?",
      hint: "Think about what business, audience, or budget.",
      options: [
        { text: "Context like what the business is, who the audience is, and any budget or constraints", correct: true },
        { text: "Nothing, this prompt is already perfect", correct: false },
        { text: "It needs to be written in all capital letters", correct: false },
        { text: "It needs to be exactly one word long", correct: false }
      ],
      correctMsg: "Correct! Adding context about the business, audience, and constraints sharpens the result.",
      wrongMsg: "This prompt is missing context, what the business is, who it's for, and any limits, which weakens the result."
    },
    {
      type: "mc",
      question: "Someone rewrites \"write about dogs\" into \"write a 3-paragraph article comparing the energy levels of Border Collies vs Bulldogs for new dog owners.\" What did they improve?",
      hint: "Think about how much clearer the goal became.",
      options: [
        { text: "They added specific topic, structure, and audience, giving the AI a much clearer target", correct: true },
        { text: "They made the prompt confusing and harder to understand", correct: false },
        { text: "They removed all useful information", correct: false },
        { text: "Nothing changed, both prompts are equally vague", correct: false }
      ],
      correctMsg: "Exactly! Specific topic, structure, and audience make prompts far more effective.",
      wrongMsg: "Adding a specific topic, structure, and target audience gives the AI a much clearer goal to aim for."
    },
    {
      type: "mc",
      question: "Why might TOO MUCH irrelevant detail in a prompt sometimes hurt the result?",
      hint: "Think about signal vs. noise.",
      options: [
        { text: "It can bury the important information in noise, making the real goal less clear", correct: true },
        { text: "AI can only read prompts under 5 words total", correct: false },
        { text: "Extra detail always improves results with no downside", correct: false },
        { text: "It's technically impossible for a prompt to be too long", correct: false }
      ],
      correctMsg: "Right! Relevant specificity helps, but irrelevant clutter can bury the real goal.",
      wrongMsg: "Irrelevant details can bury the actual goal in noise, specificity should stay relevant, not just long."
    }
  ],
  badges: [
    { icon: "bulb", name: "Specificity Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Context Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Specificity Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
