<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The 10-Slide Deck | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const DECK_ICON = `<svg viewBox="0 0 64 64"><rect x="10" y="14" width="36" height="26" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><line x1="16" y1="22" x2="38" y2="22" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="28" x2="34" y2="28" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="34" x2="30" y2="34" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><rect x="18" y="24" width="36" height="26" rx="3" fill="#7c3aed" stroke="#4c1d95" stroke-width="2.5"/><line x1="24" y1="32" x2="46" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="24" y1="38" x2="42" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="24" y1="44" x2="38" y2="44" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>`;

runLesson({
  lessonId: "first-pitch-2-1",
  courseUrl: "course-first-pitch.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "The 10-Slide Deck",
  subtitle: "The exact slide-by-slide template real founders use, inspired by Airbnb's original pitch deck.",
  steps: [
    {
      type: "vocab",
      word: "Pitch Deck",
      pronounce: "say it: PITCH deck",
      definition: "A <b>pitch deck</b> is the slideshow that walks a listener through your pitch, slide by slide. It's not meant to be read like a book, each slide should make ONE clear point, so someone flipping through in 5 minutes understands your whole business.",
      example: "Airbnb's original pitch deck, used to raise their seed funding, was just 10 slides. It's still studied today because every single slide earns its place, nothing extra, nothing missing.",
      icon: DECK_ICON
    },
    {
      type: "teach",
      title: "The Airbnb-Style 10-Slide Template",
      body: "1. <b>Title</b>, company name and one-line hook. 2. <b>Problem</b>, the specific pain. 3. <b>Solution</b>, your fix, mapped to the problem. 4. <b>Market Size</b>, how many people have this problem. 5. <b>Product</b>, what it actually looks like. 6. <b>Business Model</b>, how you make money. 7. <b>Competition</b>, who else is solving this, and your edge. 8. <b>Traction</b>, proof it's working. 9. <b>Team</b>, why you're the right people to build this. 10. <b>The Ask</b>, what you need and what you'll do with it.",
      examples: ["1-3: Title, Problem, Solution", "4-6: Market, Product, Business Model", "7-9: Competition, Traction, Team", "10: The Ask"]
    },
    {
      type: "teach",
      title: "One Slide, One Point",
      body: "The biggest mistake new founders make is cramming three ideas onto one slide. A slide packed with tiny text and five different charts forces the listener to choose between reading and listening to you, and they'll usually stop listening. The fix: one big idea per slide, one number or image that proves it, and let YOUR VOICE fill in the rest.",
      examples: ["One idea per slide", "Big, readable text", "One supporting number or image", "Your voice fills in the details"]
    },
    {
      type: "mc",
      question: "In the 10-slide template, what comes right AFTER the Problem slide?",
      hint: "What's the natural next step once someone believes the problem is real?",
      options: [
        { text: "The Ask", correct: false },
        { text: "Solution", correct: true },
        { text: "Team", correct: false },
        { text: "Competition", correct: false }
      ],
      correctMsg: "Right! Once the problem lands, Solution is next, your fix, mapped directly to that pain.",
      wrongMsg: "Solution comes right after Problem, you've earned the listener's attention, now show them your fix."
    },
    {
      type: "mc",
      question: "Why does the Competition slide matter, even if you think you have no competitors?",
      hint: "'No competition' is almost always a red flag to investors.",
      options: [
        { text: "It doesn't matter, skip it if you have no competitors", correct: false },
        { text: "It shows you understand the landscape and proves you're not naive about alternatives", correct: true },
        { text: "It's just there to fill space", correct: false },
        { text: "Investors never read that slide", correct: false }
      ],
      correctMsg: "Yes! Claiming 'zero competition' usually signals you haven't researched the market, even indirect alternatives count.",
      wrongMsg: "The Competition slide shows you understand the landscape. Claiming zero competition (even indirect alternatives) is a red flag, not a strength."
    },
    {
      type: "mc",
      question: "What is the biggest problem with cramming 3 ideas onto one slide?",
      hint: "Think about what the listener has to choose between.",
      options: [
        { text: "It makes the deck look more professional", correct: false },
        { text: "It forces the listener to choose between reading the slide and listening to you", correct: true },
        { text: "It saves paper", correct: false },
        { text: "Nothing, more information is always better", correct: false }
      ],
      correctMsg: "Correct! A crowded slide splits attention, one idea per slide keeps people listening to YOU.",
      wrongMsg: "Cramming ideas onto one slide forces a choice: read the slide, or listen to the speaker. One idea per slide keeps the audience's attention on you."
    },
    {
      type: "mc",
      question: "What should the Team slide actually prove?",
      hint: "It's not just a list of names.",
      options: [
        { text: "That your team has fun hobbies", correct: false },
        { text: "Why THIS specific team is the right one to build THIS specific solution", correct: true },
        { text: "How many people work at the company", correct: false },
        { text: "Where everyone went to school, and nothing else", correct: false }
      ],
      correctMsg: "Right! The Team slide should connect your specific skills to this specific problem, not just list names and titles.",
      wrongMsg: "The Team slide should prove why THIS team is the right one for THIS solution, relevant skills and experience, not just names and hobbies."
    },
    {
      type: "mc",
      question: "Airbnb's original pitch deck had how many slides?",
      hint: "It's in the lesson's title.",
      options: [
        { text: "3", correct: false },
        { text: "10", correct: true },
        { text: "25", correct: false },
        { text: "50", correct: false }
      ],
      correctMsg: "Yes! 10 tight, focused slides, still studied by founders today.",
      wrongMsg: "Airbnb's original seed-funding deck was just 10 slides, tight and focused, which is why it's still studied today."
    }
  ],
  badges: [
    { icon: "starter", name: "Deck Builder", earned: true },
    { icon: "bulb", name: "Slide Strategist", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Deck Master", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Founder-in-Training", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
