<script>
const ROCKET_ICON = `<svg viewBox="0 0 64 64"><path d="M32 4 C 42 14 46 28 42 42 L 22 42 C 18 28 22 14 32 4 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5"/><circle cx="32" cy="24" r="5" fill="white" stroke="#b91c1c" stroke-width="2"/><path d="M22 42 L14 54 L22 50 Z" fill="#f97316" stroke="#c2410c" stroke-width="2"/><path d="M42 42 L50 54 L42 50 Z" fill="#f97316" stroke="#c2410c" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "startup-fundamentals-1-2",
  courseUrl: "course-startup-fundamentals.html",
  tag: "UNIT 1 · LESSON 1.2",
  title: "What is a Startup vs Small Business?",
  subtitle: "A coffee shop and a rocket ship are both businesses — but they're very different.",
  steps: [
    {
      type: "vocab",
      word: "Startup",
      pronounce: "say it: START-uhp",
      definition: "A <b>startup</b> is a new company built to grow FAST and often designed to scale to huge size — usually with a new or unproven idea.",
      example: "A new app trying to reach millions of users, funded by investors betting on rapid growth.",
      icon: ROCKET_ICON
    },
    {
      type: "teach",
      title: "Startup vs Small Business",
      body: "A <b>small business</b> (like a local bakery) usually grows steadily, serves a local market, and is often self-funded. A <b>startup</b> is built to grow explosively, often serves a huge or global market, and usually raises outside investment betting on that fast growth.",
      examples: ["Small business: steady, local, self-funded", "Startup: fast growth, big market, often investor-funded"]
    },
    {
      type: "mc",
      question: "What's a defining trait of a startup?",
      hint: "Think about speed and scale.",
      options: [
        { text: "It's built to grow very fast and scale big", correct: true },
        { text: "It always stays small forever", correct: false },
        { text: "It never has customers", correct: false },
        { text: "It can't ever make a profit", correct: false }
      ],
      correctMsg: "Right! Startups are designed for fast, large-scale growth.",
      wrongMsg: "Startups are specifically built to grow fast and reach a large scale."
    },
    {
      type: "mc",
      question: "A local family bakery that grows slowly and serves its neighborhood is an example of a...",
      hint: "It's not trying to go global overnight.",
      options: [
        { text: "Small business", correct: true },
        { text: "Startup", correct: false },
        { text: "Nonprofit only", correct: false },
        { text: "Government agency", correct: false }
      ],
      correctMsg: "Correct! Steady, local growth is a small business pattern.",
      wrongMsg: "Slow, steady, local growth is the classic small business pattern — not a startup."
    },
    {
      type: "mc",
      question: "Why do startups often raise money from investors?",
      hint: "Fast growth needs fuel.",
      options: [
        { text: "Fast growth is expensive, and investors bet on future big returns", correct: true },
        { text: "Startups are required by law to take investment", correct: false },
        { text: "Investors run the day-to-day business instead of founders", correct: false },
        { text: "It's the only way to legally start a company", correct: false }
      ],
      correctMsg: "Yes! Investment fuels the fast growth startups are chasing.",
      wrongMsg: "Startups often need investor money to fund fast growth, and investors hope for a big future payoff."
    },
    {
      type: "mc",
      question: "Which is TRUE about small businesses compared to startups?",
      hint: "Think about funding source.",
      options: [
        { text: "They're often self-funded rather than relying on outside investors", correct: true },
        { text: "They always grow faster than startups", correct: false },
        { text: "They can never be profitable", correct: false },
        { text: "They must serve a global market", correct: false }
      ],
      correctMsg: "Exactly! Small businesses are often funded by the owner, not outside investors.",
      wrongMsg: "Small businesses are typically self-funded, unlike many startups that raise investor money."
    }

  badges: [

    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Business Smart", earned: ({ correct }) => correct >= 4 },

    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
