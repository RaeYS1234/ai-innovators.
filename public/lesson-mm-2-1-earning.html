<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ways to Earn Money | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const EARN_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="22" r="9" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><path d="M 23 21 Q 24 13 32 12 Q 40 13 41 21 Q 39 17 32 17 Q 25 17 23 21 Z" fill="#1c1917"/><circle cx="29" cy="22" r="1" fill="#1c1917"/><circle cx="35" cy="22" r="1" fill="#1c1917"/><path d="M 29 25 Q 32 27 35 25" stroke="#1c1917" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M 16 56 C 16 44 22 38 32 38 C 42 38 48 44 48 56 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/><circle cx="50" cy="24" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><text x="50" y="28" font-size="10" fill="#78350f" text-anchor="middle" font-weight="900" font-family="sans-serif">$</text></svg>`;

runLesson({
  lessonId: "money-math-2-1",
  courseUrl: "course-money-math.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "Ways to Earn Money",
  subtitle: "How do kids AND grown-ups get money? Let's find out!",
  steps: [
    {
      type: "vocab",
      word: "Earning",
      pronounce: "say it: UR-ning",
      definition: "<b>Earning</b> money means <b>getting paid</b> for doing work. When you help, help someone, or make something people want, they might pay you!",
      example: "If you help your neighbor rake leaves and they give you $5, you EARNED $5!",
      icon: EARN_ICON
    },
    {
      type: "teach",
      title: "Ways Kids Can Earn",
      body: "There are lots of ways kids can earn money! Doing extra chores, selling something you made, helping neighbors, or even getting an allowance for regular chores at home.",
      examples: ["Extra chores", "Lemonade stand", "Helping neighbors", "Selling art"]
    },
    {
      type: "teach",
      title: "Ways Grown-Ups Earn",
      body: "Grown-ups earn money by doing <b>jobs</b>. A doctor earns money by helping sick people. A teacher earns money by teaching kids. Someone who owns a business earns money by <b>selling stuff</b> to customers.",
      examples: ["Jobs (teacher, doctor)", "Owning a business", "Selling online"]
    },
    {
      type: "mc",
      question: "Which of these is a way to EARN money?",
      hint: "Which one is doing work that people pay for?",
      options: [
        { text: "Watching TV", correct: false },
        { text: "Mowing a neighbor's lawn for $10", correct: true },
        { text: "Sleeping in", correct: false },
        { text: "Playing video games", correct: false }
      ],
      correctMsg: "Yes! When someone pays you for helping, that's earning.",
      wrongMsg: "Watching TV doesn't earn money, you need to DO something people pay for."
    },
    {
      type: "mc",
      question: "You do 3 chores and earn $2 each. How much did you earn?",
      hint: "$2 × 3 = ?",
      options: [
        { text: "$2", correct: false },
        { text: "$5", correct: false },
        { text: "$6", correct: true },
        { text: "$10", correct: false }
      ],
      correctMsg: "Perfect! 3 × $2 = $6 total.",
      wrongMsg: "Multiply the number of chores by how much each pays: 3 × $2 = $6."
    },
    {
      type: "mc",
      question: "You sell 5 cookies for $1 each. How much did you EARN?",
      hint: "5 cookies × $1 = ?",
      options: [
        { text: "$1", correct: false },
        { text: "$5", correct: true },
        { text: "$10", correct: false },
        { text: "$50", correct: false }
      ],
      correctMsg: "Right! 5 × $1 = $5. Nice sale!",
      wrongMsg: "5 cookies at $1 each = $5 total."
    },
    {
      type: "mc",
      question: "Which is the BEST way to earn MORE money?",
      hint: "Think about what you can control.",
      options: [
        { text: "Wait for someone to give it to you", correct: false },
        { text: "Do more work or make something great people want", correct: true },
        { text: "Complain a lot", correct: false },
        { text: "Nothing, money just happens", correct: false }
      ],
      correctMsg: "YES! Working harder or making great stuff = more money.",
      wrongMsg: "The best way to earn more is to work hard and make things people want to buy."
    }
  ],
  badges: [
    { icon: "money", name: "Earner", earned: true },
    { icon: "star", name: "Hard Worker", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Money Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Future CEO", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
