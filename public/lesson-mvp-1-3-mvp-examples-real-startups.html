<script>
const STARTUP_ICON = `<svg viewBox="0 0 64 64"><path d="M32 6 L40 26 L60 26 L44 38 L50 58 L32 46 L14 58 L20 38 L4 26 L24 26 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "build-mvps-1-3",
  courseUrl: "course-build-mvps.html",
  tag: "UNIT 1 · LESSON 1.3",
  title: "MVP Examples From Real Startups",
  subtitle: "How famous companies started with surprisingly simple first versions",
  steps: [
    {
      type: "vocab",
      word: "Concierge MVP",
      pronounce: "say it: KON-see-erj em-vee-pee",
      definition: "A <b>concierge MVP</b> is when the founder manually does the work by hand at first, instead of building automated software right away.",
      example: "Before automating anything, a meal-planning startup founder personally emailed handwritten meal plans to the first 20 customers.",
      icon: STARTUP_ICON
    },
    {
      type: "teach",
      title: "Famous MVPs Were Often Tiny",
      body: "Many well-known companies started far smaller than people expect. Some early MVPs were just a simple landing page to gauge interest before building anything. Others used a \"concierge\" approach, doing the service manually by hand for early customers before ever writing complex software. The lesson: test the DEMAND first, automate LATER once you know it's worth building.",
      examples: ["Landing page MVPs: test interest before building", "Concierge MVPs: do it manually before automating", "Test demand first, automate later"]
    },
    {
      type: "mc",
      question: "What is a \"concierge MVP\"?",
      hint: "Think about doing things by hand.",
      options: [
        { text: "When the founder manually does the work by hand instead of automating right away", correct: true },
        { text: "A fully automated app with no human involvement", correct: false },
        { text: "A legal document required before launching", correct: false },
        { text: "A type of hotel service unrelated to startups", correct: false }
      ],
      correctMsg: "Right! A concierge MVP means doing the work manually before automating.",
      wrongMsg: "A concierge MVP is when the founder manually does the work by hand, instead of automating right away."
    },
    {
      type: "mc",
      question: "Why might a founder use a simple LANDING PAGE as their very first MVP?",
      hint: "Think about testing interest cheaply.",
      options: [
        { text: "To test whether people are interested, before spending time building the actual product", correct: true },
        { text: "Because landing pages are illegal to skip", correct: false },
        { text: "It guarantees the business will succeed", correct: false },
        { text: "It replaces the need for any product at all, forever", correct: false }
      ],
      correctMsg: "Correct! A landing page tests real interest cheaply, before building anything complex.",
      wrongMsg: "A landing page MVP tests whether people are interested before spending time building the full product."
    },
    {
      type: "mc",
      question: "What's the shared lesson behind concierge MVPs and landing page MVPs?",
      hint: "Think about testing before automating.",
      options: [
        { text: "Test real demand first, then automate or build fully once you know it's worth it", correct: true },
        { text: "Always automate everything before testing anything", correct: false },
        { text: "Never talk to real customers at any point", correct: false },
        { text: "Skip testing and go straight to a massive launch", correct: false }
      ],
      correctMsg: "Exactly! The shared lesson is testing demand first, then building fully once it's proven.",
      wrongMsg: "Both approaches share the same lesson: test real demand first, then build or automate once it's proven worth it."
    }
  ],
  badges: [
    { icon: "bulb", name: "Examples Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "MVP History Smart", earned: ({ correct }) => correct >= 3 },
