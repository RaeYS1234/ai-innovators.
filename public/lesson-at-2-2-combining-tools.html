  <div class="screen active" id="screen-welcome">

<script src="lesson-engine.js"></script>
<script>
const CHAIN_ICON = `<svg viewBox="0 0 64 64"><rect x="6" y="22" width="20" height="20" rx="8" fill="none" stroke="#0284c7" stroke-width="4" transform="rotate(-20 16 32)"/><rect x="38" y="22" width="20" height="20" rx="8" fill="none" stroke="#0284c7" stroke-width="4" transform="rotate(-20 48 32)"/></svg>`;

runLesson({
  lessonId: "ai-tools-2-2",
  courseUrl: "course-ai-tools-workshop.html",
  tag: "UNIT 2 · LESSON 2.2",
  title: "Combining AI Tools",
  subtitle: "The real magic happens when you chain tools together!",
  steps: [
    {
      type: "vocab",
      word: "Chaining",
      pronounce: "say it: CHAY-ning",
      definition: "<b>Chaining</b> tools means using the output of one AI tool as the input for the next one — like passing a baton in a relay race.",
      example: "ChatGPT writes your ad text → you paste that text into Canva to design a poster around it.",
      icon: CHAIN_ICON
    },
    {
      type: "teach",
      title: "Why Chain Tools Together?",
      body: "No single AI tool does EVERYTHING. But when you chain them, you can go from idea to a finished, professional product. Example: ChatGPT writes your product description → you paste it into Canva to design a poster → Suno makes a jingle for your ad → ElevenLabs turns your script into a voiceover. Each tool builds on the last one!",
      examples: ["ChatGPT → text", "Canva → visual", "Suno → music", "ElevenLabs → voice"]
    },
    {
      type: "teach",
      title: "A Real Chain: Launching a T-Shirt Business",
      body: "Maya is launching a t-shirt business. Step 1: She asks ChatGPT for a catchy tagline. Step 2: She pastes the tagline into Canva and uses Magic Studio to design a poster around it. Step 3: She uses Suno to make a 10-second jingle for her Instagram ad. Step 4: She writes a short script and uses ElevenLabs to turn it into a voiceover. Four tools, one finished ad campaign!",
      examples: ["Tagline (ChatGPT)", "Poster (Canva)", "Jingle (Suno)", "Voiceover (ElevenLabs)"]
    },
    {
      type: "mc",
      question: "What does 'chaining' AI tools mean?",
      hint: "Think 'relay race,' passing something along.",
      options: [
        { text: "Using only one AI tool forever", correct: false },
        { text: "Using the output of one tool as the input for the next tool", correct: true },
        { text: "Turning off all your AI tools", correct: false },
        { text: "Deleting your AI accounts", correct: false }
      ],
      correctMsg: "Right! Chaining passes work from one tool to the next.",
      wrongMsg: "Chaining means using ONE tool's output (like ChatGPT's text) as the input for the NEXT tool (like Canva's design)."
    },
    {
      type: "mc",
      question: "Maya wants a poster with a tagline already written into it. What's the smart order?",
      hint: "Words come before the design that uses them.",
      options: [
        { text: "Design the poster first, then think of words never used in it", correct: false },
        { text: "Write the tagline in ChatGPT first, then design the poster around it in Canva", correct: true },
        { text: "Only use Canva and skip words completely", correct: false },
        { text: "Only use ChatGPT and skip the poster completely", correct: false }
      ],
      correctMsg: "Yes! Words first, then design around them — that's a smart chain.",
      wrongMsg: "Chain it: write the tagline in ChatGPT FIRST, then paste it into Canva so the poster is built around real words."
    },
    {
      type: "mc",
      question: "Which is a smart AI tool chain for a video ad with a voice?",
      hint: "Think: what has to happen before you can record a voice reading it?",
      options: [
        { text: "Make the voiceover first, then write the script after", correct: false },
        { text: "Write the script in ChatGPT, THEN turn it into a voiceover with ElevenLabs", correct: true },
        { text: "Use Suno to write the script", correct: false },
        { text: "Skip the script completely", correct: false }
      ],
      correctMsg: "Exactly! You need the words before you can turn them into a spoken voice.",
      wrongMsg: "Write the script FIRST (ChatGPT), then feed that script into ElevenLabs to create the voiceover — order matters."
    },
    {
      type: "mc",
      question: "Why does chaining tools usually beat using just ONE tool for a whole project?",
      hint: "Think about what each tool is specialized for.",
      options: [
        { text: "Because one tool can never be used twice", correct: false },
        { text: "Because each tool is best at ONE job, so combining them covers more of the project", correct: true },
        { text: "It doesn't — one tool is always enough", correct: false },
        { text: "Because chaining is required by law", correct: false }
      ],
      correctMsg: "Right! Each tool's strength covers a different part of the finished project.",
      wrongMsg: "No single tool does everything well. Chaining lets each tool handle the part it's BEST at — words, design, music, or voice."
    },
    {
      type: "mc",
      question: "True or False: You should keep the SAME finished idea/details when you move from one AI tool to the next in a chain.",
      hint: "Think about what happens if your poster doesn't match your tagline.",
      options: [
        { text: "True — staying consistent keeps your brand clear", correct: true },
        { text: "False — change everything each time for fun", correct: false },
        { text: "True, but only for logos", correct: false },
        { text: "False — details never matter", correct: false }
      ],
      correctMsg: "Yes! Keeping your idea consistent across tools makes your final product feel like ONE clear brand.",
      wrongMsg: "Stay consistent! If your Canva poster doesn't match the tagline ChatGPT wrote, your brand looks messy and confusing."
    }
  ],
  badges: [
    { icon: "bulb", name: "Chain Starter", earned: true },
    { icon: "star", name: "Chain Builder", earned: ({ correct }) => correct >= 3 },
    { icon: "brain", name: "Workflow Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Tool Chain Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
