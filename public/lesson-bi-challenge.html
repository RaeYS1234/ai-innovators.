<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Idea Generator Challenge | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">🏆 FINAL CHALLENGE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Course Complete!</h1>
    <p class="complete-subtitle">You're officially an Idea Generator. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "business-idea-challenge",
  courseUrl: "course-business-idea.html",
  tag: "🏆 FINAL CHALLENGE",
  title: "Idea Generator Challenge",
  subtitle: "The boss battle! Prove you can spot, pick, and test a great idea.",
  steps: [
    { type: "mc", question: "Where do the best business ideas come from?", hint: "Think about what's bugging people.",
      options: [
        { text: "Noticing a real problem", correct: true },
        { text: "Copying a friend exactly", correct: false },
        { text: "Random guessing", correct: false },
        { text: "Ignoring people around you", correct: false }
      ],
      correctMsg: "Right! Great ideas start with a real problem you noticed.",
      wrongMsg: "The best ideas come from noticing a problem and deciding to fix it." },
    { type: "mc", question: "What are the 3 questions to test if an idea is worth trying?", hint: "Problem, doable, pay.",
      options: [
        { text: "Does it solve a problem? Can I actually do it? Would people pay?", correct: true },
        { text: "Is it cool? Is it expensive? Is it fast?", correct: false },
        { text: "Do I like it? Is it easy? Is it short?", correct: false },
        { text: "None of these matter", correct: false }
      ],
      correctMsg: "Yes! The 3-question test: problem, feasible, pay.",
      wrongMsg: "The test is: solves a problem, feasible to do, and people would pay." },
    { type: "mc", question: "What's the #1 rule during brainstorming?", hint: "Judging comes later.",
      options: [
        { text: "Write down EVERY idea first, judge later", correct: true },
        { text: "Judge each idea immediately", correct: false },
        { text: "Only think of one idea", correct: false },
        { text: "Never write ideas down", correct: false }
      ],
      correctMsg: "Exactly! Quantity first, judging later.",
      wrongMsg: "Brainstorming golden rule: write everything down first, judge after." },
    { type: "mc", question: "Why test your idea small BEFORE going big?", hint: "Think about risk.",
      options: [
        { text: "So you risk very little time and money while you learn", correct: true },
        { text: "Testing is against the rules", correct: false },
        { text: "Small tests always fail", correct: false },
        { text: "It makes ideas worse", correct: false }
      ],
      correctMsg: "Right! Test small, risk little, learn fast.",
      wrongMsg: "Small tests protect your time and money while you find out what works." },
    { type: "mc", question: "Your pilot test flops, nobody wants to buy. Best next move?", hint: "Testing = learning, not failing.",
      options: [
        { text: "Learn why, tweak the idea, and test again", correct: true },
        { text: "Give up on business forever", correct: false },
        { text: "Launch big anyway and ignore the feedback", correct: false },
        { text: "Blame the testers", correct: false }
      ],
      correctMsg: "Yes! A flopped test is a lesson, adjust and try again.",
      wrongMsg: "Failed tests teach you fast. Adjust the idea and test again." },
    { type: "mc", question: "Which idea passes the feasibility check for a kid entrepreneur?", hint: "Realistic beats flashy.",
      options: [
        { text: "A lemonade stand on a hot day", correct: true },
        { text: "Building a real airplane in the garage", correct: false },
        { text: "Opening a bank", correct: false },
        { text: "Launching a satellite", correct: false }
      ],
      correctMsg: "Yes! Simple, doable, and solves a real problem.",
      wrongMsg: "Feasible means realistic with the time, money, and skills you actually have." },
    { type: "mc", question: "A true business idea should always...", hint: "Think about helping real people.",
      options: [
        { text: "Help or fix something for real people", correct: true },
        { text: "Just look cool", correct: false },
        { text: "Cost nothing ever to run", correct: false },
        { text: "Only exist as an app", correct: false }
      ],
      correctMsg: "Right! Every good idea helps or fixes something.",
      wrongMsg: "A good idea has to actually help or fix something for people." }
  ],
  badges: [
    { icon: "star", name: "Course Complete", earned: true },
    { icon: "bulb", name: "Idea Spotter", earned: ({ correct }) => correct >= 3 },
    { icon: "brain", name: "Idea Smart", earned: ({ correct }) => correct >= 5 },
    { icon: "perfect", name: "Perfect Champion", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "Untouchable", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Idea Generator", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
