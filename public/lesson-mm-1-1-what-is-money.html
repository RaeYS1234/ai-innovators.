<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const COIN_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fbbf24" stroke="#d97706" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="none" stroke="#d97706" stroke-width="2"/><text x="32" y="42" font-size="28" fill="#92400e" text-anchor="middle" font-weight="900" font-family="sans-serif">$</text></svg>`;

runLesson({
  lessonId: "money-math-1-1",
  courseUrl: "course-money-math.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "What is Money?",
  subtitle: "Money is everywhere — but what IS it really? Nova will show you!",
  steps: [
    {
      type: "vocab",
      word: "Money",
      pronounce: "say it: MUN-ee",
      definition: "<b>Money</b> is something we use to BUY and SELL stuff. Long ago, people traded chickens for shoes. Today, we use coins, bills, and digital money instead!",
      example: "When you buy a snack at the store, you give them money and they give you the snack. Trade!",
      icon: COIN_ICON
    },
    {
      type: "teach",
      title: "Different Forms of Money",
      body: "Money comes in many forms today: <b>coins</b> (the metal kind), <b>bills</b> (paper money), and <b>digital money</b> (numbers stored on a computer or app).",
      examples: ["Coins (pennies, nickels, dimes)", "Paper bills ($1, $5, $10)", "Apps (Venmo, gift cards)"]
    },
    {
      type: "mc",
      question: "Why do people use money?",
      hint: "Think about what we just learned.",
      options: [
        { text: "To buy and sell things", correct: true },
        { text: "To eat for breakfast", correct: false },
        { text: "To play sports", correct: false },
        { text: "To do homework", correct: false }
      ],
      correctMsg: "Right! Money helps us buy what we need and want.",
      wrongMsg: "Money is for buying and selling. You can't eat or play with it!"
    },
    {
      type: "mc",
      question: "Which of these is NOT money?",
      hint: "Three are forms of money. One isn't!",
      options: [
        { text: "A penny", correct: false },
        { text: "A $5 bill", correct: false },
        { text: "A pencil", correct: true },
        { text: "Money in a Venmo app", correct: false }
      ],
      correctMsg: "Yes! A pencil is a thing you can BUY with money — but it's not money itself.",
      wrongMsg: "A pencil isn't money — it's something you'd buy WITH money!"
    },
    {
      type: "mc",
      question: "Long ago, before money, how did people get stuff?",
      hint: "Think about that chicken-for-shoes example.",
      options: [
        { text: "They just took it", correct: false },
        { text: "They traded one thing for another", correct: true },
        { text: "Everything was free", correct: false },
        { text: "They used computers", correct: false }
      ],
      correctMsg: "Yes! It was called 'bartering' — trading one thing for another.",
      wrongMsg: "People used to TRADE — like 2 chickens for 1 pair of shoes. Money made trading WAY easier!"
    },
    {
      type: "mc",
      question: "Why is money easier than trading?",
      hint: "Imagine trading 30 chickens to buy a bike!",
      options: [
        { text: "You can use the same money for ANYTHING", correct: true },
        { text: "Money tastes good", correct: false },
        { text: "Money can fly", correct: false },
        { text: "Trading is illegal", correct: false }
      ],
      correctMsg: "EXACTLY! With money, you don't need to find someone who wants YOUR stuff. You just hand them money!",
      wrongMsg: "Money works for ANYTHING. With trading, you'd have to find someone who needs exactly what you have."
    }
  ],
  badges: [
    { icon: "money", name: "Money Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 1 },
    { icon: "brain", name: "Money Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Money Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
