<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Do Ideas Come From? — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Find My Idea!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Idea Generator!</h1>
    <p class="complete-subtitle">You're ready to come up with awesome ideas. Look what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — every idea takes a few tries!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const BULB_ICON = `<svg viewBox="0 0 64 64"><path d="M32 6 C 22 6 14 14 14 24 C 14 30 18 34 20 38 L 20 44 L 44 44 L 44 38 C 46 34 50 30 50 24 C 50 14 42 6 32 6 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/><circle cx="26" cy="22" r="3" fill="white" opacity="0.6"/><rect x="22" y="46" width="20" height="4" rx="2" fill="#475569"/><rect x="24" y="52" width="16" height="4" rx="2" fill="#475569"/></svg>`;

runLesson({
  lessonId: "business-idea-1-1",
  courseUrl: "course-business-idea.html",
  tag: "UNIT 1 · LESSON 1.1",
  title: "Where Do Ideas Come From?",
  subtitle: "Every business starts with an idea. Where do you find one? Nova has the secret!",
  steps: [
    {
      type: "vocab",
      word: "Idea",
      pronounce: "say it: eye-DEE-uh",
      definition: "An <b>idea</b> is a thought about how to make something new or better. Business ideas usually come from noticing a problem and thinking, \"What if I could fix this?\"",
      example: "Mikaila Ulmer noticed bees were dying. Her idea: lemonade made with honey to help save bees!",
      icon: BULB_ICON
    },
    {
      type: "teach",
      title: "Ideas Come From 3 Places",
      body: "The best entrepreneurs find ideas in these spots: <b>problems they have</b>, <b>things they love</b>, and <b>stuff they notice others struggling with</b>.",
      examples: ["Problems YOU have", "Stuff YOU love", "What others need"]
    },
    {
      type: "mc",
      question: "Which is the BEST place to find a business idea?",
      hint: "Think about what we just learned.",
      options: [
        { text: "Copy whatever your friend is doing", correct: false },
        { text: "A problem you've noticed in your own life", correct: true },
        { text: "Something nobody else cares about", correct: false },
        { text: "A boring topic", correct: false }
      ],
      correctMsg: "Yes! Problems YOU notice are gold — because if YOU have it, others probably do too.",
      wrongMsg: "The best ideas come from PROBLEMS YOU notice. If you have the problem, others do too!"
    },
    {
      type: "teach",
      title: "Tip: Look Around You",
      body: "Right now, look around the room. Do you see anything that's <b>annoying</b>, <b>broken</b>, or could be <b>better</b>? That's where business ideas live!",
      examples: ["Annoying chores → cleaning service", "Boring lunch → snack business", "Lost stuff → tracker invention"]
    },
    {
      type: "mc",
      question: "You always lose your homework. Could that be a business idea?",
      hint: "Lots of kids probably have this same problem!",
      options: [
        { text: "No, that's just my problem", correct: false },
        { text: "Yes — invent a homework organizer for kids", correct: true },
        { text: "Maybe, but adults don't care", correct: false },
        { text: "No, only inventors have business ideas", correct: false }
      ],
      correctMsg: "EXACTLY! Lots of kids lose homework. Solve it = great business!",
      wrongMsg: "If YOU have the problem, OTHER kids probably have it too! That's a business waiting to happen."
    },
    {
      type: "mc",
      question: "What if you LOVE drawing? How could that become a business?",
      hint: "Combine what you love with what people need.",
      options: [
        { text: "Sell custom art for people's birthdays", correct: true },
        { text: "Stop drawing forever", correct: false },
        { text: "Hide your drawings", correct: false },
        { text: "Only draw on weekends", correct: false }
      ],
      correctMsg: "Yes! Custom art = a business kids and parents would actually buy!",
      wrongMsg: "Combine what you LOVE with what people NEED. Custom art for birthdays = perfect business!"
    },
    {
      type: "mc",
      question: "FINAL: What's the magic ingredient in every business idea?",
      hint: "Without this, there's no business.",
      options: [
        { text: "A lot of money to start", correct: false },
        { text: "It solves a problem or helps people", correct: true },
        { text: "Being on TV", correct: false },
        { text: "Working alone", correct: false }
      ],
      correctMsg: "YES! Every great business solves a problem or helps people. That's the secret!",
      wrongMsg: "Money isn't required! The magic ingredient is HELPING PEOPLE — solving a problem they have."
    }
  ],
  badges: [
    { icon: "bulb", name: "Idea Spark", earned: true },
    { icon: "star", name: "Sharp Eye", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Idea Pro", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Idea Champion", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
