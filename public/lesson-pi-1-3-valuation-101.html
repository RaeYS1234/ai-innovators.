<script src="lesson-engine.js"></script>
<script>
const VALUATION_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="32" y="42" font-size="26" fill="#065f46" text-anchor="middle" font-weight="900">$</text></svg>`;

runLesson({
  lessonId: "pitching-investors-1-3",
  courseUrl: "course-pitching-investors.html",
  tag: "UNIT 1 · LESSON 1.3",
  title: "Valuation 101",
  subtitle: "What it means to say a startup is 'worth' a certain amount",
  steps: [
    {
      type: "vocab",
      word: "Valuation",
      pronounce: "say it: val-yoo-AY-shun",
      definition: "A <b>valuation</b> is an estimate of how much a company is worth, used to decide how much equity an investor gets for their money.",
      example: "If a startup is valued at $1 million and an investor puts in $100,000, they'd typically get about 10% equity.",
      icon: VALUATION_ICON
    },
    {
      type: "teach",
      title: "Valuation Sets the Trade Ratio",
      body: "Valuation determines how much equity investors get for their money. A HIGHER valuation means investors get LESS equity for the same investment (good for the founder's ownership). A LOWER valuation means investors get MORE equity for the same money. Early-stage valuations are often more art than exact science, based on team, market size, traction, and comparable deals.",
      examples: ["Higher valuation → investor gets less equity per dollar", "Lower valuation → investor gets more equity per dollar", "Early valuations are estimates, not exact math"]
    },
    {
      type: "mc",
      question: "What is a \"valuation\"?",
      hint: "Think about a company's estimated worth.",
      options: [
        { text: "An estimate of how much a company is worth", correct: true },
        { text: "The exact amount of cash a company has in the bank", correct: false },
        { text: "A legal contract signed by every employee", correct: false },
        { text: "The number of years a company has existed", correct: false }
      ],
      correctMsg: "Right! Valuation is an estimate of a company's worth.",
      wrongMsg: "A valuation is an estimate of how much a company is worth."
    },
    {
      type: "mc",
      question: "If a startup RAISES its valuation, what happens to the equity investors get for the SAME amount of money?",
      hint: "Think about the trade-off.",
      options: [
        { text: "Investors get LESS equity for that same amount of money", correct: true },
        { text: "Investors get MORE equity for that same amount of money", correct: false },
        { text: "Nothing changes at all", correct: false },
        { text: "The investor's money instantly doubles", correct: false }
      ],
      correctMsg: "Correct! A higher valuation means investors get less equity per dollar invested.",
      wrongMsg: "A higher valuation means investors receive LESS equity for the same amount of money."
    },
    {
      type: "mc",
      question: "Why are early-stage startup valuations often described as \"more art than exact science\"?",
      hint: "Think about lack of revenue history.",
      options: [
        { text: "Very early startups often lack a long financial history, so valuation relies on judgment and comparables", correct: true },
        { text: "Valuations are decided by a government lottery", correct: false },
        { text: "Early startups always have a perfectly precise, guaranteed valuation", correct: false },
        { text: "Valuation has nothing to do with team or market size", correct: false }
      ],
      correctMsg: "Exactly! Without long financial history, early valuations rely heavily on judgment and comparison.",
      wrongMsg: "Early startups often lack financial history, so their valuation relies more on judgment, team, and comparable deals."
    }
  ],
  badges: [
    { icon: "bulb", name: "Valuation Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Valuation Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Valuation Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
