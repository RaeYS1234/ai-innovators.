<script>
runLesson({
  lessonId: "marketing-branding-3-2",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 3 · PRACTICE",
  title: "Plan Your First Campaign",
  subtitle: "Put EVERYTHING together, goal, audience, message, and channel, into one real plan!",
  steps: [
    {
      type: "teach",
      title: "The 4-Part Campaign Plan",
      body: "A marketing <b>campaign</b> needs 4 pieces: <b>Goal</b> (what you want to happen), <b>Audience</b> (who you're talking to), <b>Message</b> (what you'll say), and <b>Channel</b> (where you'll say it, social, email, flyers).",
      examples: ["Goal", "Audience", "Message", "Channel"]
    },
    {
      type: "mc",
      question: "Goal: Sell 50 cookies this weekend. Which is the BEST matching message?",
      hint: "Match urgency and clarity to the goal.",
      options: [
        { text: "\"Get fresh cookies this weekend only, order before Sunday!\"", correct: true },
        { text: "\"We sell cookies sometimes, maybe, whenever\"", correct: false },
        { text: "\"Cookies exist in the world\"", correct: false },
        { text: "No message at all", correct: false }
      ],
      correctMsg: "Yes! Clear, urgent, and matches the weekend sales goal.",
      wrongMsg: "The message should be clear and urgent to match a specific weekend sales goal."
    },
    {
      type: "mc",
      question: "Audience: busy parents picking up kids from school. Best channel?",
      hint: "Where do parents actually see things fast?",
      options: [
        { text: "A quick flyer at pickup + a short social post", correct: true },
        { text: "A billboard on the moon", correct: false },
        { text: "A long 20-page printed report", correct: false },
        { text: "No channel, just hope they find out", correct: false }
      ],
      correctMsg: "Right! Quick, visible spots where your actual audience already is.",
      wrongMsg: "Pick channels where your real audience already spends time, quick and visible works best for busy parents."
    },
    {
      type: "mc",
      question: "You want to launch a new logo design. Which is a complete campaign plan?",
      hint: "Check for all 4 parts: goal, audience, message, channel.",
      options: [
        { text: "Goal: get 100 people to see the new logo. Audience: past customers. Message: \"We got a fresh new look!\" Channel: email + social post.", correct: true },
        { text: "Just posting a photo with no plan", correct: false },
        { text: "Only picking a goal and nothing else", correct: false },
        { text: "Skipping the audience entirely", correct: false }
      ],
      correctMsg: "PERFECT! That plan covers goal, audience, message, and channel.",
      wrongMsg: "A real campaign needs all 4 parts working together: goal, audience, message, and channel."
    },
    {
      type: "mc",
      question: "FINAL: Why do you plan a campaign BEFORE posting anything?",
      hint: "Think about wasted effort vs. focused effort.",
      options: [
        { text: "So every post has a clear purpose instead of being random", correct: true },
        { text: "Planning wastes time, just post randomly", correct: false },
        { text: "Plans are only for huge companies", correct: false },
        { text: "It doesn't matter at all", correct: false }
      ],
      correctMsg: "PERFECT! A plan keeps every post working toward the same goal.",
      wrongMsg: "Planning first means every post has a clear purpose, instead of posting randomly and hoping."
    }
  ],
  badges: [
    { icon: "target", name: "Campaign Planner", earned: true },
    { icon: "star", name: "Goal Setter", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Strategy Smart", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "Campaign Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
