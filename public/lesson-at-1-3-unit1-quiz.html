<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit 1 Check | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "ai-tools-1-3",
  courseUrl: "course-ai-tools-workshop.html",
  tag: "UNIT 1 CHECK",
  title: "Unit 1 Quiz",
  subtitle: "Show what you know about ChatGPT and Canva AI!",
  steps: [
    {
      type: "mc",
      question: "What is a 'prompt'?",
      hint: "Think about what YOU type first.",
      options: [
        { text: "The instructions or question you give an AI tool", correct: true },
        { text: "The AI's picture or answer", correct: false },
        { text: "A type of website", correct: false },
        { text: "A robot's name", correct: false }
      ],
      correctMsg: "Right! A prompt is your instructions to the AI.",
      wrongMsg: "A prompt is what YOU type, the instructions or question you give the AI, before it answers back."
    },
    {
      type: "mc",
      question: "You want ChatGPT to write a business slogan. Which prompt works BEST?",
      hint: "The winning prompt has real details.",
      options: [
        { text: "\"slogan\"", correct: false },
        { text: "\"Write 5 short, catchy slogans for a kids' dog-walking business called Paws & Go\"", correct: true },
        { text: "\"help\"", correct: false },
        { text: "\"make something good\"", correct: false }
      ],
      correctMsg: "Yes! Specific details = way better results.",
      wrongMsg: "One-word prompts like 'slogan' or 'help' are too vague. Name your business, what it does, and exactly what you want."
    },
    {
      type: "mc",
      question: "ChatGPT's first answer isn't quite what you wanted. What's the smart move?",
      hint: "Great AI users never stop at try #1.",
      options: [
        { text: "Give up and use it anyway", correct: false },
        { text: "Add more details to your prompt and try again", correct: true },
        { text: "Close the app forever", correct: false },
        { text: "Complain that AI is broken", correct: false }
      ],
      correctMsg: "Exactly! Iterating, trying again with more detail, is how pros use AI.",
      wrongMsg: "Don't settle for a so-so answer. Add more detail to your prompt and try again, that's called iterating."
    },
    {
      type: "mc",
      question: "What does Canva's Magic Studio do?",
      hint: "Think design, not sound.",
      options: [
        { text: "Uses AI to create designs like logos and posters from your text", correct: true },
        { text: "Writes song lyrics", correct: false },
        { text: "Only deletes old files", correct: false },
        { text: "Fixes your Wi-Fi", correct: false }
      ],
      correctMsg: "Right! Magic Studio turns a text description into a real design.",
      wrongMsg: "Magic Studio is Canva's AI feature, it builds designs like logos and posters straight from your text description."
    },
    {
      type: "mc",
      question: "You want Canva AI to design a logo for 'Luna's Slime Shop.' What should you tell it?",
      hint: "More useful details = a design that fits YOUR business.",
      options: [
        { text: "Nothing, just pick the first option", correct: false },
        { text: "The business name, what it sells, and colors you like", correct: true },
        { text: "Your school's name", correct: false },
        { text: "Just the word 'shop'", correct: false }
      ],
      correctMsg: "Perfect! Details help Canva AI match YOUR business.",
      wrongMsg: "Give Canva AI the business name, what it sells, and colors you like, that's how the design actually matches your business."
    }
  ],
  badges: [
    { icon: "starter", name: "Unit 1 Complete", earned: true },
    { icon: "star", name: "Tool Curious", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "AI Tools Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Unit 1 Champion", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
