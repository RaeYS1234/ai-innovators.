<script>
const CHANNEL_ICON = `<svg viewBox="0 0 64 64"><circle cx="16" cy="32" r="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/><circle cx="48" cy="16" r="7" fill="#22c55e" stroke="#15803d" stroke-width="2"/><circle cx="48" cy="48" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><line x1="22" y1="28" x2="42" y2="18" stroke="#94a3b8" stroke-width="2.5"/><line x1="22" y1="36" x2="42" y2="46" stroke="#94a3b8" stroke-width="2.5"/></svg>`;

runLesson({
  lessonId: "startup-fundamentals-4-1",
  courseUrl: "course-startup-fundamentals.html",
  tag: "UNIT 4 · LESSON 4.1",
  title: "Acquisition Channels",
  subtitle: "The different paths customers take to discover your startup",
  steps: [
    {
      type: "vocab",
      word: "Acquisition Channel",
      pronounce: "say it: ak-wih-ZIH-shun CHAN-uhl",
      definition: "An <b>acquisition channel</b> is any path a startup uses to get new customers, like social media, search engines, word of mouth, or ads.",
      example: "A startup might get customers through Instagram ads, a friend's recommendation, or a Google search, each is a different acquisition channel.",
      icon: CHANNEL_ICON
    },
    {
      type: "teach",
      title: "Where Do Customers Actually Come From?",
      body: "Common acquisition channels include: <b>paid ads</b> (pay to get seen), <b>content/SEO</b> (people find you through search or helpful content), <b>social media</b>, <b>word of mouth</b> (referrals), and <b>partnerships</b>. Smart founders test several small channels early, then pour resources into whichever one brings customers most affordably.",
      examples: ["Paid ads: fast but costs money", "Word of mouth: slow but free and trusted", "Content/SEO: builds up over time"]
    },
    {
      type: "mc",
      question: "What is an \"acquisition channel\"?",
      hint: "Think about how someone finds your product.",
      options: [
        { text: "A path a startup uses to get new customers", correct: true },
        { text: "A type of bank account for startups", correct: false },
        { text: "A legal document required to launch", correct: false },
        { text: "A tool for tracking employee hours", correct: false }
      ],
      correctMsg: "Right! It's any path that brings you new customers.",
      wrongMsg: "An acquisition channel is a path a startup uses to reach and gain new customers."
    },
    {
      type: "mc",
      question: "Which of these is an example of \"word of mouth\" as an acquisition channel?",
      hint: "Think about people telling their friends.",
      options: [
        { text: "A happy customer tells their friend about the product, and the friend signs up", correct: true },
        { text: "Paying Google to show an ad at the top of search results", correct: false },
        { text: "Buying a billboard ad on the highway", correct: false },
        { text: "Sending a mass email blast to strangers", correct: false }
      ],
      correctMsg: "Yes! Word of mouth is customers referring other people directly.",
      wrongMsg: "Word of mouth happens when existing customers tell others, who then sign up too."
    },
    {
      type: "mc",
      question: "Why do smart founders TEST several channels early instead of picking just one right away?",
      hint: "Think about not knowing what works yet.",
      options: [
        { text: "They don't yet know which channel will bring customers most affordably", correct: true },
        { text: "Testing multiple channels is required by law", correct: false },
        { text: "It guarantees the startup will never fail", correct: false },
        { text: "All channels always work exactly the same for every startup", correct: false }
      ],
      correctMsg: "Correct! Testing helps you discover which channel actually works best for YOUR startup.",
      wrongMsg: "Founders test multiple channels because they don't yet know which one works best and cheapest for them."
    },
    {
      type: "mc",
      question: "A startup finds that paid ads bring customers fast but cost a lot, while word of mouth is slower but free. What's a smart strategy?",
      hint: "Think about using both strengths.",
      options: [
        { text: "Use paid ads for an early boost, while building word of mouth for cheaper long-term growth", correct: true },
        { text: "Only ever use paid ads and ignore word of mouth completely", correct: false },
        { text: "Avoid all acquisition channels entirely", correct: false },
        { text: "Wait until the startup is huge before trying any channel", correct: false }
      ],
      correctMsg: "Exactly! Combining fast paid channels with slower organic ones is a common smart strategy.",
      wrongMsg: "A smart approach often blends a fast paid channel with a slower, cheaper organic one like word of mouth."
    }
  ],
  badges: [
    { icon: "bulb", name: "Channel Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Growth Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Acquisition Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
