<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">PRACTICE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Calculate!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>

    <p class="complete-subtitle">You're crushing the math. Here's what you earned:</p>

      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>

</div>

    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>

<script src="lesson-engine.js"></script>
<script>
const PROFIT_ICON = `<svg viewBox="0 0 64 64"><path d="M20 8 L 44 8 L 44 28 C 44 36 38 42 32 42 C 26 42 20 36 20 28 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/><rect x="26" y="42" width="12" height="8" fill="#d97706"/><rect x="18" y="50" width="28" height="6" rx="2" fill="#92400e"/><text x="32" y="28" font-size="14" fill="white" text-anchor="middle" font-weight="900" font-family="sans-serif">$</text></svg>`;

runLesson({
  lessonId: "business-101-2-3",
  tag: "UNIT 2 · PRACTICE",
  title: "Calculate Profit",
  subtitle: "Time to put it all together! Profit = Revenue − Cost.",
  steps: [
    {
      type: "vocab",
      word: "Profit",
      pronounce: "say it: PRAW-fit",
      definition: "<b>Profit</b> is the money LEFT OVER after you pay your costs. It's the goal of every business!<br><br>👉 <b>Profit = Revenue − Cost</b>",
      example: "Revenue $10 − Cost $4 = <b>$6 profit!</b> That's yours to keep.",
      icon: PROFIT_ICON
    },
    {
      type: "teach",
      title: "The Profit Formula",
      body: "Always remember: <b>Profit = Revenue − Cost</b>. If your revenue is bigger than your costs, you have profit. If your costs are bigger, you have a <b>loss</b> (you lost money)!",
      examples: ["Revenue $20 − Cost $10 = $10 profit!", "Revenue $5 − Cost $8 = -$3 loss 😬"]
    },
    {
      type: "math",
      question: "Easy one!",
      story: "Revenue: $10. Cost: $3. What's your profit?",
      equation: "$10 − $3 = ?",
      answer: 7,
      correctMsg: "Yes! $7 profit.",
      wrongMsg: "10 − 3 = 7."
    },
    {
      type: "math",
      question: "Lemonade stand profit",
      story: "You sold 10 cups at $2 each (revenue = $20). You spent $5 on lemons and sugar (cost = $5). Profit?",
      equation: "$20 − $5 = ?",
      answer: 15,
      correctMsg: "Awesome! $15 profit.",
      wrongMsg: "20 − 5 = 15."
    },
    {
      type: "math",
      question: "Cookie shop profit",
      story: "Sold 12 cookies at $3 each (revenue = $36). Spent $14 on ingredients. Profit?",
      equation: "$36 − $14 = ?",
      answer: 22,
      correctMsg: "Great! $22 profit.",
      wrongMsg: "36 − 14 = 22."
    },
    {
      type: "math",
      question: "Bracelet boss",
      story: "You sold 8 bracelets at $5 each (revenue = $40). You spent $12 on beads. Profit?",
      equation: "$40 − $12 = ?",
      answer: 28,
      correctMsg: "Yes! $28 profit. You're a profit pro!",
      wrongMsg: "40 − 12 = 28."
    },
    {
      type: "mc",
      question: "What happens if your costs are HIGHER than your revenue?",
      hint: "Think about the formula!",
      options: [
        { text: "You make extra profit", correct: false },
        { text: "You break even", correct: false },
        { text: "You have a loss (you lost money)", correct: true },
        { text: "Nothing happens", correct: false }
      ],
      correctMsg: "Right! Cost > Revenue = LOSS. That's why entrepreneurs work to keep costs LOW.",
      wrongMsg: "When costs are higher than revenue, you LOSE money. Smart entrepreneurs keep costs low!"
    }
  ],
  badges: [
    { icon: "money", name: "Profit Pioneer", earned: true },
    { icon: "star", name: "Math Star", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Profit Pro", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Profit Champion", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
