<script>
runLesson({
  lessonId: "marketing-branding-1-4",
  courseUrl: "course-marketing-branding.html",
  tag: "UNIT 1 · PRACTICE",
  title: "Logo & Visual Identity",
  subtitle: "Your logo is just the start — a real brand looks the SAME everywhere!",
  steps: [
    {
      type: "teach",
      title: "What is Visual Identity?",
      body: "<b>Visual identity</b> is your logo PLUS your colors, fonts, and style used consistently everywhere — your website, packaging, and posts. When everything matches, people instantly know it's YOUR brand.",
      examples: ["Same logo", "Same colors", "Same fonts everywhere"]
    },
    {
      type: "mc",
      question: "What is \"visual identity\"?",
      hint: "Think bigger than just a logo.",
      options: [
        { text: "Your logo, colors, and fonts used consistently everywhere", correct: true },
        { text: "Just your business's phone number", correct: false },
        { text: "A random new look every single day", correct: false },
        { text: "Only your business's price list", correct: false }
      ],
      correctMsg: "Right! Visual identity is the consistent LOOK across your whole brand.",
      wrongMsg: "Visual identity is your logo, colors, and fonts — used the SAME way everywhere."
    },
    {
      type: "mc",
      question: "Your logo is blue and yellow. Your website is purple and orange. Your flyers are green. What's the problem?",
      hint: "Think about recognition.",
      options: [
        { text: "Nothing matches, so people won't recognize it's the same brand", correct: true },
        { text: "There's no problem, more colors are always better", correct: false },
        { text: "The logo should have even MORE colors added", correct: false },
        { text: "Colors don't matter for branding", correct: false }
      ],
      correctMsg: "Exactly! Mismatched colors confuse people and weaken your brand.",
      wrongMsg: "When colors don't match across your logo, website, and flyers, people won't recognize it's all you."
    },
    {
      type: "mc",
      question: "You're designing flyers, a website, and packaging for the same lemonade stand. What should stay consistent?",
      hint: "Think logo, colors, fonts.",
      options: [
        { text: "The logo, main colors, and font style", correct: true },
        { text: "Nothing — mix it all up for variety", correct: false },
        { text: "Only the business's opening hours", correct: false },
        { text: "Just the price of lemonade", correct: false }
      ],
      correctMsg: "Yes! Keep the logo, colors, and fonts the same across everything.",
      wrongMsg: "Your logo, colors, and fonts should stay the same across flyers, website, and packaging."
    },
    {
      type: "mc",
      question: "FINAL: Why do big brands like Coca-Cola use the exact same red and font on EVERY product?",
      hint: "Think about instant recognition.",
      options: [
        { text: "So people instantly recognize it's Coca-Cola anywhere in the world", correct: true },
        { text: "Because they only had one crayon", correct: false },
        { text: "It's required by law to use one color", correct: false },
        { text: "It saves them zero money", correct: false }
      ],
      correctMsg: "PERFECT! Consistency = instant recognition anywhere, anytime.",
      wrongMsg: "Using the same look everywhere builds instant recognition — that's the whole point of visual identity."
    }
  ],
  badges: [
    { icon: "brain", name: "Identity Builder", earned: true },
    { icon: "star", name: "Consistency Checker", earned: ({ correct }) => correct >= 2 },
    { icon: "bulb", name: "Brand Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "Visual Identity Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
