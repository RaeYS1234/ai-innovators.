      type: "mc",

      hint: "Think about the core feature and success signal.",
      options: [
        { text: "The one core feature to build, who will test it, and how they'll measure success", correct: true },
        { text: "The exact font size for every single button", correct: false },
        { text: "Nothing — it's best to start building immediately with no plan", correct: false },
        { text: "The company's five-year hiring plan", correct: false }

      question: "Why is it risky to start building without a clear success signal in mind?",
      hint: "Think about knowing whether it worked.",

        { text: "There's no risk at all in skipping this step", correct: false },
        { text: "Success signals are only needed for huge companies", correct: false },
