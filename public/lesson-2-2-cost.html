<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What is Cost? | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Great job! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const COST_ICON = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5"/><line x1="14" y1="42" x2="50" y2="14" stroke="white" stroke-width="4" stroke-linecap="round"/><text x="32" y="42" font-size="22" fill="white" text-anchor="middle" font-weight="900" font-family="sans-serif">$</text></svg>`;

runLesson({
  lessonId: "business-101-2-2",
  tag: "UNIT 2 · LESSON 2.2",
  title: "What is Cost?",
  subtitle: "Now let's learn about the money businesses SPEND.",
  steps: [
    {
      type: "vocab",
      word: "Cost",
      pronounce: "say it: KAWST",
      definition: "<b>Cost</b> is all the money a business spends to make or sell its stuff. Think of it as <b>money OUT</b>.",
      example: "To bake 5 cookies, you bought $4 of flour, sugar, and chocolate chips. Your cost is <b>$4</b>.",
      icon: COST_ICON
    },
    {
      type: "teach",
      title: "Cost = Money OUT",
      body: "Every business has costs. You need <b>supplies</b> to make stuff, sometimes <b>tools</b>, and even things like <b>signs</b> to tell people about your business!",
      examples: ["Lemonade stand: lemons + sugar", "Cookie business: flour + chocolate chips", "Bracelets: beads + string"]
    },
    {
      type: "mc",
      question: "Which of these is a COST for a lemonade stand?",
      hint: "Cost = money you SPEND.",
      options: [
        { text: "Money customers pay for lemonade", correct: false },
        { text: "Money you spend on lemons and sugar", correct: true },
        { text: "Money in your piggy bank", correct: false },
        { text: "A drawing you made", correct: false }
      ],
      correctMsg: "Yes! Lemons and sugar are supplies you must buy, that's cost!",
      wrongMsg: "Cost is the money you SPEND to run your business. Lemons + sugar are supplies = cost."
    },
    {
      type: "mc",
      question: "What do we call money going OUT of a business?",
      hint: "It's the opposite of revenue.",
      options: [
        { text: "Revenue", correct: false },
        { text: "Cost", correct: true },
        { text: "Profit", correct: false },
        { text: "Allowance", correct: false }
      ],
      correctMsg: "Right! Money OUT = Cost.",
      wrongMsg: "Cost = money OUT. Revenue = money IN. Don't mix them up!"
    },
    {
      type: "match",
      question: "Match each business with one of its costs!",
      hint: "What does each business need to BUY?",
      pairs: [
        { prompt: "🍪 Cookie Stand", answer: "Flour and sugar" },
        { prompt: "📿 Bracelet Shop", answer: "Beads and string" },
        { prompt: "🐕 Dog Walking", answer: "Leashes and treats" }
      ],
      correctMsg: "Perfect! Every business needs supplies = cost.",
      wrongMsg: "Some matches were off. Think about what supplies each business needs."
    },
    {
      type: "mc",
      question: "🛒 Smart business owners try to keep their costs LOW. Which choice keeps your costs down?",
      hint: "Lower cost means less money going OUT.",
      options: [
        { text: "Buy your supplies when they're on sale", correct: true },
        { text: "Buy the most expensive brand of everything", correct: false },
        { text: "Waste half your ingredients", correct: false },
        { text: "Buy way more than you need", correct: false }
      ],
      correctMsg: "Yes! Spending less on supplies = lower cost = more money you get to keep.",
      wrongMsg: "Lower cost = less money OUT. Buying on sale is a smart way to spend less!"
    }
  ],
  badges: [
    { icon: "money", name: "Cost Tracker", earned: true },
    { icon: "star", name: "Money Smart", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Cost Expert", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Budget Boss", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
