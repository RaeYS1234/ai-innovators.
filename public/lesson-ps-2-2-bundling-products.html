<script>
const BUNDLE_ICON = `<svg viewBox="0 0 64 64"><rect x="10" y="26" width="44" height="30" rx="2" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5"/><rect x="10" y="26" width="44" height="10" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2.5"/><rect x="28" y="10" width="8" height="46" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><path d="M20 10 C 20 2 30 2 32 10 C 34 2 44 2 44 10 L 36 14 L 28 14 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/></svg>`;

runLesson({
  lessonId: "pricing-strategy-2-2",
  courseUrl: "course-pricing-strategy.html",
  tag: "UNIT 2 · LESSON 2.2",
  title: "Bundling Products",
  subtitle: "Sell more by putting things together",
  steps: [
    {
      type: "vocab",
      word: "Bundle",
      pronounce: "say it: BUHN-dul",
      definition: "A <b>bundle</b> is when you sell two or more products together for one price — usually a little cheaper than buying each one separately.",
      example: "A \"Starter Kit\" with a candle + matches + a gift box, sold together for $18 instead of $22 separately.",
      icon: BUNDLE_ICON
    },
    {
      type: "teach",
      title: "Why Bundling Works",
      body: "Bundling helps in several ways: it increases the average amount each customer spends, it helps move slower-selling items by pairing them with favorites, it feels like a better deal to customers, and it makes buying easier — one choice instead of many.",
      examples: ["Bigger average sale", "Moves slow items", "Feels like a deal", "Easier decision for buyer"]
    },
    {
      type: "mc",
      question: "What is a \"bundle\"?",
      hint: "Think about how many products are involved.",
      options: [
        { text: "Multiple products sold together for one price", correct: true },
        { text: "A single product on sale", correct: false },
        { text: "A type of discount code", correct: false },
        { text: "A customer review", correct: false }
      ],
      correctMsg: "Right! A bundle groups multiple products into one price.",
      wrongMsg: "A bundle means selling two or more products together for one combined price."
    },
    {
      type: "mc",
      question: "A candle costs $10 alone. Soap costs $6 alone. Bundled together they cost $13. What's the benefit for the CUSTOMER?",
      hint: "Compare $13 to buying both separately ($16).",
      options: [
        { text: "They save $3 compared to buying separately", correct: true },
        { text: "They pay more than buying separately", correct: false },
        { text: "Nothing changes for them", correct: false },
        { text: "They get a free extra item", correct: false }
      ],
      correctMsg: "Yes! $10 + $6 = $16 separately, but the bundle is $13 — a $3 savings.",
      wrongMsg: "Compare: buying separately costs $16, but the bundle costs $13 — that's $3 in savings for the customer."
    },
    {
      type: "mc",
      question: "Why might a business bundle a slow-selling item with a popular one?",
      hint: "Think about how the popular item can \"help\" the other.",
      options: [
        { text: "It helps the slow item sell by riding along with a favorite", correct: true },
        { text: "It makes the slow item impossible to sell", correct: false },
        { text: "It has no effect on sales at all", correct: false },
        { text: "It's illegal to sell items alone", correct: false }
      ],
      correctMsg: "Correct! Pairing a slow item with a favorite can boost its sales.",
      wrongMsg: "Bundling a slow-selling item with a popular one can help the slow item finally move."
    },
    {
      type: "mc",
      question: "What's a real-world example of bundling?",
      hint: "Think about fast food menus.",
      options: [
        { text: "A fast food \"combo meal\" — burger + fries + drink for one price", correct: true },
        { text: "Buying just a burger alone", correct: false },
        { text: "A store closing early for the day", correct: false },
        { text: "A price increase with no extra items", correct: false }
      ],
      correctMsg: "Exactly! Combo meals are a classic real-world bundle.",
      wrongMsg: "A combo meal — multiple items for one price — is a textbook example of bundling."
    }
  ],
  badges: [
    { icon: "bulb", name: "Bundle Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Bundle Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Bundle Boss", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
