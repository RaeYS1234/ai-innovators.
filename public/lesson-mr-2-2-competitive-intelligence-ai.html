<script>
runLesson({
  lessonId: "market-research-2-2",
  courseUrl: "course-market-research.html",
  tag: "UNIT 2 · PRACTICE",
  title: "Competitive Intelligence with AI",
  subtitle: "Practice using AI to quickly size up your competitors",
  steps: [
    {
      type: "teach",
      title: "Speed Up Competitor Research",
      body: "AI can help you quickly summarize a competitor's website, pull out their pricing structure, list their main features, and compare tone/positioning, tasks that used to take hours of manual browsing. A smart prompt: \"Summarize this competitor's pricing page and list their main features in a table.\"",
      examples: []
    },
    {
      type: "mc",
      question: "Which prompt would help you quickly get useful competitor intel from AI?",
      hint: "Look for a specific, actionable request.",
      options: [
        { text: "\"Summarize this competitor's website and list their main features and pricing in a table.\"", correct: true },
        { text: "\"Tell me about competitors.\"", correct: false },
        { text: "\"Competitors, I guess?\"", correct: false },
        { text: "\"Is my business good?\"", correct: false }
      ],
      correctMsg: "Yes! It's specific about what to extract and how to format it.",
      wrongMsg: "The strongest prompt specifies exactly what to extract (features, pricing) and how to format it."
    },
    {
      type: "mc",
      question: "A founder wants to know how a competitor's TONE differs from theirs. What's a good way to use AI here?",
      hint: "Think about comparing voice/style.",
      options: [
        { text: "Paste both websites' copy and ask AI to compare tone, formality, and target audience", correct: true },
        { text: "Ignore tone completely since it never matters", correct: false },
        { text: "Ask AI to guess without giving it any text at all", correct: false },
        { text: "Only look at the competitor's logo colors", correct: false }
      ],
      correctMsg: "Correct! Giving AI the actual text from both sites lets it compare tone directly.",
      wrongMsg: "Pasting both companies' copy and asking AI to compare tone and audience gives a useful, grounded comparison."
    },
    {
      type: "mc",
      question: "Why is AI-assisted competitive research still not a full substitute for real-world checks (like actually trying a competitor's product)?",
      hint: "Think about firsthand experience.",
      options: [
        { text: "AI summarizes what's written online, but hands-on experience reveals things text alone might miss", correct: true },
        { text: "AI can never read any competitor websites at all", correct: false },
        { text: "Trying a competitor's product is illegal", correct: false },
        { text: "There's no difference between reading about something and trying it", correct: false }
      ],
      correctMsg: "Exactly! Hands-on experience often reveals details that written content alone misses.",
      wrongMsg: "AI summarizes written content, but hands-on experience with a product often reveals things text alone misses."
    },
    {
      type: "mc",
      question: "What's a smart way to use AI to track MULTIPLE competitors at once?",
      hint: "Think about structured comparisons.",
      options: [
        { text: "Ask AI to build a comparison table across all competitors on the same set of criteria", correct: true },
        { text: "Look at only one competitor and ignore all the others", correct: false },
        { text: "Ask AI totally unrelated questions about the weather", correct: false },
        { text: "Never write anything down or organize the findings", correct: false }
      ],
      correctMsg: "Right! A structured comparison table makes multiple competitors easy to evaluate side by side.",
      wrongMsg: "Asking AI to build a structured comparison table makes tracking multiple competitors much easier."
    }
  ],
  badges: [
    { icon: "bulb", name: "Intel Starter", earned: true },

    { icon: "brain", name: "Competitor Smart", earned: ({ correct }) => correct >= 3 },
