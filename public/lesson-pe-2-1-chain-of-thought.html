<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chain-of-Thought Prompting — AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again — you got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
const CHAIN_ICON = `<svg viewBox="0 0 64 64"><circle cx="16" cy="20" r="10" fill="none" stroke="#059669" stroke-width="4"/><circle cx="32" cy="32" r="10" fill="none" stroke="#059669" stroke-width="4"/><circle cx="48" cy="44" r="10" fill="none" stroke="#059669" stroke-width="4"/></svg>`;

runLesson({
  lessonId: "prompt-engineering-2-1",
  courseUrl: "course-prompt-engineering.html",
  tag: "UNIT 2 · LESSON 2.1",
  title: "Chain-of-Thought Prompting",
  subtitle: "Getting AI to think through problems step by step, instead of jumping to an answer",
  steps: [
    {
      type: "vocab",
      word: "Chain-of-Thought",
      pronounce: "say it: CHAYN-of-THAWT",
      definition: "<b>Chain-of-thought prompting</b> means asking the AI to explain its reasoning step by step before giving a final answer, which often improves accuracy on tricky problems.",
      example: "Instead of \"What's 15% tip on $84?\", asking \"Work through this step by step: what's 15% tip on $84?\" often gets a more reliable answer.",
      icon: CHAIN_ICON
    },
    {
      type: "teach",
      title: "Why \"Think Step by Step\" Works",
      body: "When you ask an AI to reason step by step, you're giving it room to work through a problem piece by piece — similar to how a person shows their work in math class. This is especially powerful for math, logic puzzles, and multi-step decisions, where jumping straight to an answer increases the chance of a mistake.",
      examples: ["Great for: math problems, logic puzzles, multi-step decisions", "Simple trigger phrase: \"think step by step\"", "Showing work reduces careless errors"]
    },
    {
      type: "mc",
      question: "What does chain-of-thought prompting ask the AI to do?",
      hint: "Think about \"showing work.\"",
      options: [
        { text: "Explain its reasoning step by step before the final answer", correct: true },
        { text: "Answer in the fewest words possible with no explanation", correct: false },
        { text: "Only respond using emojis", correct: false },
        { text: "Skip straight to a random guess", correct: false }
      ],
      correctMsg: "Right! It asks the AI to reason through steps before answering.",
      wrongMsg: "Chain-of-thought prompting asks the AI to explain its reasoning step by step before the final answer."
    },
    {
      type: "mc",
      question: "For which type of task is chain-of-thought prompting MOST helpful?",
      hint: "Think about multi-step problems.",
      options: [
        { text: "A tricky multi-step math or logic problem", correct: true },
        { text: "Asking what color the sky is", correct: false },
        { text: "Saying hello to the AI", correct: false },
        { text: "Asking for the current date", correct: false }
      ],
      correctMsg: "Correct! Multi-step reasoning tasks benefit the most from thinking step by step.",
      wrongMsg: "Chain-of-thought helps most with multi-step reasoning tasks like tricky math or logic problems."
    },
    {
      type: "mc",
      question: "What's a simple phrase you can add to a prompt to trigger chain-of-thought reasoning?",
      hint: "Think of a short instruction about steps.",
      options: [
        { text: "\"Think step by step.\"", correct: true },
        { text: "\"Answer immediately with no thinking.\"", correct: false },
        { text: "\"Ignore the question.\"", correct: false },
        { text: "\"Use only emojis.\"", correct: false }
      ],
      correctMsg: "Yes! \"Think step by step\" is a classic chain-of-thought trigger phrase.",
      wrongMsg: "\"Think step by step\" is a simple, effective phrase to trigger chain-of-thought reasoning."
    }
  ],
  badges: [
    { icon: "bulb", name: "Reasoning Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Chain Thinker", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Reasoning Pro", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
