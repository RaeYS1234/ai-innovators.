<script>
const SCALE_ICON = `<svg viewBox="0 0 64 64"><rect x="30" y="6" width="4" height="44" fill="#64748b"/><path d="M8 20 L20 20 L14 34 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/><path d="M44 20 L56 20 L50 34 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/><line x1="8" y1="20" x2="56" y2="20" stroke="#64748b" stroke-width="3"/><rect x="18" y="50" width="28" height="6" rx="2" fill="#64748b"/></svg>`;

runLesson({
  lessonId: "pricing-strategy-1-2",
  courseUrl: "course-pricing-strategy.html",
  tag: "UNIT 1 · LESSON 1.2",
  title: "Cost-Plus vs Value-Based",
  subtitle: "Two totally different ways to land on the perfect price",
  steps: [
    {
      type: "vocab",
      word: "Cost-Plus Pricing",
      pronounce: "say it: KOST-PLUHS PRY-sing",
      definition: "Add up what it costs to make your product, then add a <b>markup</b> (extra amount) on top to get your price.",
      example: "It costs $4 to make a candle. You add a $6 markup → you sell it for $10.",
      icon: SCALE_ICON
    },
    {
      type: "teach",
      title: "Two Ways to Set a Price",
      body: "<b>Cost-Plus Pricing</b> is simple and safe: cost + markup, guaranteeing profit on every sale. <b>Value-Based Pricing</b> is different, it prices based on what the item is WORTH to the customer, which can let you charge much more for something special or unique.",
      examples: ["Cost-Plus: cost + markup", "Value-Based: what it's worth to the customer"]
    },
    {
      type: "mc",
      question: "In Cost-Plus pricing, how do you find the price?",
      hint: "It's right there in the name.",
      options: [
        { text: "Add your costs + a markup", correct: true },
        { text: "Copy a competitor's price exactly", correct: false },
        { text: "Guess randomly", correct: false },
        { text: "Only look at how customers feel", correct: false }
      ],
      correctMsg: "Yes! Cost-Plus = Cost + Markup, every time.",
      wrongMsg: "Cost-Plus pricing means adding your cost and a markup together."
    },
    {
      type: "mc",
      question: "In Value-Based pricing, what matters most?",
      hint: "It's about the customer's perspective.",
      options: [
        { text: "How much customers believe it's worth to them", correct: true },
        { text: "Only your production cost", correct: false },
        { text: "Your mood that day", correct: false },
        { text: "The weather outside", correct: false }
      ],
      correctMsg: "Exactly! Value-Based pricing follows perceived worth, not just cost.",
      wrongMsg: "Value-Based pricing is set by how much VALUE the customer believes they're getting."
    },
    {
      type: "mc",
      question: "A custom hand-painted skateboard costs $20 to make but sells for $80 because it's one-of-a-kind art. Which pricing strategy is this?",
      hint: "The price is way above the cost because of uniqueness.",
      options: [
        { text: "Value-Based Pricing", correct: true },
        { text: "Cost-Plus Pricing", correct: false },
        { text: "No pricing strategy at all", correct: false },
        { text: "Random pricing", correct: false }
      ],
      correctMsg: "Right! The price reflects how special and valuable it feels to buyers, not just materials.",
      wrongMsg: "Since the price is based on how unique/valuable it feels rather than just cost, that's Value-Based Pricing."
    },
    {
      type: "mc",
      question: "A phone case costs $2 to make. You add a $3 markup and sell it for $5. Which strategy is this?",
      hint: "Cost + markup = ?",
      options: [
        { text: "Cost-Plus Pricing", correct: true },
        { text: "Value-Based Pricing", correct: false },
        { text: "Discount pricing", correct: false },
        { text: "Bundle pricing", correct: false }
      ],
      correctMsg: "Correct! $2 cost + $3 markup = $5 price, classic Cost-Plus.",
      wrongMsg: "Cost + markup = price is the definition of Cost-Plus Pricing."
    }
  ],
  badges: [
    { icon: "bulb", name: "Strategy Starter", earned: true },
    { icon: "star", name: "Quick Learner", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Pricing Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Strategy Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
