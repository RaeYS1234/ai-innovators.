<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainstorm Like a Pro | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">PRACTICE</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Start Brainstorming!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Brainstorm Pro!</h1>
    <p class="complete-subtitle">You matched problems to ideas like a real founder. Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! Brainstorming takes practice!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "business-idea-1-3",
  courseUrl: "course-business-idea.html",
  tag: "UNIT 1 · PRACTICE",
  title: "Brainstorm Like a Pro",
  subtitle: "Match each everyday problem to the business idea that could fix it!",
  steps: [
    {
      type: "match",
      question: "Round 1: Easy matches",
      hint: "Tap an answer, then tap the problem.",
      pairs: [
        { prompt: "Kids get bored waiting in the car pool line", answer: "Car ride game kits" },
        { prompt: "People forget where they parked", answer: "Parking spot photo app" },
        { prompt: "Snacks run out at school events", answer: "Snack delivery business" }
      ],
      correctMsg: "Easy round done! You're spotting solutions fast.",
      wrongMsg: "Match each problem to the idea that fixes THAT exact problem."
    },
    {
      type: "match",
      question: "Round 2: Real-life problems",
      hint: "Think about who has this problem and what would help.",
      pairs: [
        { prompt: "Grandparents struggle to video call family", answer: "Simple video-call helper guide" },
        { prompt: "Dogs get bored home alone all day", answer: "Interactive dog toy business" },
        { prompt: "New students don't know anyone at school", answer: "Buddy-matching club" }
      ],
      correctMsg: "Nice! You're thinking like a real founder.",
      wrongMsg: "Read each problem carefully, which idea solves THAT one?"
    },
    {
      type: "match",
      question: "Round 3: Boss level!",
      hint: "These are trickier, read closely.",
      pairs: [
        { prompt: "Kids don't know what chores earn allowance", answer: "Chore-tracking chart business" },
        { prompt: "Neighbors have too many old toys and clothes", answer: "Kids' swap-meet event" },
        { prompt: "Little siblings ruin older kids' art supplies", answer: "Lockable art supply box" }
      ],
      correctMsg: "Boss level beat! You brainstorm like a pro.",
      wrongMsg: "Each problem has ONE best-fit idea. Think about exactly what's being asked for."
    },
    {
      type: "mc",
      question: "During a real brainstorm, what's the #1 rule?",
      hint: "Think about what helps ideas flow.",
      options: [
        { text: "Judge every idea immediately as good or bad", correct: false },
        { text: "Write down EVERY idea first, no judging yet", correct: true },
        { text: "Only think of one idea and stop", correct: false },
        { text: "Only use other people's ideas", correct: false }
      ],
      correctMsg: "YES! Quantity first, judging later, that's how the best ideas surface.",
      wrongMsg: "The golden rule of brainstorming: write down EVERYTHING first, judge later!"
    }
  ],
  badges: [
    { icon: "bulb", name: "Idea Matcher", earned: true },
    { icon: "star", name: "Fast Thinker", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Brainstorm Pro", earned: ({ correct }) => correct >= 3 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Idea Machine", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
