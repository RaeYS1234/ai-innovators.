<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit 1 Quiz | AI Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-shared.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="hearts">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28 C 6 20 2 14 2 10 C 2 6 5 3 9 3 C 12 3 14 5 16 8 C 18 5 20 3 23 3 C 27 3 30 6 30 10 C 30 14 26 20 16 28 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/></svg>
      <span id="heartsCount">3</span>
    </div>
  </div>
  <div class="screen active" id="screen-welcome">
    <div class="lesson-tag" id="lesson-tag">LESSON</div>
    <div class="mascot" id="welcomeMascot"></div>
    <h1 class="welcome-title" id="welcome-title"></h1>
    <p class="welcome-subtitle" id="welcome-subtitle"></p>
    <button class="btn go" id="startBtn">Let's Go!</button>
  </div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-complete">
    <div class="mascot" id="completeMascot"></div>
    <h1 class="complete-title">Lesson Complete!</h1>
    <p class="complete-subtitle">Awesome work! Here's what you earned:</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">XP Earned</div><div class="stat-value xp" id="finalXP">0</div></div>
      <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value score" id="finalScore">0%</div></div>
      <div class="stat-box"><div class="stat-label">Hearts Left</div><div class="stat-value" style="color:#ef4444;" id="finalHearts">3</div></div>
    </div>
    <h3 style="margin: 28px 0 14px; color: #0c4a6e; font-weight: 900; font-family:'Nunito',sans-serif;">Badges You Earned:</h3>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn go" id="backToCourseBtn">Back to Course →</button>
    <button class="btn ghost" style="margin-top:12px;" id="playAgainBtn">Play Again</button>
  </div>
  <div class="screen" id="screen-gameover">
    <div class="mascot" id="gameoverMascot"></div>
    <h1 class="complete-title" style="color:#b91c1c;">Out of Hearts!</h1>
    <p class="complete-subtitle">Try again! You got this!</p>
    <button class="btn danger" id="retryBtn">Try Again</button>
  </div>
</div>
<div class="feedback" id="feedback">
  <div class="feedback-inner">
    <div><div class="feedback-text" id="feedbackText"></div><div class="feedback-explain" id="feedbackExplain"></div></div>
    <button class="btn go" onclick="window._lessonNext()">Continue</button>
  </div>
</div>
<script src="lesson-engine.js"></script>
<script>
runLesson({
  lessonId: "business-idea-1-3",
  courseUrl: "course-business-idea.html",
  tag: "UNIT 1 CHECK",
  title: "Unit 1 Quiz",
  subtitle: "Show what you know about finding great ideas!",
  steps: [
    {
      type: "mc",
      question: "Where do the best business ideas usually come from?",
      hint: "Think about what we've learned so far.",
      options: [
        { text: "Problems you notice", correct: true },
        { text: "Copying a friend exactly", correct: false },
        { text: "Random guessing", correct: false },
        { text: "Ignoring people", correct: false }
      ],
      correctMsg: "Right! Problems you notice are where great ideas start.",
      wrongMsg: "The best ideas come from noticing a PROBLEM and deciding to fix it."
    },
    {
      type: "mc",
      question: "Mikaila Ulmer started a lemonade business with a special ingredient to help bees. What was it?",
      hint: "Bees make this themselves.",
      options: [
        { text: "Honey", correct: true },
        { text: "Sugar cubes", correct: false },
        { text: "Chocolate", correct: false },
        { text: "Pepper", correct: false }
      ],
      correctMsg: "Yes! Honey lemonade helped save bees AND tasted great.",
      wrongMsg: "It was honey, that's what made her lemonade special and bee-friendly."
    },
    {
      type: "mc",
      question: "A 'problem' in business means...",
      hint: "It's something that bugs someone.",
      options: [
        { text: "Something that bugs people or doesn't work right", correct: true },
        { text: "A fun game", correct: false },
        { text: "A math homework page", correct: false },
        { text: "A type of candy", correct: false }
      ],
      correctMsg: "Exactly! A problem is anything that isn't working the way people want.",
      wrongMsg: "A problem is something that bugs people or doesn't work right, that's what businesses fix."
    },
    {
      type: "mc",
      question: "Justin Bieber's cupcake stand solved which problem?",
      hint: "Think about hungry travelers.",
      options: [
        { text: "Hungry people near the train station", correct: true },
        { text: "Slow trains", correct: false },
        { text: "Broken swings", correct: false },
        { text: "Boring classes", correct: false }
      ],
      correctMsg: "Yes! Hungry travelers wanted a snack, cupcakes fixed that.",
      wrongMsg: "The cupcakes fixed hunger, not trains, swings, or classes."
    },
    {
      type: "mc",
      question: "A true business idea should always...",
      hint: "It's about helping people, not just looking cool.",
      options: [
        { text: "Help or fix something for people", correct: true },
        { text: "Just look cool", correct: false },
        { text: "Cost nothing ever to run", correct: false },
        { text: "Only exist as an app", correct: false }
      ],
      correctMsg: "Right! Every good idea helps or fixes something for real people.",
      wrongMsg: "A good idea has to actually help or fix something, looking cool isn't enough."
    }
  ],
  badges: [
    { icon: "bulb", name: "Unit 1 Complete", earned: true },
    { icon: "star", name: "Quiz Taker", earned: ({ correct }) => correct >= 2 },
    { icon: "brain", name: "Idea Smart", earned: ({ correct }) => correct >= 4 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "trophy", name: "Idea Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
</body>
</html>
