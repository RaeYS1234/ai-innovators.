<script>
runLesson({
  lessonId: "pitching-investors-challenge",
  courseUrl: "course-pitching-investors.html",
  tag: "FINAL CHALLENGE",
  title: "Pitching to Investors Challenge",
  subtitle: "Real case studies, Airbnb, Snapchat, and real term sheet math. Show you can think like a founder who's raised money.",
  steps: [
    {
      type: "mc",
      question: "In 2009, Airbnb was three founders selling cereal boxes and renting air mattresses, with almost no traction. Y Combinator invested $20,000, and shortly after, Sequoia Capital invested roughly $600,000 in a seed round. Why would sophisticated investors bet real money on a company that looked this unproven?",
      hint: "Think about power-law thinking, investors aren't betting on certainty, they're betting on huge asymmetric upside.",
      options: [
        { text: "Because Airbnb already had millions of users and guaranteed profits", correct: false },
        { text: "Because early-stage VCs aren't betting on certainty, they're betting on founders and a market opportunity big enough that even a small chance of a massive outcome is worth the risk, exactly how power-law portfolio math works", correct: true },
        { text: "Because Sequoia was legally required to invest in every YC company", correct: false },
        { text: "Because the founders paid Sequoia to invest", correct: false }
      ],
      correctMsg: "Exactly. Early-stage investing is a bet on founders and a potentially massive market, not a bet on current traction, Airbnb went on to be one of the biggest power-law outcomes in venture history.",
      wrongMsg: "Airbnb had almost no traction in 2009, three founders, air mattresses, and a scrappy cereal-box fundraising stunt. Sequoia's ~$600K bet reflected classic power-law thinking: at the earliest stage, investors are betting on the FOUNDERS and the SIZE of the opportunity, not on proof the business already works. A small check into a company with a real shot at becoming enormous can outperform dozens of 'safer' bets that never break out."
    },
    {
      type: "mc",
      question: "In 2013, Facebook offered to buy Snapchat for $3 billion in cash. Snapchat's founders turned it down. Assuming they believed in the company's long-term trajectory, what does this decision illustrate about founder-investor dynamics?",
      hint: "Think about the tradeoff between a guaranteed, certain outcome now versus a much larger, uncertain outcome later.",
      options: [
        { text: "Founders should always take the largest offer on the table immediately, no matter what", correct: false },
        { text: "Founders sometimes bet on their own long-term vision over a guaranteed, certain payout, a high-conviction, high-risk decision that can pay off enormously or turn out to be a costly mistake, but reflects real founder conviction", correct: true },
        { text: "It proves acquisition offers are always fake and never worth considering", correct: false },
        { text: "It shows that $3 billion was an insultingly low number with no real value", correct: false }
      ],
      correctMsg: "Right. Rejecting a guaranteed $3B for a shot at a bigger independent future is exactly the kind of high-conviction, asymmetric bet founders (and the investors who back them) sometimes make.",
      wrongMsg: "Turning down a guaranteed $3 billion cash offer is a genuinely risky move, it could have gone badly. But it illustrates a real dynamic in founder decision-making: sometimes founders (like investors) choose to bet on a much larger, uncertain future over a smaller, guaranteed one. This isn't a universal 'always say no' lesson, it's a reminder that founders, like VCs, sometimes deliberately choose asymmetric upside over certainty, at real risk."
    },
    {
      type: "mc",
      question: "A term sheet: an investor puts in $5M for a stake that would be 10% of the company if converted to common shares, with a 1x non-participating liquidation preference. The company is later sold for $20M. The investor takes whichever is GREATER, their preference, or their as-converted share. How much does the investor receive?",
      hint: "Compare the $5M preference to what 10% of $20M would be, then take the larger number.",
      options: [
        { text: "$2M, their 10% as-converted share of the $20M sale", correct: false },
        { text: "$5M, because their 10% as-converted share ($2M) is LESS than their $5M liquidation preference, so they take the preference instead", correct: true },
        { text: "$20M, the entire sale price", correct: false },
        { text: "$7M, adding the preference and the as-converted share together", correct: false }
      ],
      correctMsg: "Correct! 10% of $20M is only $2M, which is less than their $5M preference, so the investor takes the $5M preference, the greater of the two options.",
      wrongMsg: "First calculate their as-converted share: 10% of $20M = $2M. Compare that to their $5M liquidation preference. Since $2M is LESS than $5M, the investor takes the $5M preference instead of converting to common. This is exactly why liquidation preferences matter most in modest exits, they guarantee the investor gets at least their preference amount, even when their percentage ownership alone would've been worth less."
    },
    {
      type: "mc",
      question: "A founder owns 100% of their company. They sell 20% at a seed round, then sell 15% of the company at Series A. What percentage does the founder own after both rounds?",
      hint: "Multiply the remaining percentages after each round, dilution compounds.",
      options: [
        { text: "65%, from subtracting 20% and 15% from 100%", correct: false },
        { text: "68%, from multiplying remaining stakes: 80% × 85% = 68%", correct: true },
        { text: "80%, counting only the most recent round", correct: false },
        { text: "35%, an unrelated guess", correct: false }
      ],
      correctMsg: "Right! After the seed round, the founder holds 80%. Selling 15% of the company at Series A leaves them with 85% of that 80%: 80% × 85% = 68%.",
      wrongMsg: "Dilution compounds, it multiplies remaining ownership, it doesn't simply subtract percentages. After the seed round (selling 20%), the founder holds 80%. After Series A (selling another 15% of the now-larger company), the founder retains 85% of that 80% stake: 80% × 85% = 68%. Subtracting 20% and 15% directly from 100% (getting 65%) understates the founder's true remaining ownership."
    },
    {
      type: "mc",
      question: "A SAFE has BOTH a $6M valuation cap and a 15% discount rate. The next priced round happens at a $15M valuation, at $1.00 per share. Which term will the SAFE actually convert under?",
      hint: "The investor gets whichever term produces the LOWER effective valuation (and therefore more shares) for their money.",
      options: [
        { text: "The 15% discount, since discounts are always used over caps", correct: false },
        { text: "The $6M cap, it produces a far lower effective valuation than the discount would (15% off a $15M round is still $12.75M, well above the $6M cap), so the cap is more favorable to the investor and is what they'll use", correct: true },
        { text: "Neither, SAFEs cannot have both a cap and a discount at the same time", correct: false },
        { text: "The full $15M round price, ignoring both the cap and the discount", correct: false }
      ],
      correctMsg: "Exactly. The cap wins here because $6M is dramatically lower than the discount-adjusted $12.75M, the SAFE investor always converts under whichever term is more favorable to them.",
      wrongMsg: "When a SAFE has both a cap and a discount, the investor converts using whichever produces the lower effective valuation (more shares for their money). A 15% discount off a $15M round still values the company at $12.75M for conversion purposes, nowhere close to as favorable as the $6M cap. Since $6M is dramatically lower than $12.75M, the cap is the term that actually gets used here."
    },
    {
      type: "mc",
      question: "An early investor owns 8% of a company after the seed round and has pro rata rights. The company raises a Series A that would otherwise dilute them down to 6%. What does exercising their pro rata rights let them do?",
      hint: "Pro rata rights are about participating further, not blocking the round.",
      options: [
        { text: "Block the Series A round entirely until their terms are met", correct: false },
        { text: "Invest additional money into the Series A round specifically to buy back toward their original ownership percentage instead of being diluted down to 6%", correct: true },
        { text: "Automatically receive free extra shares with no additional investment", correct: false },
        { text: "Force the founder to buy back their shares at a premium", correct: false }
      ],
      correctMsg: "Right. Pro rata rights let the investor put in more money at the new round's price to maintain closer to their prior ownership percentage, they have to pay for it, but they get the option to.",
      wrongMsg: "Pro rata rights give an existing investor the OPTION to invest additional money in a new round, specifically to avoid being diluted as much as they otherwise would be. It doesn't give them free shares or the power to block the round, it simply lets them pay to maintain more of their original ownership percentage as the company raises more capital."
    },
    {
      type: "mc",
      question: "Sequoia's early bet on Airbnb, Snapchat's founders rejecting a guaranteed $3B offer, and the advice to never rush a term sheet decision all share a common thread. What is it?",
      hint: "Think about certainty versus uncertain, asymmetric upside, on both sides of the table.",
      options: [
        { text: "They all show that bigger, faster decisions are always better in venture capital", correct: false },
        { text: "High-stakes venture outcomes are shaped by deliberate, conviction-driven decisions that weigh guaranteed near-term certainty against larger, uncertain long-term upside, for investors backing early founders, for founders weighing a buyout, and for founders being pressured to sign fast", correct: true },
        { text: "They prove that Facebook, Sequoia, and YC always made the correct decision in every case", correct: false },
        { text: "They show that venture capital outcomes are entirely random and unrelated to decision-making", correct: false }
      ],
      correctMsg: "Exactly right. Whether it's a VC funding an unproven idea, a founder weighing a buyout, or a founder resisting pressure on a term sheet, the throughline is the same: deliberate, conviction-driven decisions about certainty versus asymmetric upside, not speed, and not guaranteed outcomes.",
      wrongMsg: "The common thread isn't speed or certainty, it's the deliberate weighing of guaranteed near-term outcomes against larger, uncertain long-term upside. Sequoia bet early capital on unproven founders because the potential upside was worth the risk. Snapchat's founders turned down a certain $3B for a shot at a bigger independent future. And founders who refuse to rush a term sheet decision are protecting their ability to make that same kind of deliberate, high-stakes call clearly, not under artificial pressure. Fundraising, at every stage, comes down to conviction under uncertainty."
    }
  ],
  badges: [
    { icon: "trophy", name: "Challenge Complete", earned: true },
    { icon: "star", name: "Sharp Founder", earned: ({ correct }) => correct >= 4 },
    { icon: "brain", name: "Term Sheet Genius", earned: ({ correct }) => correct >= 6 },
    { icon: "perfect", name: "Perfect Score", earned: ({ score }) => score === 100 },
    { icon: "heart", name: "All Hearts", earned: ({ hearts }) => hearts === 3 },
    { icon: "crown", name: "Pitching to Investors Master", earned: ({ score, hearts }) => score >= 80 && hearts >= 2 }
  ]
});
</script>
